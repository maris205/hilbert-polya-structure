candidate_definition: the Gauss shift on primitive reduced real quadratic irrationals attached to one fixed positive nonsquare binary-form discriminant
family: discrete arithmetic reduction dynamics on a finite exact phase space
phase_space: primitive pairs (P,Q) representing alpha=(P+sqrt(Delta))/Q with Q positive even, primitive associated integral form, alpha greater than one, and conjugate strictly between minus one and zero
dynamics: G(alpha)=1/(alpha-floor(alpha)), equivalently P_next=aQ-P and Q_next=(Delta-P_next^2)/Q
parameters: a fixed positive nonsquare integer Delta congruent to zero or one modulo four
parameter_provenance: the binary quadratic form discriminant is intrinsic source data and is never fitted to target primes or zeros
arithmetic_origin: primitive indefinite integral binary quadratic forms and real quadratic orders at fixed discriminant
clock: one exact Gauss reduction step
normalization: Q=2A and P=-B for the primitive form [A,B,C] of discriminant Delta
determinant_convention: the finite Koopman determinant and Artin--Mazur zeta are computed only from the complete source cycle inventory
orbit_cutoff: no orbit cutoff in the theorem; discriminants through 1000 and iterates through 24 are finite regression receipts
precision: exact integer and quadratic-radical comparisons only, with no floating-point premise
training_data: none
forbidden_data: target arithmetic local data, target Euler factors, root numbers, automorphy, target divisor or functional equation, target zeros, Hilbert--Polya operators, and Route B
