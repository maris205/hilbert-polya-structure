novelty_ruling: >-
  External theorem novelty is low. The defensible contribution is a moderate
  compatibility synthesis with exact reproducibility: it separates genuinely
  open arithmetic, algebraic endpoint gauge, classical loop periods, a
  commuting normalized scattering algebra, and the projector-resolved scope
  boundary without promoting any one of them to Hilbert-Polya.
