candidate_definition: Reveal the edges of the complete labeled graph in a uniform random order and stop at the first connected prefix.
family: monotone random graph dynamics and combinatorial hitting-time laws
phase_space: labeled simple graphs on n vertices stratified by their number m of present edges
dynamics: add one uniformly chosen unused edge at each step; connected graphs form an absorbing upper set
parameters: all integers n>=1 and 0<=m<=binom(n,2), plus fixed real c in the connectivity window
parameter_provenance: all finite n are analytic; exact regression stops at n=12 and exhaustive masks stop at n=6
arithmetic_origin: none; labeled graph counts, edge permutations, isolated vertices, and Gumbel scaling are source combinatorial probability data
clock: edge count m is a discrete reveal clock, not an intrinsic arithmetic logarithmic prime clock
normalization: 2 tau_conn/n-log n in the asymptotic theorem, with m_n(c)=floor((n/2)(log n+c))
determinant_convention: none; connected graph counts and probability ratios are not promoted to determinants
orbit_cutoff: no orbit expansion is used; the exact recurrence is all-n and the finite coefficient table stops at n=12
precision: exact integer counts and reduced rational laws; decimal isolated-vertex rows are diagnostics only
training_data: none
forbidden_data: target arithmetic local data, Euler factors, root numbers, automorphy, target divisor laws, target functional equations, target zeros, and Hilbert--Polya operators
