a0:
  verdict: A0_FAIL
  evidence_status: PROVED
  strongest_evidence: the traffic solution and stationary flows are intrinsic exact source queueing quantities
  strongest_failure: no rational-prime carrier, prime-power repetition, logarithmic prime clock, or arithmetic weight exists
a1:
  verdict: A1_FAIL
  evidence_status: PROVED
  strongest_evidence: every transition and its stationary reverse have an intrinsic Markov interpretation
  strongest_failure: Poisson arrivals and service events are stochastic jumps rather than isolated deterministic primitive periodic orbits
a2:
  verdict: A2_FAIL
  evidence_status: STOP_SCOPED
  strongest_evidence: the product-form normalizer and traffic inverse are exact source formulas
  strongest_failure: neither object is a primitive-orbit zeta function or target Fredholm determinant
a3:
  verdict: A3_FAIL
  evidence_status: STOP_SCOPED
  strongest_evidence: stability, reversal, and the external departure law are analytically complete
  strongest_failure: the queueing identities provide no target continuation, divisor, functional equation, counting law, or Weil compression
a4:
  verdict: A4_FAIL
  evidence_status: STOP_SCOPED
  strongest_evidence: the network has a well-defined Markov semigroup and stationary adjoint
  strongest_failure: no same-clock natural self-adjoint target realization, unitary dynamics, scattering system, or Hilbert-Polya operator is constructed
