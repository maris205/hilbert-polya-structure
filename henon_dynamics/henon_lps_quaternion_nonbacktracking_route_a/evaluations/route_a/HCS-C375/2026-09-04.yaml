clock: the intrinsic integer time of the oriented-edge nonbacktracking map; q indexes members of the congruence family
normalization: quaternion prime 5, valency 6, least positive square root of minus one as an implementation gauge, and orientation-distinguished primitive cycles modulo cyclic shift
determinant_convention: Z_q(u) equals det(I-uH_q)^(-1), with det(I-uH_q) equal to (1-u^2)^(2|V_q|) det(I-uA_q+5u^2I)
orbit_cutoff: exact panels q equals 13, 17, 29, 37, 41 and iterates 1 through 12; the analytic source-graph theorem covers every eligible q and every iterate
precision: exact integer and finite-field arithmetic; no floating-point spectral fit is used
