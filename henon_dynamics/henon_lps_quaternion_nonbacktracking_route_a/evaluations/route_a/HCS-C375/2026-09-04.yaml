dynamics: one Hashimoto step advances an oriented Cayley edge without immediately taking its inverse generator
parameters: primes q greater than 5 and congruent to 1 modulo 4; five exact finite panels q equals 13, 17, 29, 37, 41; iterates through 12
parameter_provenance: norm-five Hamilton quaternions reduced through a chosen square root of minus one modulo q, with projective gauge invariance proved
