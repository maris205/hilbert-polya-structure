    to determine the joint action among reversible finite controls.
  a2_verdict: A2_FAIL
  a2_reason: >-
    The local determinant is exact but is the universal permutation
    determinant of a zero-dimensional scheme. Its local root-of-unity
    spectrum supplies no new Henon-derived Riemann target divisor. This does
    not deny nontrivial zeros of the classical global Artin factors.
  a3_verdict: A3_FAIL
  a3_reason: >-
    There is no completed global determinant with the xi functional equation,
    gamma factor, Riemann-von Mangoldt law, or exact divisor identity. The
    characteristic-zero global factors are classical Dedekind/Artin factors
    with extra degree, conductor, gamma-factor, and zero data; an inherited
    zeta(s) factor is nondiagnostic.
  a4_verdict: A4_FAIL
  a4_reason: >-
    Area preservation belongs to the parent real map, but no natural
    quantization of this Frobenius periodic-scheme determinant, Hilbert space,
    operator domain, or preserved spectral normalization is defined.
  overall_verdict: ROUTE_A_REJECTED

