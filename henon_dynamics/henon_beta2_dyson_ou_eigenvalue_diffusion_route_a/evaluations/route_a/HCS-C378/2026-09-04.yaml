candidate_definition: the ordered eigenvalue process of Hermitian matrix Ornstein-Uhlenbeck diffusion in the trace-metric normalization, equivalently the beta-two Doob transform of killed independent scalar Ornstein-Uhlenbeck particles in the type-A Weyl chamber
family: interacting eigenvalue diffusions, noncolliding stochastic particles, and exactly solvable reversible Markov semigroups
phase_space: the open ordered chamber W_N of strictly increasing real N-tuples, for each fixed positive integer N
dynamics: continuous nonexplosive strong Markov diffusion with unit scalar noise, reciprocal-gap repulsion, and linear confinement
parameters: N is a positive integer; time is nonnegative; the matrix Brownian motion uses the trace inner product and the Ornstein-Uhlenbeck drift is minus one half of the matrix
parameter_provenance: matrix dimension, trace-metric Brownian covariance, and the unique drift normalization that gives standard Gaussian matrix equilibrium
arithmetic_origin: none; generic beta-two random-matrix statistics are not an arithmetic carrier
clock: physical diffusion time inherited from dH_t equal to dB_t minus one half H_t dt, with no fitted rescaling
normalization: d lambda_i equals dB_i plus the sum over j not i of one over lambda_i minus lambda_j dt minus one half lambda_i dt; invariant chamber density is proportional to exp minus norm squared over two times Vandermonde squared
determinant_convention: the Karlin-McGregor determinant is a source transition kernel and the optional Fredholm determinant is only the trace-class source semigroup determinant, never a target dynamical determinant
orbit_cutoff: no periodic-orbit ledger exists; finite evidence enumerates partitions only as an exact regression receipt while the spectrum theorem is analytic for every N
precision: exact integer and rational combinatorics, symbolic polynomial identities, and fixed high-precision kernel evaluations
training_data: none
forbidden_data: target arithmetic local data, Euler factors, root numbers, automorphy, target divisors, target functional equations, target zeros, Hilbert-Polya operators, and Route B
