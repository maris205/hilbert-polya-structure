candidate_definition: the weighted contact links Sigma(2,p,q) with p and q odd, coprime, and 3 at most p less than q, equipped with the explicitly normalized weighted Brieskorn contact form
family: quasiregular contact and Seifert dynamics on weighted homogeneous singularity links
phase_space: the three-dimensional link of z0 squared plus z1 to the p plus z2 to the q inside the unit five-sphere
dynamics: the diagonal Reeb circle action with coordinate angular speeds 2 pi divided by 2, p, and q
parameters: coprime odd integers p and q with 3 at most p less than q; the evidence grid freezes q at most 101
parameter_provenance: the exponents are intrinsic weights of the source singularity and are not fitted to any arithmetic target
arithmetic_origin: integer weights, gcd and lcm periods, Seifert isotropy orders, and exact indices give a weak intrinsic arithmetic relation only
clock: Reeb time t normalized so the j-th complex coordinate has phase exp(2 pi i t divided by a_j)
normalization: alpha equals i over 4 pi times the sum of a_j times z_j dbarz_j minus barz_j dz_j, with weights 2,p,q
determinant_convention: transverse real return determinants are det of identity minus the two-dimensional rotation in the missing-coordinate ambient complex-line trivialization
orbit_cutoff: all 1003 coprime odd pairs 3 at most p less than q at most 101 and every integer time 1 through 2 p q
precision: exact integer divisibility, reduced rational rotation numbers and orbifold Euler characteristics, symbolic trigonometric determinant forms, and SHA-256 ledgers
