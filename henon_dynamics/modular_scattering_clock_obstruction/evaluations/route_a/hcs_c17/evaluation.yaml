skill: route-a-evaluator
skill_version: 0.1.0
candidate_id: HCS-C17
source_commit: PENDING_RELEASE
release_tag: PENDING_RELEASE
evaluation_date: "2026-08-07"

source_lock:
  object: >-
    Gamma = PSL_2(Z), cusp subgroup P = <T>, oriented nonidentity double
    cosets P\Gamma/P represented with c > 0, and hyperbolic conjugacy
    classes represented by SL_2(Z) lifts of trace t > 2. Release provenance is
    frozen only when source_commit and release_tag replace PENDING_RELEASE.
  clock: >-
    Literal final-monodromy denominator clock 2 log|c(g)|, enlarged only to
    an arbitrary function F(|c(g)|) for the universal no-go; Selberg
    translation length is retained solely as the stable positive control.
  normalization: >-
    Oriented algebraic channels use c > 0 and d modulo c; the complete scalar
    scattering coefficient is Phi(s) = Lambda(2s-1)/Lambda(2s), including its
    gamma factor. Cusp rescaling is restricted to zero-free exponentials.
  determinant_convention: >-
    The candidate would require one primitive-hyperbolic Euler/Fredholm
    determinant with homogeneous repetition L(g^n) = n L(g); open
    double-coset coefficients and closed Selberg factors are not spliced.
  cutoff:
    double_coset_denominator_max: 80
    rigidity_family_rows: 400
    chebyshev_rows: 48
    gauss_word_rows: 274
    homogenization_power_max: 24
    dirichlet_sum_limit: 50000
  precision:
    producer_decimal_digits: 80
    independent_checker_decimal_digits: 110
    arithmetic: "exact integers for matrix certificates; mpmath for analytic controls"
  allowed_data:
    - exact SL_2(Z) matrix arithmetic
    - totients and elementary Dirichlet tail bounds
    - internally evaluated zeta and gamma functions
    - source-derived hyperbolic lengths and scattering identities
  forbidden_data:
    - prime tables
    - zeta-zero tables
    - target-fitted scales or offsets
    - weights inferred from desired spectral data

a1:
  verdict: A1_FAIL
  evidence_status: REFUTED
  strongest_evidence: >-
    Exact classification gives phi(c) oriented open channels at denominator c,
    while an exact PSL conjugacy witness and an exact even-cyclic Gauss-word
    witness change |c| within one closed conjugacy class.
  strongest_failure: >-
    The cusp denominator is intrinsic to P\Gamma/P but does not descend to an
    intrinsic primitive hyperbolic period; the open channel set itself has no
    canonical primitive-power monoid.
  metrics:
    double_coset_levels_checked: 80
    all_totient_counts_match: true
    all_normalized_keys_unique: true
    parabolic_actions_preserve_key: true
    exact_psl_cyclic_witness_c_values: [3, 4]
    prime_or_zero_tables_used: false
    randomized_orbit_controls: "NOT_APPLICABLE_ANALYTIC_REFUTATION"
  artifacts:
    - results/double_coset_counts.csv
    - results/gauss_word_clock_audit.csv
    - results/exact_certificates.json
    - results/summary.json
    - results/independent_check.json

a2:
  verdict: A2_FAIL
  evidence_status: REFUTED
  strongest_evidence: >-
    A function satisfying square repetition on the entry-positive modular
    hyperbolic subfamily is already zero; hence a denominator-only clock
    homogeneous on all modular hyperbolic classes is trivial. The exact
    Chebyshev identity independently audits the repetition defect.
  strongest_failure: >-
    No nontrivial denominator-only primitive-cycle clock exists, so no
    Euler/Fredholm determinant using that same clock and standard repetitions
    can be defined. Stable homogenization changes the clock to the classical
    Selberg translation length.
  metrics:
    rigidity_family_rows_checked: 400
    chebyshev_rows_checked: 48
    exact_integer_failures: 0
    gauss_words_passing_literal_denominator_square_additivity: 0
    stable_clock: "Selberg translation length"
    maximum_defect_formula_residual: "2.698802673467013945433234957125124865973750113886337932819907334427685e-79"
    independent_checker: "PASS"
    independent_of_producer_import: true
    independent_checker_decimal_digits: 110
    independently_verified_rows: 910
    independent_test_suite: "7/7 PASS, including tamper rejection"
  artifacts:
    - results/exact_certificates.json
    - results/homogenization.csv
    - results/summary.json
    - results/independent_check.json
    - refine-logs/round-1-refinement.md

a3:
  verdict: A3_FAIL
  evidence_status: REFUTED
  strongest_evidence: >-
    The complete classical coefficient Phi(s) = Lambda(2s-1)/Lambda(2s) has
    its functional equation and physical-line unitarity verified to 80-digit
    precision, and its divisor is classified symbolically.
  strongest_failure: >-
    Each nontrivial zeta zero rho produces a pole at rho/2 and a zero at
    (1+rho)/2. A zero-free cusp normalization cannot remove this two-shift
    quotient divisor or turn an affine copy of Phi into one entire xi.
  metrics:
    dirichlet_sum_limit: 50000
    all_dirichlet_errors_within_elementary_tail_bound: true
    physical_line_t_values: [0.7, 2.0, 7.0]
    maximum_functional_equation_residual: "2.108439588646104644869714810254003801541992276473701510015552605021629e-81"
    maximum_unitarity_residual: "2.108439588646104644869714810254003801541992276473701510015552605021629e-81"
    fitted_zero_comparison: "NOT_RUN_BY_DESIGN"
  artifacts:
    - results/dirichlet_convergence.csv
    - results/summary.json
    - results/independent_check.json
    - refine-logs/round-1-refinement.md

a4:
  verdict: A4_FAIL
  evidence_status: NOT_TESTABLE
  strongest_evidence: >-
    The modular surface has a natural scattering Hilbert-space framework, but
    that classical framework is only contextual input for this candidate.
  strongest_failure: >-
    HCS-C17 defines no source-derived quantization, Hilbert space and operator
    domain preserving the rejected denominator clock; no self-adjoint operator
    with the Riemann zeros as point spectrum has been constructed.
  metrics:
    natural_same_clock_quantization_defined: false
    hilbert_polya_operator_constructed: false
    time_reversal_test: "NOT_TESTABLE"
    operator_domain_named: false
  artifacts:
    - refine-logs/round-1-refinement.md
    - results/summary.json

overall_verdict: ROUTE_A_REJECTED
claim_boundary: >-
  The literal final-monodromy denominator-only hyperbolic Euler-product route
  is closed. The scoped obstruction project is READY because the no-go and its
  stable Selberg closure are analytic and reproducibly audited. External
  novelty is LIMITED: double-coset scattering, sojourn times, the totient
  identity, Selberg length, and Mayer/Selberg operators are classical. Route-A
  value is HIGH because this result prevents a classical scattering zeta ratio
  from being promoted to a same-clock closed-orbit or Hilbert-Polya candidate.
  Endpoint-extended/local cocycles, matrix cocycles, subadditive pressure, open
  groupoid traces, multi-cusp systems, and separately derived operators remain
  outside scope.
blocking_conditions:
  candidate_route:
    - "|c(g)| does not descend from open double cosets to closed conjugacy classes"
    - "every exactly homogeneous final-denominator-only clock is trivial"
    - "stable homogenization equals classical Selberg translation length"
    - "the scattering coefficient has a two-shift quotient divisor, not one entire xi"
    - "no same-clock Hilbert-Polya operator is defined"
  obstruction_project:
    hard_mathematical_blockers: []
    validation_debt: []
    release_metadata_pending:
      - "replace source_commit PENDING_RELEASE"
      - "replace release_tag PENDING_RELEASE"
next_smallest_test: >-
  Replace the two release-provenance placeholders, freeze the independently
  verified artifacts, and archive HCS-C17 as a proved negative structural
