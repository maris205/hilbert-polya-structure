claims:
  branch_image: "Each I_m maps affinely onto (0,1], while phi_m(0)=1/m is the excluded left endpoint."
  finite_word_points: "Every finite branch word has one exact fixed point of its inverse composition and multiplier product A_w=prod_j m_j(m_j-1)."
  primitive_necklaces: "Primitive words modulo cyclic rotation enumerate oriented primitive periodic orbits in each finite cutoff."
  countable_limit: "The full alphabet is countable, hence each positive period has countably infinitely many coded points."
  truncated_weighted_identity: "Z_M(z,s)=1/(1-z sum_{m=2}^M [m(m-1)]^{-s})."
  full_convergence: "A(s) converges absolutely for Re(s)>1/2."
  product_domain: "Absolute primitive product/log expansion requires Re(s)>1/2 and |z| A(Re(s))<1."
  meromorphic_domain: "The rational expression gives meromorphic continuation throughout Re(s)>1/2 away from denominator zeros; this is broader than absolute product convergence."
  s_one_boundary: "A(1)=1 by telescoping and z=1 is a denominator pole/boundary."
  arithmetic: none
nonclaims:
