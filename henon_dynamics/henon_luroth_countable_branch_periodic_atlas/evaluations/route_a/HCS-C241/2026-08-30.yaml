  - "The half-plane meromorphic continuation is not the target functional-equation/zero correspondence; A3 is FAIL."
  - "Branch labels and multipliers are not rational primes, prime powers, von Mangoldt weights, or logarithmic lengths."
  - "At s=1/2 the full A(s) diverges, so a full-alphabet product condition is not asserted for those receipt rows."
  - "No arithmetic local data, root number, automorphy statement, Hilbert-Polya operator, or Route-B input is claimed."
