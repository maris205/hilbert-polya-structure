skill: route-a-evaluator
skill_version: 0.2.0
candidate_id: DEN-WITT-Z-FIN
source_commit: unavailable-no-git
evaluation_date: 2026-08-13

source_lock:
  object: >-
    Deninger's rational-Witt topological R-flow for X0=Spec(Z), restricted
    to the explicitly frozen finite-kernel admissibility class E_f.
  arithmetic_origin: closed points (p) of Spec(Z), Frobenius maps, and rational Witt spaces
  clock: additive t in phi^t[P,u]=[P,exp(t)u], without rescaling
  normalization: >-
    every orbit in packet Gamma_p has least period log(p); no packet mass,
    transverse measure, or trace normalization is imposed
  determinant_convention: >-
    The conventional one-factor-per-individual-primitive-orbit Ruelle product
    is tested and rejected. Packet-collapsed or measured products are not
    admitted as determinants without a source-derived trace theorem.
  cutoff: no orbit cutoff; theorem-level packet decomposition and deterministic finite arithmetic controls
  precision: symbolic proofs plus IEEE-754 binary64 illustrations
  allowed_data: >-
    Deninger arXiv:1807.06400v4/journal version, the author's 2023 survey,
    primary trace-formula sources, and rational primes only as closed points after the trace ambiguity is stated
  forbidden_data: Riemann zeros, fitted packet masses, fitted scales, fitted roots, formal Euler factors presented as dynamics

a0:
  verdict: A0_ANALYTIC_ARITHMETIC_ORIGIN
  evidence_status: PROVED
  strongest_evidence: >-
    Theorems 5.2 and 6.1 exhaust all periodic points by pairwise disjoint
    packets indexed by closed points, and Gamma_p has least period log(p).
  strongest_failure: >-
    The preferred global admissibility condition is not uniquely selected;
    this evaluation freezes E_f and does not hide that version boundary.
  arithmetic_controls:
    - removing the admissibility restriction produces the author's too-many-orbits control
    - replacing closed-point labels by shuffled labels destroys the Frobenius association
    - composite integers are not closed points of Spec(Z)
    - an arbitrary compact equal-period base passes local Haar normalization and therefore proves too much
  artifacts:
    - papers/2-flow-zeta/notes/phase2_deninger_source_audit.md
    - papers/2-flow-zeta/notes/phase3_trace_no_go_audit.md

a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    Each packet has a theorem-level least period and repetitions, all periodic
    points are exhausted, and its orbit set is noncanonically indexed by the
    compact group B_p.
  strongest_failure: >-
    Each Gamma_p contains uncountably many primitive orbits of the same length;
    the source does not define a canonical isolated representative, packet
    multiplicity, phase, smooth monodromy, or flow-trace coefficient.
  metrics:
    packet_decomposition: PROVED
    individual_orbits_per_prime: uncountable
    unique_individual_orbit_per_prime: REFUTED
    length_local_finiteness: REFUTED
    packet_base_topological_identification: OPEN
    smooth_monodromy: NOT_TESTABLE
  artifacts:
    - papers/2-flow-zeta/notes/phase2_deninger_source_audit.md
    - papers/2-flow-zeta/notes/phase3_trace_no_go_audit.md

a2:
  verdict: A2_FAIL
  evidence_status: PROVED
  strongest_evidence: >-
    For every p and real s>0, the finite-subset net of the ordinary
    individual-orbit factors from Gamma_p diverges because uncountably many
    identical factors (1-p^(-s))^(-1) exceed one.
  strongest_failure: >-
    Packetwise measured alternatives lack a canonical N2 lift/disintegration,
    N3 cross-packet masses, an operator trace gate, and a Fredholm determinant
    theorem. They are NOT_TESTABLE rather than disproved.
  metrics:
    conventional_orbit_counting_locally_finite: false
    conventional_orbit_product: divergent
    abstract_packet_base_haar_probability: PROVED
    source_to_packet_measure: CONDITIONAL
    canonical_disintegration: NOT_TESTABLE
    canonical_component_masses: not_selected_under_conditional_homogeneous_axioms
    canonical_determinant: NOT_TESTABLE
    root_matching: not_applicable
    divisor_comparison: not_applicable
    cutoff_drift: not_applicable
  artifacts:
    - papers/2-flow-zeta/notes/phase2_trace_bibliography.md
    - papers/2-flow-zeta/notes/phase3_trace_no_go_audit.md
    - papers/2-flow-zeta/results/orbit_multiplicity_divergence.csv
    - papers/2-flow-zeta/results/packet_weight_sensitivity.csv

a3:
  verdict: A3_FAIL
  evidence_status: NOT_TESTABLE
  strongest_evidence: >-
    Section 11 of the source contains a genuine Haar-normalized convolution
    algebra on an inverse-limit multiplicative group.
  strongest_failure: >-
    A3 is not reached: no theorem maps that algebra to packet returns,
    represents the flow on a trace domain, derives repetitions, or first
    produces a candidate determinant whose continuation or divisor could be tested.
  analytic_structure: not_applicable_no_candidate_determinant
  weil_compression: absent
  metrics:
    analytic_continuation: not_applicable_no_candidate_determinant
    functional_equation: not_applicable_no_candidate_determinant
    certified_divisor: not_applicable_no_candidate_determinant
  artifacts:
    - papers/2-flow-zeta/notes/phase2_deninger_source_audit.md
    - papers/2-flow-zeta/notes/phase2_trace_bibliography.md

a4:
  verdict: A4_FAIL
  evidence_status: NOT_TESTABLE
  strongest_evidence: the source defines a genuine continuous topological R-action
  strongest_failure: >-
    No frozen symplectic/contact phase space, Hilbert space, operator domain,
    self-adjoint host, or natural quantization is supplied.
  metrics:
    fixed_hilbert_space: false
    natural_quantization: false
  artifacts:
    - papers/2-flow-zeta/notes/phase3_trace_no_go_audit.md

adversarial_controls:
  controls_used:
    - trace rescaling and independent component masses
    - copied-packet disjoint union
    - arbitrary compact equal-period base
    - direct individual-orbit multiplicity growth
    - four non-unit packet-mass models
  proves_too_much_risk: >-
    Normalized Haar probability exists for arbitrary compact bases and does
    not by itself identify an arithmetic flow trace.
  verdict: STOP_SCOPED

overall_verdict: ROUTE_A_EXPLORATORY
claim_boundary: >-
  The frozen candidate has intrinsic prime-indexed periodic packets. Its
  ordinary individual-orbit Ruelle product is rigorously unavailable. No
  canonical measured/groupoid/cohomological replacement is presently defined,
  but such enrichments have not been ruled out.
blocking_conditions:
  - choice-independent measurable/topological packet quotient and lift
  - source-derived cross-packet component masses
  - flow-specific trace domain and fixed-point coefficient theorem
  - Fredholm or cohomological determinant with derived repetition weights
next_smallest_test: >-
  Define one choice-independent packet groupoid or cohomological return object
  and prove its trace, including component masses and repetitions, before
  writing any packet Euler product.
round2_clues:
  - clean-family and foliated Lefschetz frameworks specify the missing geometric/operator hypotheses
  - Section 11 supplies authentic algebraic structure but currently has no packet-return bridge
  - a same-object classical-to-quantum trace gate should precede any operator construction
route_b_invocation_allowed: false
