skill: route-a-evaluator
skill_version: 0.2.0
candidate_id: DEN-WITT-Z-FIN
source_commit: unavailable-no-git
evaluation_date: 2026-08-13

source_lock:
  object: >-
    Deninger's rational-Witt topological R-flow for X0=Spec(Z), restricted
    by an explicitly allowed finite-kernel admissibility condition, denoted
    locally by E_fin.
  arithmetic_origin: closed points (p) of Spec(Z), Frobenius maps, and rational Witt spaces
  clock: additive t in phi^t[P,u]=[P,exp(t)u], without rescaling
  normalization: packet Gamma_p has least period log(p)
  determinant_convention: >-
    Diagnostic packet-indexed direct Euler product only; it is not accepted
    as a dynamical determinant until a canonical packet measure/trace is proved.
  cutoff: no finite orbit cutoff; analytic packet-decomposition theorem
  precision: symbolic/theorem level
  allowed_data: Deninger 2026 primary article and 2023 author survey
  forbidden_data: Riemann zeros, prime tables as dynamics, fitted roofs, fitted weights

a0:
  verdict: A0_ANALYTIC_ARITHMETIC_ORIGIN
  evidence_status: PROVED
  strongest_evidence: >-
    The periodic set is the disjoint union of compact packets Gamma_p indexed
    by closed points (p), and every orbit in Gamma_p has period log(p).
  strongest_failure: >-
    The global admissibility condition is not uniquely forced by the theory;
    this evaluation freezes the locally named E_fin rather than hiding that
    modeling boundary.
  arithmetic_controls:
    - removing admissibility yields the author's too-many-periodic-orbits control
    - shuffled rational-prime labels destroy the closed-point/Frobenius association
    - composites are not closed points of Spec(Z), so a composite-label control has no intrinsic packet
    - generic entropy-one suspensions reproduce counting scale without arithmetic origin
  artifacts:
    - papers/1-classical-flow/notes/literature_review.md
    - papers/1-classical-flow/notes/candidate_evaluation.md

a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    Packet decomposition, least period log(p), repetitions r log(p), pairwise
    disjointness, and exhaustion of all periodic orbits are theorem-level.
  strongest_failure: >-
    A prime corresponds to a compact packet rather than a unique isolated
    orbit; canonical multiplicity, phase, smooth monodromy, and packet trace
    weight are open or not testable.
  metrics:
    packet_decomposition: PROVED
    unique_individual_orbit_per_prime: REFUTED
    canonical_packet_multiplicity: OPEN
    smooth_monodromy: NOT_TESTABLE
    trace_weight_and_phase: OPEN
  artifacts:
    - papers/1-classical-flow/notes/candidate_evaluation.md

a2:
  verdict: A2_FAIL
  evidence_status: OPEN
  strongest_evidence: a packet-indexed formal Euler product reproduces the desired factors
  strongest_failure: >-
    counting each compact packet once has not been derived from a canonical
    transfer operator, trace, or transverse measure and would currently be a manual collapse
  metrics:
    canonical_determinant: false
    certified_divisor: false
  artifacts:
    - papers/1-classical-flow/notes/literature_review.md

a3:
  verdict: A3_FAIL
  evidence_status: OPEN
  strongest_evidence: the construction is motivated by arithmetic dynamical analogies
  strongest_failure: >-
    no candidate-derived Weil Hermitian compression or global trace identity
    with the required packet normalization has been established
  analytic_structure: not established for a candidate dynamical determinant
  weil_compression: absent
  artifacts:
    - papers/1-classical-flow/notes/prior_work_audit.md

a4:
  verdict: A4_FAIL
  evidence_status: NOT_TESTABLE
  strongest_evidence: the object is a genuine topological R-action
  strongest_failure: >-
    it is infinite-dimensional and topological, with no frozen symplectic/contact
    structure, Hilbert space, operator domain, or natural quantization
  metrics:
    fixed_hilbert_space: false
    natural_quantization: false
  artifacts:
    - papers/1-classical-flow/notes/candidate_evaluation.md

adversarial_controls:
  controls_used:
    - raw rational-Witt space without admissibility
    - shuffled closed-point labels
    - composite labels
    - generic suspension flow
  proves_too_much_risk: high if each compact packet is manually declared to count once
  verdict: STOP_SCOPED

overall_verdict: ROUTE_A_EXPLORATORY
claim_boundary: >-
  This evaluation proves an intrinsic prime-to-periodic-packet dictionary, not
  a prime-to-unique-orbit dictionary, isolated-orbit trace formula, or Hilbert-Polya operator.
blocking_conditions:
  - canonical functorial transverse measure on Gamma_p/R
  - trace or Lefschetz principle deriving one normalized packet contribution
  - intrinsic repetition weights, signs, phases, and stability data
next_smallest_test: >-
  Construct and prove a functorial canonical measure on Gamma_p/R whose total
  mass and repetition contribution are derived from one genuine dynamical trace.
round2_clues:
  - packet geometry resembles invariant tori rather than isolated hyperbolic orbits
  - a Lefschetz or groupoid trace may be more natural than a conventional Ruelle product
route_b_invocation_allowed: false
