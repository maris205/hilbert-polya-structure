  clock: roof tau=log(2), so the orbit indexed by x has length deg(x)*log(2)=log(N(x))
  normalization: one primitive suspension circle per closed point; no potential, phase, half-shift, or stability factor
  determinant_convention: unweighted primitive-orbit zeta, compared with the Artin-Mazur and native Hasse-Weil zeta
  cutoff: no theorem cutoff; deterministic finite checks through degree 12
  precision: exact integer and formal-series arithmetic; binary64 only for periodicity/convergence regressions
  allowed_data: fixed scheme/Frobenius definitions, primary finite-field sources, and generated finite polynomial ledgers
  forbidden_data: Riemann zeros, fitted scales or shifts, random seeds, network inputs to reproduction, hard-coded rational-prime tables

