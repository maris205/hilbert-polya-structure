    A common arithmetic parent does not license combining the best coordinates
    of distinct operators; arbitrary circle compilers retain the same formal product logic.
  verdict: STOP_SCOPED

overall_verdict: ROUTE_A_SUCCESS_ROUTE_B_NOT_READY
claim_boundary: >-
