source_lock:
  object: >-
    The closed-point suspension, its natural Koopman translation generator,
    and geometric-Frobenius action on graded etale cohomology, all derived
    from P1/F2 but kept as three typed analytic ledgers.
  arithmetic_origin: the scheme P1/F2 and its Frobenius endomorphism
  clock: suspension time with roof log(2); native cohomological variable t=2^(-s)
  normalization: one primitive suspension circle per closed point; alternating cohomological determinant by degree
  determinant_convention: >-
    Z(X,t)=product_i det(1-t Phi on H^i)^((-1)^(i+1)); this is not
    identified with a Fredholm or spectral determinant of the Koopman generator.
  cutoff: no theorem cutoff; deterministic ledgers through degree and iterate 24
  precision: exact integer, rational, divisor, and formal-power-series arithmetic
  allowed_data: frozen scheme/Frobenius definitions, primary theorem sources, and generated finite regression ledgers
  forbidden_data: Riemann zeros, fitted clocks, fitted spectra, target-derived couplings, or relabeling one operator as another

a0:
  verdict: A0_ANALYTIC_ARITHMETIC_ORIGIN
  evidence_status: PROVED
  strongest_evidence: >-
    Closed points, primitive Frobenius cycles, suspension circles, and etale
    cohomology all arise functorially from the same frozen finite-field parent.
  strongest_failure: this is one residue characteristic and is not a rational-prime arithmetic source
  arithmetic_controls:
    - same-cycle-type non-arithmetic permutations erase scheme provenance while preserving the bare circle flow
    - arbitrary prescribed circle lengths compile arbitrary Euler products and prove too much
    - inverse point Frobenius reverses cycles without changing periods
    - changing component Hilbert weights leaves the Koopman representation unitarily equivalent
  artifacts:
