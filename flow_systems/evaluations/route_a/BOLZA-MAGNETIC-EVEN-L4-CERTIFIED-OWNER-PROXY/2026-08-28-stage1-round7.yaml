source_lock:
  object: >-
    Bounded proxy consisting of the source-compatible even subsequence N=2m
    of the b=+/-1/2 unit-speed magnetic flow on the curvature-minus-one Bolza
    surface, restricted to the 36 inverse-paired primitive Gamma-axis owners
    certified inside the Round-5 marked-word census L<=4 and their signed
    Kordyukov--Taimanov branches k=+/-1,+/-2,+/-3,+/-4. The contracted
    non-arithmetic control is now the exact closed genus-two surface
    NAZARENKO-EXP-OCTAGON-G2 at (a,alpha)=(exp(-1/10),pi/4), with four
    primitive side-pairing owners. No common-cutoff comparison is part of the
    locked object.
  arithmetic_origin: >-
    Indirect only: the Bolza host has arithmetic Fuchsian/quaternionic
    provenance, while the new control has an exact independent
    non-arithmeticity certificate. Neither bounded owner set carries an
    intrinsic rational-prime, prime-ideal, log-prime, or von-Mangoldt
    assignment.
  clock: >-
    Primary Bolza trace clock T_trace=sqrt(5/3)*ell on each primitive axis,
    with signed repetition k*T_trace; the separately recorded unit-speed
    physical clock is T_physical=2/sqrt(3)*ell and
    T_trace=(sqrt(5)/2)*T_physical. No control branch clock rows have been
    generated in Round 7.
  normalization: >-
    Bolza proxy: exact source-compatible square-root connection L^2=K, even
    powers N=2m, source parameter E=sqrt(5), inverse-paired axis ownership,
    signed k branches with no orientation credit, action/N=k*sqrt(3)*ell/2,
    multipliers exp(k*ell),exp(-k*ell), and Maslov index zero. Control source
    package: curvature -1, genus 2, area 4*pi, the same admissible field and
    bundle-degree contract, but no census or branch normalization instantiated.
  determinant_convention: NONE_DEFINED_FOR_THIS_PROXY_A2_NOT_TESTABLE
  cutoff: >-
    Bolza uses only the combinatorial marked cutoff L<=4 and signed repetition
    cutoff |k|<=4. Neither is a complete geometric-length cutoff. No common
    Bolza/control cutoff Lambda is frozen: the control source package is 6/6,
    but a control systole/lower bound or finite word-to-length completeness
    certificate is still absent.
  precision: >-
    Bolza conjugacy, determinant-one, relator, trace, and primitivity-margin
    logic is exact in Q(s,t,i), s^2=2, t^2=1+s, i^2=-1. The control is defined
    by exact analytic SU(1,1) formulas at a=exp(-1/10), with 140-decimal
    determinant, SU(1,1), admissibility, hyperbolicity, angle-sum, and relator
    replay. Decimal residuals do not replace the cited polygon construction.
  allowed_data: >-
    Frozen Bolza matrices and relator, cited trace-theorem convention, Round-3
    subtype contract, immutable Round-5 census/branch/control bytes, Round-6
    exact witnesses, Round-7 source matrix and exact control package, and
    target-free deterministic tests. Round-7 source locators are
    https://arxiv.org/abs/1301.5446v1,
    https://doi.org/10.1063/1.1850177,
    https://doi.org/10.2969/jmsj/02740600, and
    https://doi.org/10.1007/978-3-031-51959-8_16; all were accessed
    2026-08-28 with claim boundaries recorded in the source matrix.
  forbidden_data: >-
    Rational-prime, prime-ideal, zeta-zero, or fixed-operator spectral targets;
    post-hoc time rescaling; changed owner conventions; a claimed control
    systole; any common cutoff, census, branch comparison, or arithmetic
    conclusion before a rigorous finite completeness certificate.

