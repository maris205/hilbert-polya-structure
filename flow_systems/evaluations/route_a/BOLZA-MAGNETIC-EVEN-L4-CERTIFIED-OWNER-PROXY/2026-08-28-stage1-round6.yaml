source_lock:
  object: >-
    Bounded proxy consisting of the source-compatible even subsequence N=2m
    of the b=+/-1/2 unit-speed magnetic flow on the curvature-minus-one Bolza
    surface, restricted to the 36 inverse-paired primitive Gamma-axis owners
    certified inside the Round-5 marked-word census L<=4 and their signed
    Kordyukov--Taimanov branches k=+/-1,+/-2,+/-3,+/-4. This proxy is not the
    full Bolza primitive spectrum and is not the fixed operator Delta^L.
  arithmetic_origin: >-
    Indirect only: the Bolza surface has arithmetic Fuchsian/quaternionic
    provenance, but the bounded orbit proxy carries no intrinsic rational-prime,
    prime-ideal, log-prime, or von-Mangoldt assignment.
  clock: >-
    Primary trace clock T_trace=sqrt(5/3)*ell on each primitive axis, with
    signed repetition k*T_trace; the separately recorded unit-speed physical
    clock is T_physical=2/sqrt(3)*ell and T_trace=(sqrt(5)/2)*T_physical.
  normalization: >-
    Exact source-compatible square-root connection L^2=K, even powers N=2m,
    source parameter E=sqrt(5), inverse-paired axis ownership, signed k branches
    with no orientation credit, action/N=k*sqrt(3)*ell/2, multipliers
    exp(k*ell),exp(-k*ell), Maslov index zero.
  determinant_convention: NONE_DEFINED_FOR_THIS_PROXY_A2_NOT_TESTABLE
  cutoff: >-
    Combinatorial marked cutoff L<=4 and signed repetition cutoff |k|<=4;
    neither is a complete geometric-length cutoff, and no common Bolza/control
    cutoff Lambda is frozen because the non-arithmetic control source package
    is absent.
  precision: >-
    Conjugacy, determinant-one, relator, trace, and primitivity-margin logic is
    exact in Q(s,t,i), s^2=2, t^2=1+s, i^2=-1; displayed periods/actions use
    the frozen 120-decimal replay and do not decide conjugacy.
  allowed_data: >-
    Frozen Bolza matrices and relator, cited trace-theorem convention, Round-3
    subtype contract, immutable Round-5 census/branch/control bytes, Round-6
    exact witnesses and validation, and target-free deterministic tests.
  forbidden_data: >-
    Rational-prime, prime-ideal, zeta-zero, or fixed-operator spectral targets;
    post-hoc time rescaling; changed owner conventions; fabricated
    non-arithmetic geometry, systole, matrices, or arithmeticity verdicts.

