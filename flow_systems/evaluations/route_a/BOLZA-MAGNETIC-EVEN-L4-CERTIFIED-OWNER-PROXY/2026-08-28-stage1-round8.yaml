source_lock:
  object: >-
    Bounded proxy consisting of the source-compatible even subsequence N=2m
    of the b=+/-1/2 unit-speed magnetic flow on the curvature-minus-one Bolza
    surface, restricted to the 36 inverse-paired primitive Gamma-axis owners
    certified inside the Round-5 marked-word census L<=4 and their signed
    Kordyukov--Taimanov branches k=+/-1,+/-2,+/-3,+/-4. The exact
    non-arithmetic control is NAZARENKO-EXP-OCTAGON-G2 at
    (a,alpha)=(exp(-1/10),pi/4). Round 8 proves its exact systole and a finite
    word-to-length completeness theorem through the frozen common geometric
    cutoff Lambda=21/10. No common-cutoff census or branch comparison is part
    of the locked object.
  arithmetic_origin: >-
    Indirect only: the Bolza host has arithmetic Fuchsian/quaternionic
    provenance, while the exact control is independently non-arithmetic.
    Neither bounded owner set carries an intrinsic rational-prime,
    prime-ideal, log-prime, or von-Mangoldt assignment.
  clock: >-
    Primary Bolza trace clock T_trace=sqrt(5/3)*ell on each primitive axis,
    with signed repetition k*T_trace; unit-speed physical clock
    T_physical=2/sqrt(3)*ell and T_trace=(sqrt(5)/2)*T_physical. No control
    branch-clock rows are generated in Round 8.
  normalization: >-
    Bolza proxy: exact source-compatible square-root connection L^2=K, even
    powers N=2m, source E=sqrt(5), inverse-paired axis ownership, signed k
    branches with no orientation credit, action/N=k*sqrt(3)*ell/2,
    multipliers exp(k*ell),exp(-k*ell), and Maslov index zero. Control:
    curvature -1, genus 2, area 4*pi, matched field and degree contract, exact
    sourced SU(1,1) group, but no census or branch normalization instantiated.
  determinant_convention: NONE_DEFINED_FOR_THIS_PROXY_A2_NOT_TESTABLE
  cutoff: >-
    Lambda_common=21/10 is target-blind and frozen after the Round-8 exact
    compact-polygon certificate proved that every control conjugacy class of
    length at most Lambda has a conjugate in the exhausted finite tile
    component. The existing Bolza L<=4 cutoff remains only combinatorial and
    is not reinterpreted as geometric completeness. Neither surface census
    has been run at Lambda, so there is no comparison outcome.
  precision: >-
    Bolza conjugacy, determinant-one, relator, trace, and primitivity-margin
    logic is exact in Q(s,t,i), s^2=2, t^2=1+s, i^2=-1. Round-8 control
    equality uses exact Gaussian-integer polynomial PSU(1,1) normal forms in
    u=exp(-1/10); every radius and nonzero trace sign is certified with
    rational Taylor intervals. Decimal systole text is display-only.
  allowed_data: >-
    Frozen Bolza matrices/relator and Round-3 subtype contract; immutable
    Round-5 census/branch/control bytes; Round-6 exact witnesses; Round-7
    source matrix, exact control package and upstream hashes; Round-8 freeze,
    exact finite component, rational interval guards and source decisions;
    target-free deterministic tests. Round-8 locators are
    https://arxiv.org/abs/1301.5446v1,
    https://doi.org/10.5802/jtnb.683, and
    https://doi.org/10.4230/LIPIcs.SoCG.2023.27, accessed 2026-08-28 with
    exact claim boundaries.
  forbidden_data: >-
    Rational-prime, prime-ideal, zeta-zero, or fixed-operator spectral
    targets; post-hoc time rescaling; changed owner conventions; a finite word
    scan presented without a geometric stopping theorem; treating the 144
    equality group elements as 144 conjugacy owners; any census/comparison
    conclusion before exact owner and conjugacy deduplication.

