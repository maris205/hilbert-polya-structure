[project]
name = "pcf-prime-multiplier-obstruction"
version = "0.1.0"
description = "Source-locked exact audit of multiplier divisibility for a frozen PCF quadratic"
requires-python = ">=3.12"
dependencies = [
  "sympy>=1.14",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
addopts = "-ra"

