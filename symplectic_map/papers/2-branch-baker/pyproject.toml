[project]
name = "pcf-markov-baker"
version = "0.1.0"
description = "Source-locked exact verification for the PCF Markov-baker candidate"
requires-python = ">=3.12"
dependencies = [
  "mpmath>=1.3",
  "numpy>=2.0",
  "sympy>=1.13",
]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["code/tests"]
addopts = "-ra"
