   <g id="text_1">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(18.670438 66.088594)">Algebraic cycles</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(14.928172 73.927062)">no point at infinity</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(11.744813 81.765531)">in projective closure</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(88.308422 66.088594)">S-integral coordinates</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(96.57225 73.927062)">cyclic ultrametric</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(109.256469 81.765531)">maximum</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(170.903516 66.088594)">Integral monodromy</text>
    <!-- in $\mathrm{SL}_2$ -->
    <g style="fill: #20242a" transform="translate(196.5 73.927062)">
     <text>
      <tspan x="0" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">i</tspan>
      <tspan x="1.944824" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">n</tspan>
      <tspan x="6.381348" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a"> </tspan>
      <tspan x="8.606445" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">S</tspan>
      <tspan x="13.049805" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">L</tspan>
      <tspan x="17.016699" y="0.460938" style="font-size: 4.9px; font-family: 'DejaVu Sans'; fill: #20242a">2</tspan>
     </text>
    </g>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a" transform="translate(163.314531 81.765531)">both eigenvalues S-units</text>
   </g>
