      <tspan x="32.884277" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a"> </tspan>
      <tspan x="35.109375" y="-0.6875" style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">o</tspan>
