   <g id="text_5">
    <!-- $q^2=\lambda\bar\lambda$ -->
    <g style="fill: #20242a" transform="translate(353.778 66.557156)">
     <text>
      <tspan x="0" y="-0.296875" style="font-style: oblique; font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">q</tspan>
      <tspan x="16.670824" y="-0.296875" style="font-style: oblique; font-size: 7px; font-family: 'DejaVu Sans'; fill: #20242a">λ</tspan>
