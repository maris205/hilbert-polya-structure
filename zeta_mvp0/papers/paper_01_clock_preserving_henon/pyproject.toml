[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hp-candidate-search"
version = "0.1.0"
description = "Zero-input Hilbert--Polya candidate screening with explicit claim gates"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14"]

[project.optional-dependencies]
validated = ["python-flint==0.9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
