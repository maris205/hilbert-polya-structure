source_lock:
  candidate_definition: >-
    On the finite-full-shift semiring skeleton, create n->d exactly when
    d>=2 divides n+1, equivalently when S(F_n)=F_d tensor F_q for an exposed
    q>=1. No accepted-support selector, prime table, or target-zero data enters
    the graph.
  object: >-
    The one-sided countable Markov shift on V={2,3,...} and the column-source
    endpoint-weighted vertex adjacency L_s e_n =
    sum_(d|n+1,d>=2)(nd)^(-s)e_d on ell^2(V).
  family: symbolic_dynamics
  phase_space: >-
    X_G^+, the one-sided countable Markov edge shift of the successor-divisor
    graph.
  dynamics: >-
    Every vertex has successor edge n->n+1 with quotient one. Every divisor
    d>=2 of n+1 supplies an edge n->d with exposed quotient q=(n+1)/d.
  parameters: >-
    Source audit through 4096; exact sparse unweighted traces through r=32;
    cutoff flags at N=7,15,31,63; stabilization at 2r-1, 2r, and 4r+3;
    weighted rational traces for s=1,2,3 through r=16; determinant
    coefficients through z^16; canonical cycles through length 2048;
    quotient-family controls 2<=d,q<=16; S1 diagnostics at eight sigmas and
    seven dyadic cutoffs through 4096.
  parameter_provenance: >-
    Graph rule, endpoint roof, trace cutoffs, exactness rule, orientation,
    quotient controls, determinant convention, and Route tuple were frozen
    before result generation. No parameter was fitted and no target-zero
    datum was available or used.
  arithmetic_origin: >-
    Alphabet successor, tensor multiplication, equality, and entropy come
    from finite full shifts. The exposed equality n+1=dq is an intrinsic
    positive-integer factorization relation but selects all successor
    divisors, not rational primes.
  clock: >-
    The source roof is tau(n,d)=h(F_n tensor F_d)=log n+log d. A closed word
    gamma therefore has total clock 2 log N(gamma) and weight N(gamma)^(-2s).
  normalization: >-
    L_s uses the column-source convention. Primitive cycles are directed
    rotation classes; reflections are not identified. The marker z counts
    graph edges and repetitions are separated by necklace inversion.
  determinant_convention: >-
    D_SD(s,z)=det(I-zL_s) is the ordinary Hilbert-space Fredholm determinant
    of the whole adjacency on Re(s)>1/2. Its local primitive product uses the
    same graph and roof. It is not identified with the marked prime Euler
    product, whose coefficient of z is already nonzero while Tr(L_s)=0.
  orbit_cutoff: >-
    The confinement theorem makes cutoff N>=2r-1 exact for every order-r
    trace. The authority census freezes r<=32 and independently enumerates
    all 667 primitive rotation classes through length 16.
  cutoff: >-
    32 unweighted orders, 48 weighted trace rows, 51 determinant coefficient
    rows, 225 quotient-family rows, 20 graph controls, 64 weight-inventory
    controls, and 56 S1 diagnostic rows.
  precision: >-
    Integer graph/path counts, exact Fraction traces and determinant
    coefficients, exact primitive-product multiplication, deterministic
    floating diagnostic prefixes, and analytic proofs for infinite
    trace-class claims.
  training_data: none
  allowed_data:
    - finite-full-shift successor, tensor multiplication, equality, and entropy
    - paired integer divisor enumeration and exposed quotient certificates
    - exact sparse integer path counts and rational weights
    - directed rotation canonicalization and Mobius necklace inversion
    - quotient spine, successor-only, blacklist, and positive-weight controls
    - SHA-256 and deterministic source audits
  forbidden_data:
