claim_boundary: >-
  SD-C23 proves strong connectivity, mixing, exact finite confinement, the
  sharp S1 half-plane, and a same-object Fredholm determinant for the natural
  successor-divisor shift. It also proves an all-length primitive-cycle flood,
  a missing marked first coefficient, composite-square orbit norms, and zero
  control margin against the q={1,2} spine. It does not match the prime Euler
  ledger, continue the determinant, produce completed zeta structure, prove
  RH, or construct a Hilbert-Polya operator.
