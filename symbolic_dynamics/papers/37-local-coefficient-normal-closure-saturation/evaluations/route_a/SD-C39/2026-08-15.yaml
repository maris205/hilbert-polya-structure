source_lock:
  candidate_definition: >-
    On the full unquotiented cyclically nonbacktracking affine Cayley edge
    shift for M_r=<u,v | vu=u^r v>+ with r at least two, retain one free z per
    original transition and source-coordinate damping. Test whether one
    source-syntax-derived finite-rank inverse-edge coefficient mechanism can
    cancel every translated, conjugated, mixed, and repeated relation factor
    while retaining a nonzero arithmetic primitive factor on one owned matrix
    Fredholm determinant.
  object: >-
    One uninduced oriented-edge affine Hashimoto object with rank-two even and
    odd edge connections. The ordinary parity operators remain separately
    owned; the graded object is explicitly their Fredholm determinant ratio
    and is never promoted to an ordinary positive determinant.
  family: symbolic_dynamics
  phase_space: >-
    Cyclically nonbacktracking paths on the formal-reverse right Cayley graph
    of the affine presentation, without quotient, first return, or support
    projection.
  dynamics: >-
    A Hashimoto transition advances one original oriented edge and forbids
    the immediate formal reverse. Relation words and mixed normal-closure
    products remain in the same primitive ledger before coefficient tests.
  parameters: >-
    Affine r=1 through 8 with composite baseline r=4; six fixed one-relator
    mutations; 48 deterministic random one-relator controls at seed 370037;
    24 paired two-relator controls; conjugator bounds three and two; power
    supertraces through twelve; exact A/B and cache-free cold C.
  parameter_provenance: >-
    SOURCE_LOCK.md, root PREREGISTRATION.md, experiments/PREREGISTRATION.md,
    and experiments/EXPERIMENT_PLAN.md froze the object, shear matrices,
    controls, source/evaluator firewall, Route tuple, and stop rules before
    integrated code and results. The plan records the pre-canonical report
    path correction before the final cleared-output run.
  arithmetic_origin: >-
    The affine exponent r and semidirect multiplication are structural source
    relations. No prime basis, accepted-support table, factorization oracle,
    target coefficient, target zero, or fitted representation enters either
    process.
  clock: >-
    The free variable z counts one original Hashimoto transition. No first
    return, acceleration, z=1 substitution, changed grading, or quotient
    clock is used.
  normalization: >-
    Source-coordinate damping is d_theta(e)=theta^(1+b(e)+k(e)) for
    0<theta<1. Exact finite coefficient calculations are independent of a
    floating theta specialization.
  determinant_convention: >-
    Each parity owns an ordinary trace-class matrix Fredholm determinant on
    the same uninduced edge space. The graded cancellation object is their
    explicit ratio; complete factor deletion means equality of determinant
    polynomials and all holonomy power traces.
  regularization_order: "not_applicable; ordinary_trace_class_matrix_Fredholm_determinants_only"
  main_theorem_marker: "one free z per original Hashimoto transition"
  orbit_cutoff: >-
    Bounded products of two conjugated relators with freely reduced
    conjugators of length at most three for affine rows and two for generic
    controls; power supertraces one through twelve.
  cutoff: >-
    Finite rows certify implementation, formulas, controls, and
    reproducibility only. Trace-class ownership, the arbitrary-rank
    nilpotence criterion, and normal-closure saturation have independent
    proofs.
  precision: >-
    Exact integers and fractions.Fraction, canonical UTF-8 JSON/CSV/YAML,
    byte comparison, and SHA-256; no floating tolerance or network data.
  training_data: none
  allowed_data:
    - affine presentation and semidirect multiplication
    - formal reverse edges and Hashimoto transitions
    - source-coordinate damping and frozen source-syntax matrices
    - exact generic presentations generated before evaluation
    - post-source independent reconstruction and exact controls
  forbidden_data:
