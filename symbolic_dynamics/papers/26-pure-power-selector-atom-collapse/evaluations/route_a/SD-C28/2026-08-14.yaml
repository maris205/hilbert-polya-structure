source_lock:
  candidate_definition: >-
    The wordwise cyclic coefficient is one on every nonempty monochromatic
    word and zero on every mixed word. It is realized by color projectors,
    classified among finite stationary even graded trace representations,
    and tensored with the canonical holomorphic de Rham return sector.
  object: >-
    Finite recognizable cyclic series, finite-dimensional complex even
    graded representations of the free color algebra, support-indexed
    exterior fibers, the separable color algebra C^m, and degreewise
    trace-class countable projector/de Rham operators.
  family: symbolic_dynamics
  phase_space: >-
    Completed logarithmic-code return words over a finite color alphabet;
    the countable analytic realization uses ell2 of the supplied inventory
    with coordinate projectors.
  dynamics: >-
    Stationary multiplication of color matrices along return words. The
    analytic tensor uses affine return pullbacks on holomorphic zero- and
    one-forms, with the color projector killing every mixed word.
  parameters: >-
    Projector colors 1 through 7 and words through length 5; radical colors 1
    through 6 and words through length 5; graded colors 1 through 5 and words
    through length 4; Hankel colors 1 through 8 at depth 2; support and color
    algebras through 12 colors; polynomial de Rham degrees 2 through 5 and
    powers through 6; inventory cutoffs 31, 127, and 511.
  parameter_provenance: >-
    The wordwise coefficient, empty-word conventions, finite representation
    class, exact matrices, aggregate adversary, grading, controls, marker
    ownership, domains, and route tuple are frozen before the canonical run.
    Arithmetic inventory predicates occur only in sdc28_evaluator.py.
  arithmetic_origin: >-
    The inherited full-shift semiring has rational primes as multiplicative
    atoms and entropy log(n), while the selector itself accepts arbitrary
    labels and therefore receives no prime selectivity credit.
  clock: >-
    z counts completed code returns. The inherited digit marker u retains
    u^ell(n); the selector preserves that marker but does not derive it.
  normalization: >-
    The determinant completion assigns empty-word trace m; the literal
    nonempty language assigns zero and has one dormant extra Hankel mode.
    Finite analytic checks use exact label^-2 weights.
  determinant_convention: >-
    The graded determinant is det(I-zL0)/det(I-zL1), a ratio of separately
    honest ordinary determinants. It is not the ordinary determinant of the
    ungraded direct sum.
  orbit_cutoff: >-
    Exhaustive finite words through the frozen lengths, exact finite Hankel
    matrices, de Rham powers through six, and arbitrary inventories through
    label cutoff 511.
  cutoff: >-
    Maximum colors 12, exhaustive word length 5, polynomial degree 5, power
    8 for the aggregate adversary, and inventory cutoff 511.
  precision: >-
    Exact integers, fractions, SymPy matrices, ranks, traces, determinants,
    and SHA-256. No floating-point value decides a claim.
  training_data: none
  allowed_data:
    - opaque color words and exact support sets
    - finite projector, triangular radical, and graded matrices
    - exact Hankel matrices and color-algebra multiplication
    - affine polynomial zero-form and one-form pullbacks
    - post-freeze prime square Fibonacci integer random hash modular controls
    - deterministic SHA-256 artifact auditing
  forbidden_data:
    - prime predicates in the candidate core
    - target Euler coefficients or target-zero data in the candidate
    - abelianized aggregate traces substituted for individual word traces
    - word-dependent support fibers called stationary fixed representations
    - graded ratios called ordinary ungraded block determinants
    - analytic continuation of the scalar product called operator continuation
    - universal infinite-dimensional collapse claims
    - Route-B operators or RH claims
