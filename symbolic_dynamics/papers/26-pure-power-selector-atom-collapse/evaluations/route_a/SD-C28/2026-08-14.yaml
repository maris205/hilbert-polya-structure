  infinite-dimensional traces, odd-letter supercategories, unbounded
  complexes, or nonlocal weights; it uses no target zeros and makes no RH or
  Route-B claim.
blocking_conditions:
  - finite recognizable memory grows with the number of colors
  - finite graded traces leave one net simple character per supplied color
  - radicals and common graded sectors change matrices but not the determinant
  - aggregate commuting traces can hide oriented mixed necklaces
  - support exterior cancellation is word-indexed rather than stationary
  - separable color-algebra Hochschild homology is the atom inventory
  - countable projectors are a direct sum of supplied color blocks
  - the analytic family stops at its absolute trace-class domain
  - this candidate constructs no completed analytic or spectral carrier
