claim_boundary: >-
  SD-C28 proves and audits the finite wordwise selector, Hankel growth,
  finite virtual semisimple collapse, radical invisibility, aggregate-only
  counterexample, word-indexed support Euler identity, atomic C^m
  bar/Hochschild collapse, de Rham tensor preservation, countable projector
