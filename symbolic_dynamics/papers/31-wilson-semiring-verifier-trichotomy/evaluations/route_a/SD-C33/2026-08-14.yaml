claim_boundary: >-
  SD-C33 proves additive reconstruction, exact failure of Paper30's bare
  polynomial-UFD clone, matched-semiring transport, Wilson prime-cycle
  classification, formal marked products, entropy-budget noncompactness,
  first-return marker change, and transient pruning for total support
  verifiers. It does not claim addition breaks every clone, identify the
  formal product with a determinant of the primary graph, transfer induced or
  transient ownership, produce critical-line continuation or a fixed
  self-adjoint operator, compare target zeros, or imply RH.

blocking_conditions:
  - an isomorphic matched semiring clone copies all source-natural Wilson data
  - terminal verification prunes from transient periodic orbit data
  - exact entropy roof is diluted across p minus one disjoint cycle edges
  - the primary recurrent adjacency is noncompact in every positive half-plane
  - first return changes original graph time and the free marker
  - no primary determinant gamma completion Weil compression or zero theorem exists

next_smallest_test: >-
  Derive a nonterminal overlapping recurrent interaction before accept/reject
  is known. Prove compactness or an honest determinant for the uninduced whole
  operator, preserve the original graph-step marker, and rerun matched-clone
  and universal compiler controls before any new RH claim.

round2_clues:
  - do not replace Wilson by another terminal primality test
  - overlapping recurrence must be source-derived before the terminal Boolean
  - total roof versus recurrent length must satisfy the compactness criterion
  - first-return equality at z equals one is not marker preservation
  - a matched isomorphic relabel must copy every natural construction
  - whole-operator ownership must precede Euler specialization

route_b_invocation_allowed: false
