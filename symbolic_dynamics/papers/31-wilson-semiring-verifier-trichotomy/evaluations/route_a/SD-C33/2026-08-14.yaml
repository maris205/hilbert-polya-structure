source_lock:
  candidate_definition: >-
    Reconstruct the nonnegative integers from alphabet-sum and product on
    finite full shifts, derive quotient/remainder from successor order, and
    compile the Wilson residue recurrence into one stationary countable graph.
    A terminal edge closes exactly when the final residue is n-1; a closed
    block carries graph length n-1 and total entropy roof log n.
  object: >-
    The primary object is the recurrent Wilson vertex adjacency on the
    disjoint closed blocks of the stationary graph with nonnegative exact-
    clock roofs. The formal marked product, transient accept-loop verifier,
    and induced first-return diagonal are comparison objects with separate
    ownership.
  family: symbolic_dynamics
  phase_space: >-
    Conjugacy classes of finite full shifts with alphabet-sum, alphabet-product,
    successor order, and source-derived congruence; Wilson states are triples
    of full-shift source objects. Bare and matched semiring clones plus finite
    semiring and operation-table controls are adversarial comparisons.
  dynamics: >-
    For each n at least two, deterministic edges follow successive factorial
    residues modulo n. A terminal success closes one primitive cycle of length
    n-1; failure enters an acyclic cemetery. Recurrent, transient, and induced
    architectures are never identified.
  parameters: >-
    cutoff=4096; marker comparison cutoff=31 and s=2; operation-table seed
    31033; 32 random four-element table pairs; bare grid 1..12 squared;
    matched-clone grid 0..12 squared; sigma=1,2,3; formal trace powers 1..16;
    universal support cutoff=128.
  parameter_provenance: >-
    Source operations, Wilson recurrence, cutoff, controls, roofs, markers,
    wrapper supports, ownership distinctions, route tuple, and stop rules were
    frozen in the research package and authority experiment plan before
    authority outputs. The independent evaluator imports neither candidate
    core nor generator.
  arithmetic_origin: >-
    Alphabet-sum and product reconstruct N0; successor order derives remainder
    without factorization. Wilson's terminal congruence is computed by the
    candidate recurrence. Trial division exists only in the source-separated
    evaluator. No prime table, target Euler coefficients, or target-zero data
    is supplied to candidate code.
  clock: >-
    A recurrent n-block has n-1 original graph steps and total roof log n, so
    it owns marker z^(n-1). First return contracts that block to one induced
    step with marker z. Equality at z=1 does not transfer free-marker
    ownership.
  normalization: >-
    Uniform display allocation tau=log(n)/(n-1) is frozen, while the
    noncompactness theorem covers every nonnegative allocation with total roof
    log n. Exact rational products at s=2 and z in {1,1/3} replace sampled
    determinant comparisons.
  determinant_convention: >-
    The primary recurrent adjacency is noncompact for Re(s)>0 and owns no
    ordinary Fredholm determinant. Its marked Euler product is formal periodic
    data. The first-return diagonal is trace class exactly for Re(s)>1 but is a
    changed time object; a regulated transient verifier prunes to accept loops.
  regularization_order: "not_applicable; no_modified_determinant_claim"
  main_theorem_marker: "free z; Euler specialization z=1"
  orbit_cutoff: >-
    All n from 2 through 4096, all accepted Wilson blocks, all composites and
    base-2 pseudoprimes, 144 bare-addition pairs, 169 matched-clone operation
    rows, 33 table controls, 16 formal powers, two marker values, and five
    universal supports.
  cutoff: >-
    The finite cutoff is an implementation and adversarial-control certificate
    only. Infinite prime-cycle classification, matched-clone naturality,
    noncompactness, first-return ownership, and pruning are proved independently.
  precision: >-
    Exact integers, fractions.Fraction products, deterministic operation
    tables, SHA-256 residue-path hashes, UTF-8 JSON/CSV, and SHA-256 artifact
    ledgers. Floating edge bounds are display witnesses only and decide no gate.
  training_data: none
  allowed_data:
    - finite-full-shift alphabet cardinality and transported relabels
    - alphabet-sum, alphabet-product, successor order, quotient and remainder
    - Wilson residue recurrence and terminal equality
    - nonnegative exact-clock roofs with total log n
    - fixed cutoffs, seeds, grids, trace powers, and marker values
    - source-separated trial-division evaluation
    - bare and matched semiring clones and declared finite controls
    - exact rational products and deterministic SHA-256 auditing
  forbidden_data:
    - prime, factorization, accepted-support, or target-zero tables in candidate core
    - using independent trial division to choose candidate closing edges
    - excluding the matched transported semiring clone from naturality controls
    - calling a formal periodic product the Fredholm determinant of a noncompact operator
    - transferring first-return determinant ownership to the recurrent graph
    - treating z=1 equality as free-marker equivalence
    - presenting verifier pruning as Wilson-specific spectral information
    - cross-family repairs, Route-B operators, or RH claims
