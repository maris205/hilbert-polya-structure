a0:
  verdict: A0_STRUCTURAL_ARITHMETIC_RELATION
  evidence_status: PROVED_SCOPED
  strongest_evidence: >-
    Alphabet-sum and product reconstruct N0 from finite full shifts, and the
    successor order derives quotient/remainder. Candidate-core AST inspection
    finds no prime, factorization, file, network, or target-zero oracle. The
    bare polynomial-UFD monomial clone fails already at 1+1.
  strongest_failure: >-
    A matched semiring relabel transports addition, multiplication, remainder,
    Wilson states, paths, roofs, and markers exactly. Structural origin breaks
    the old bare clone but cannot distinguish an isomorphic presentation.
  arithmetic_controls:
    - every n from two through 4096 with independent trial-division evaluation
    - all 3531 composites and 13 base-2 Fermat pseudoprimes
    - 144 ordinary bare-UFD addition pairs
    - 169 matched transported semiring operation pairs and all Wilson paths
    - Boolean Zmod11 N-polynomial and tropical source-lock controls
    - 32 random operation tables and a matched relabel of Zmod11
  artifacts:
    - results/source_oracle_certificate.json
    - results/wilson_ledger.csv
    - results/bare_ufd_addition_failure.csv
    - results/matched_semiring_clone.csv

a1:
  verdict: A1_PASS_ANALYTIC
  evidence_status: PROVED_SCOPED
  strongest_evidence: >-
    Wilson's congruence closes exactly one primitive cycle of graph length p-1
    for every prime p, and no composite block. Temporal repetition r has total
    roof r log p and weight p^(-rs). The formal marked product converges
    normally for |z|<1 and specializes to the Euler product at z=1, Re(s)>1.
  strongest_failure: >-
    Closure is terminal accept/reject compilation rather than an intrinsic
    cancellation inside a recurrent interacting system. The marked trace is a
    finite divisor-of-cycle-length sum, not an ordinary operator trace.
  metrics:
    cutoff: 4096
    accepted_prime_cycles: 564
    rejected_composites: 3531
    pseudoprime_controls_rejected: 13
    formal_trace_orders: 16
    marker_rows: 2
  artifacts:
    - results/wilson_ledger.csv
    - results/composite_controls.csv
    - results/fermat_pseudoprime_controls.csv
    - results/formal_trace_ledger.csv
    - results/marker_change_certificate.json

