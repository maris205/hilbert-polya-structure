source_lock:
  candidate_definition: >-
    For M_r=<u,v | vu=u^r v>+ with r at least two, add formal reverse edges,
    use the cyclically nonbacktracking Hashimoto shift with one free marker z
    per original oriented edge, and attach every source-derived Cayley cell.
    Test whether complete relation cancellation can retain a nonzero primitive
    sector and the same marker while owning one determinant and failing
    matched generic presentations.
  object: >-
    One uninduced oriented-edge affine Cayley object. The primary analytic
    operator is T_(r,theta)=D_theta H_r D_theta on the full edge space. The
    filled Cayley complex, finite quotients, enveloping-group trace, and
    scalar chain superlift are explicitly distinguished control objects.
  family: symbolic_dynamics
  phase_space: >-
    Cyclically nonbacktracking paths on the formal-reverse enlargement of the
    positive right Cayley graph of N_0 semidirect_r N_0.
  dynamics: >-
    A Hashimoto transition advances one original oriented graph edge. Free
    backtracks are forbidden at every join. Source relation polygons remain
    primitive before Cayley-cell filling.
  parameters: >-
    r=2,3,4,5 with composite baseline r=4; balanced r=1; word lengths zero
    through twelve; theta=1/2; finite controls (1,4,3),(2,3,2),(3,4,2),
    (4,5,2),(4,7,3),(5,6,2); exact Fraction arithmetic; A/B and cold C.
  parameter_provenance: >-
    SOURCE_LOCK.md, root PREREGISTRATION.md, experiments/PREREGISTRATION.md,
    and experiments/EXPERIMENT_PLAN.md froze the object, controls, bridge,
    source/evaluator firewall, route tuple, and stop rules before authority
    code and results.
  arithmetic_origin: >-
    The exponent r and semidirect affine multiplication are structural source
    relations. No prime basis, accepted-support table, factorization oracle,
    target coefficient, or target-zero datum enters either process.
  clock: >-
    The free variable z counts one original oriented edge. The relation cell
    compares lengths two and r+1, so the unit marker cannot descend for r at
    least two. Setting z=1 or deg(u)=0 earns no same-clock credit.
  normalization: >-
    Source-coordinate damping is d_theta(e)=theta^(1+b(e)+k(e)); theta=1/2
    is the exact audit value and the theorem covers every 0<theta<1.
  determinant_convention: >-
    The ordinary Fredholm determinant det(I-zT_(r,theta)) belongs only to the
    trace-class prequotient edge operator. Cellular H1 and the scalar graded
    determinant are not identified with that ordinary determinant.
  regularization_order: "not_applicable; ordinary_trace_class_Fredholm_determinant_only"
  main_theorem_marker: "one free z per original oriented graph edge"
  orbit_cutoff: >-
    Identity words through length twelve for r=2,3,4,5; balanced r=1; six
    exact finite semidirect controls; all scalar-lift powers through twelve.
  cutoff: >-
    Finite rows certify implementation and controls only. Infinite
    contractibility, marker non-descent, trace-class ownership, and generic
    supertrace cancellation have independent proofs.
  precision: >-
    Exact integers, fractions.Fraction, rational Gauss-Jordan rank, canonical
    UTF-8 JSON/CSV/YAML, byte comparison, and SHA-256; no floating tolerance.
  training_data: none
  allowed_data:
    - affine presentation multiplication and normal forms
    - formal reverse edges and relation words
    - finite semidirect actions and exact boundary matrices
    - source-coordinate damping and exact rational trace coefficients
    - post-source independent reconstruction and frozen generic controls
  forbidden_data:
    - prime-labelled generators factorization or accepted-support tables
    - KMS GNS boundary vacuum or terminal projectors
    - first return acceleration altered clocks or z=1 substitution
    - target zeros coefficient fitting or Route B
    - finite quotient determinant promoted to the infinite source
