a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: PROVED_SCOPED
  strongest_evidence: >-
    The weighted incidence operators and both holomorphic de Rham degrees are
    honest trace-class families on their absolute-convergence domain. All
    finite Fredholm and degreewise determinant checks are exact, and the
    graded ratio is the atom product.
  strongest_failure: >-
    Every finite cutoff is explicitly zeta-conjugate to coordinate projectors;
    for eta>1 the global zeta and Mobius transforms are bounded inverses. Thus
    the ordinary determinant contains no oblique-incidence information.
