overall_verdict: ROUTE_A_REJECTED

claim_boundary: >-
  SD-C29 proves a source-derived, all-repetition atom selector and honest
  graded determinant. It also proves finite radical conjugacy and eta>1
  bounded similarity to coordinate atom projectors. It does not claim first
  Mobius idempotents, analytic continuation, a target-zero theorem, a
  critical-line carrier, or any RH implication.

blocking_conditions:
  - finite incidence primitive lifts are unitriangularly coordinate-conjugate
  - eta>1 countable realization is boundedly similar to the diagonal atom table
  - u=1 trace class stops at Re(s)>1
  - mutated source proves the compiler has no independent primality oracle
  - ordinary traces cannot see mixed adjoint Gram geometry

next_smallest_test: >-
  Freeze the same cover-derived oblique idempotents and test one chiral/adjoint
  completion: exact mixed Gram kernel, t-motion, maximal common Schatten strip,
  and at most one canonical source-derived regularization, always against
  diagonal and mutated-source controls and without target-zero data.

round2_clues:
  - compute q_p^* q_q before any determinant
  - use a two-variable holomorphic/antiholomorphic family before real t-motion
  - preserve u^(r ell(p)) in every cyclic expansion
  - stop if singular values reduce to generic rank-one Gram data
  - stop if a relative determinant depends on a fitted reference

route_b_invocation_allowed: false
