source_lock:
  candidate_definition: >-
    On the fixed locally finite divisibility poset of positive integers, form
    q_n = zeta epsilon_n Mobius. Select only covers of one, tensor those
    oblique primitive idempotents with the inherited gamma-coded holomorphic
    de Rham branches, and retain every cyclic repetition and digit marker.
  object: >-
    Finite incidence algebras of divisibility downsets, their countable
    weighted-Hilbert rank-one realization, source-derived atom return words,
    and degreewise trace-class holomorphic zero-form and one-form transfers.
  family: symbolic_dynamics
  phase_space: >-
    Gamma-coded return words labelled by positive integers. The auxiliary
    incidence fiber is derived from the same integer divisibility grammar and
    does not replace the symbolic dynamical system.
  dynamics: >-
    Stationary multiplication of cover-filtered incidence idempotents along
    return words. Mixed labels vanish before trace; a monochromatic atom word
    remains q_p. The analytic tensor follows the frozen affine gamma branches.
  parameters: >-
    Main incidence cutoff 30; independent cover validation through 256;
    all pair products; cyclic classes over source atoms 2,3,5,7 through length
    6; repetitions through 8; de Rham source cutoff 10 and polynomial degree 3;
    weighted-Hilbert eta values 3/5, 3/4, 1, and 5/4; bounded-similarity eta
    values 5/4, 3/2, and 2.
  parameter_provenance: >-
    Divisibility, cover derivation, incidence inverse, gamma code, wordwise
    coefficient, determinant convention, marker ownership, controls, domains,
    and route tuple were frozen before the canonical run. Trial division and
    scalar arithmetic Mobius occur only in the separated post-freeze evaluator.
  arithmetic_origin: >-
    Covers of one in the fixed integer divisibility source are exactly the
    rational primes. The same source label supplies n^-s, while the gamma code
    supplies u^ell(n). No prime table, target coefficient table, or target-zero
    data is an input.
  clock: >-
    z counts completed gamma-code returns and u counts binary digit steps.
    The r-th traversal of the atom loop p has marker u^(r ell(p)).
  normalization: >-
    Each compiled primitive idempotent has trace one. Finite determinant checks
    use exact s=2, u=1/2, and z=1/3. Displayed weighted-Hilbert norms are
    nongating high-precision evaluations of a proved exact formula.
  determinant_convention: >-
    The analytic object is det(I-zT0)/det(I-zT1), a graded relative ratio of
    two separately honest ordinary Fredholm determinants. It is not the
    ordinary determinant of the ungraded direct sum.
  orbit_cutoff: >-
    All 1016 cyclic classes over four source-derived atoms through length six,
    plus exact power traces and marker exponents through repetition eight.
  cutoff: >-
    Incidence 30, cover validation 256, smaller downset 18, relabeling 12,
    de Rham source cutoff 10, and polynomial degree 3.
  precision: >-
    Exact integers, fractions, SymPy matrices, ranks, traces, determinants,
    and SHA-256. Mpmath values only display theorem bounds and decide no route
    claim.
  training_data: none
  allowed_data:
    - finite positive-integer divisibility relations
    - incidence zeta and relation-derived convolution inverse
    - covers of the bottom source element
    - gamma-coded affine return branches and digit lengths
    - exact word traces, ranks, determinants, and de Rham chain maps
    - separated post-freeze trial-division and scalar-Mobius controls
    - deterministic SHA-256 artifact auditing
  forbidden_data:
    - supplied prime or color projector tables
    - prime predicates or factorization oracles in the candidate core
    - target Euler coefficients or target-zero data
    - scalar endpoint Mobius substituted for necklace-resolved selection
    - digit duration silently replaced by completed-return time
    - graded determinant ratio called an ordinary ungraded determinant
    - analytic continuation of a scalar formula called operator continuation
    - cross-family repairs, Route-B operators, or RH claims
  code_commit: 5645ba65248b334a9e4ea2061945f2d20e426ba0
