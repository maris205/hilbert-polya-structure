  controls_used:
    - exact two-sided zeta-Mobius inverse checks
    - all 900 primitive-idempotent pair products
    - cover atoms against separated trial division
    - every cyclic class over four atoms through length six
    - composite-letter and marker ownership controls
    - finite Fredholm and honest de Rham determinant ratios
    - weighted-Hilbert norm and bounded-similarity certificates
