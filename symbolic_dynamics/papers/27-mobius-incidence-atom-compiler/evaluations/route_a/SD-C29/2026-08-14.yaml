a0:
  verdict: A0_ANALYTIC_ARITHMETIC_ORIGIN
  evidence_status: PROVED
  strongest_evidence: >-
    All 256 cover classifications agree with the separated evaluator. Atomhood
    is derived from the fixed integer divisibility relation, and each return
    has its source label weight n^-s and gamma digit marker u^ell(n).
  strongest_failure: >-
    The mutated-poset control promotes 6 to an atom and the compiler selects
    it. The mechanism faithfully compiles any supplied locally finite source
    grammar and therefore has a formal PROVES_TOO_MUCH boundary.
  arithmetic_controls:
    - independent post-freeze trial division through 256
    - standard versus six-promoted source relation
    - deterministic source relabeling
    - divisibility-downset cutoff restriction
  artifacts:
    - results/cover_atom_ledger.csv
    - results/source_mutation_controls.csv
    - results/stability_equivariance_ledger.csv
    - results/source_oracle_certificate.json

a1:
  verdict: A1_PASS_ANALYTIC
  evidence_status: PROVED
  strongest_evidence: >-
    The only selected primitive cyclic classes are the one-letter cover-derived
    atom loops. All 1016 cyclic classes through length six pass exactly, and
    all repetitions have multiplicity one and marker u^(r ell(p)).
  strongest_failure: >-
    The selector succeeds by compiling each source atom to one primitive
    idempotent. Finite and eta>1 countable realizations are similar to a
    coordinate atom projector table after atom derivation.
  metrics:
    cover_validation_rows: 256
    cover_disagreements: 0
    necklace_rows: 1016
    necklace_failures: 0
    marker_rows: 80
    marker_failures: 0
    power_trace_rows: 8
