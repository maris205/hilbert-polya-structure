source_lock:
  candidate_definition: >-
    The Elias-gamma integer code lifted through two fixed affine disk inverse
    branches and the canonical holomorphic de Rham 0|1 pullback, assembled
    either as one shared renewal disk or as disjoint inventory-indexed disks.
  object: >-
    Degree-zero and degree-one trace-class Bergman transfer operators with
    their graded relative determinant, plus exact polynomial-chain models
    P_N -> P_(N-1) dz. The graded ratio is never identified with the ordinary
    determinant of the ungraded direct-sum block.
  family: symbolic_dynamics
  phase_space: >-
    A countable full shift on completed Elias-code return labels for the
    shared assembly, or a disjoint union of one recurrent code component per
    supplied label for the inventory assembly.
  dynamics: >-
    Digit maps psi_0(z)=z/2-1/4 and psi_1(z)=z/2+1/4 compose according to the
    frozen code word. Degree-one pullback includes the derivative q, and the
    differential intertwines degree zero and one.
  parameters: >-
    Code registry 2 through 4096; scalar powers 1 through 6 for labels 2
    through 512; polynomial degrees 1,2,3,4,5,8; de Rham powers through 8;
    shared/disjoint first-four-atom finite fixtures at inventory cutoffs
    31,127,511; primitive necklaces on two, three, and four labels through
    length six; seven mandatory inventory families, with full-inventory sums
    and z=1 products in the control ledger.
  parameter_provenance: >-
    Code, affine branches, ordering, polynomial bases, differential, 0|1
    grading, shared/disjoint ownership, digit/return markers, controls,
    domains, cutoffs, and Route tuple were frozen in SOURCE_LOCK.md and
    experiments/EXPERIMENT_PLAN.md before the canonical execution. Inventory
    predicates occur only in sdc27_evaluator.py.
  arithmetic_origin: >-
    Gamma code words and digit composition are source-side symbolic data; the
    one-form numerator is canonical derivative functoriality. Selecting the
    prime inventory occurs only after the analytic compiler is frozen.
  clock: >-
    Return marker z counts completed code branches. Original binary digit
    marker u gives u^ell(n)n^(-s); replacing it by z is first-return induction
    or a countable whole-codeword alphabet, not an unchanged graph identity.
  normalization: >-
    Zero-form matrices use the monomial basis 1,z,...,z^N; one-form matrices
    use 1,z,...,z^(N-1) times dz; D_(k-1,k)=k. Branch weights are exact n^(-2)
    in finite algebra certificates.
  determinant_convention: >-
    D_gr=det(I-zL0)/det(I-zL1) is a graded or relative determinant of two
    separately honest ordinary Fredholm operators. The ordinary block
    determinant is their product and is explicitly audited as a different
    object.
  orbit_cutoff: >-
    Code/marker identities through 4096; scalar rigidity through 512;
    necklaces through length six; exact finite shared/disjoint ledgers through
    cutoff 511.
  cutoff: >-
    Maximum code 4096, scalar 512, inventory 511, polynomial degree 8, power
    8, necklace alphabet size 4 and length 6.
  precision: >-
    Exact integers, fractions, SymPy rational matrices, characteristic
    polynomials, and primitive words. No floating-point value decides a
    claim.
