    D_minus=product(1+x_p), and D_reg=D_plus D_minus=product(1-x_p^2).
    All formal, repetition, character, and same-object certificates are exact.
  strongest_failure: >-
    The identity is frozen only at z=1, the full regular determinant cancels
    the apparent zeta(s) divisor between blocks after continuation, and no
