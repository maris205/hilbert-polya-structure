a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    Primitive base necklaces, total degree, Frobenius, lift traversal q, and
    lifted-cycle multiplicity are intrinsic and exactly enumerated at every
    frozen cutoff. The primary C2 extension has genuine recurrent motion.
  strongest_failure: >-
    A singleton atom closes only after m traversals in a C_m extension, while
    mixed subset primitives with degree divisible by m close immediately.
    Therefore atoms are not the primitive closed orbits of the full extension.
  metrics:
    primitive_definition: cyclic_necklaces_of_nonempty_subset_symbols
    reflection_quotiented: false
    primitive_base_rows: 350
    base_lift_formula: q=m/gcd(m,c)
    lifted_cycle_multiplicity: gcd(m,c)
    c2_n_ge_2_rows_with_mixed_immediate_closures: 40/40
    largest_base_primitive_count: 81962825835072
    largest_mixed_immediate_closure_count: 40981411486080
    largest_lifted_primitive_cycle_count: 122944237321152
    completeness_risk_for_frozen_ranges: none_exact_recurrence
  artifacts:
