claim_boundary: >-
  SD-C19 proves that the tensor-subset shift admits a genuine recurrent C2
  fiber whose Artin character determinants are atom-local at z=1, and proves
  that functorial operator-coherent one-letter atom locality collapses to
  uniform cyclic degree. It does not prove primitive prime-orbit matching,
  arithmetic selectivity, a transition-cocycle no-go, a completed target
  divisor, RH, or a Hilbert-Polya operator.
blocking_conditions:
  - prime singleton clocks multiply by the fiber order
  - mixed primitive lifts survive at every nontrivial frozen C2 cutoff
  - the one-letter clean branch has only cyclic factor-count holonomy
  - controls reproduce every formal determinant identity with zero pass-rate margin
  - isotypic divisors cancel in the whole regular determinant after continuation
  - no completed analytic structure or intrinsic Weil compression exists
  - no natural operator lift exists
