source_lock:
  candidate_definition: >-
    For every finite tensor-atom inventory P, take the one-vertex full shift on
    all nonempty subsets S of P with scalar coefficient
    epsilon(S)=(-1)^(|S|+1), monomial x_S, and the intrinsic C2 cocycle
    alpha(S)=|S| mod 2.
  object: >-
    The projective family of finite signed subset shifts and their genuine C2
    skew extensions, with regular transfer B_reg=sum_S epsilon(S)x_S
    L_a^|S| and its trivial/sign isotypic blocks at z=1.
  family: symbolic_dynamics
  phase_space: >-
    X_P times C2, where X_P is the two-sided full shift on nonempty subsets of
    a frozen finite atom set. Deck translations act only on C2 and commute with
    the weighted shift without changing atoms or roofs.
  dynamics: >-
    The skew shift (x,g) maps to (sigma x,g+alpha(x_0)). Every nonempty finite
    restriction is transitive; restrictions with at least two atoms are
    mixing, while the one-atom restriction has period two.
  parameters: >-
    Formal C2 atoms n=1..10; trace degree 1..10; C_m orders 2..8 and all
    characters; primitive census n=1..5, base length 1..10, m=2..8;
    naturality degree 2..6; control seeds 17000..17015.
  parameter_provenance: >-
    Group, cocycle, normalization, cutoffs, controls, and seeds were frozen
    before execution. There are no fitted parameters and no target-zero data.
  arithmetic_origin: >-
    Tensor-indecomposable finite full shifts are F_p and entropy h(F_p)=log p
    supplies x_p=exp(-s h(F_p)). The free-commutative polynomial construction
    is defined before arithmetic specialization.
  clock: >-
    T(S)=sum_(p in S) h(F_p), extended additively along symbolic words; no
    fitted scale or offset.
  normalization: >-
    epsilon(S)=(-1)^(|S|+1), alpha(S)=|S| mod 2, and auxiliary temporal
    normalization z=1. Off-shell atom-local factorization is forbidden.
  determinant_convention: >-
    D_chi=det(I-B_chi), D_reg=det(I-B_reg)=D_plus D_minus. D_reg is the whole
    regular-extension determinant; D_plus and D_minus are isotypic block
    determinants. Dynamical Artin L notation would invert these factors.
  orbit_cutoff: >-
    Exact primitive base-necklace degree recurrence through n=5 and base word
    length 10; C_m lift closure and multiplicity through m=8.
  cutoff: >-
    Ten formal C2 cutoffs, 300 repetition rows, 350 C_m character rows, 350
    primitive/lift rows, 72,079 naturality tables in 35 cells, 84 cohomology
    controls, four transition controls, and 64 inventory controls.
  precision: >-
    Integer, Fraction, sparse formal-polynomial, and exact SymPy matrix
    arithmetic only. No floating root calculation is used.
  training_data: none
  allowed_data:
    - tensor multiplication, tensor indecomposability, and entropy of finite full shifts
    - formal subset monomials and ordinary scalar edge signs
    - finite cyclic groups, regular representations, and exact characters
    - primitive symbolic necklaces, periodic holonomy, and lift multiplicity
    - prime, composite, shuffled, random-rational, and formal inventories as controls
  forbidden_data:
    - Riemann-zero tables, target spectra, zero fitting, or target-derived phases
    - prime-indexed cocycle tables or relabeling of distinct arithmetic roofs
    - identifying an isotypic block divisor with the whole regular determinant
    - claiming that atom-local factors remove mixed coefficients or primitive lifts
    - off-shell z-not-equal-1 atom-local Euler factorization
    - importing meromorphic continuation as a new Fredholm continuation theorem
    - cross-family geometric, quantum, or self-adjoint repairs
  code_commit: CODE_COMMIT_PLACEHOLDER
