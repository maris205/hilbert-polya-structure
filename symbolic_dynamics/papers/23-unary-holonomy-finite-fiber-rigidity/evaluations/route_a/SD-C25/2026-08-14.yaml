source_lock:
  candidate_definition: >-
    Over the Paper22 holonomy-two canonical cycles C_k=(k,...,2k-1), mark the
    unique minimum and attach a fixed finite semigroup or fixed finite-
    dimensional fiber to the ordered source-derived quotient word
    W(C_k)=1^(k-1)2. Growing fibers and target predicates are controls only.
  object: >-
    The q in {1,2} spine of the successor-divisor countable Markov shift and
    its column-source finite-block adjacency L_(s,A,B) on
    ell^2({2,3,...}) tensor C^d, with fixed complex matrices A and B assigned
    to the quotient letters 1 and 2. Arbitrary characteristic-zero fields are
    confined to the separate algebraic recurrence layer.
  family: symbolic_dynamics
  phase_space: >-
    The one-sided countable Markov shift on V={2,3,...} with n->d exactly when
    d>=2 divides n+1, restricted for the finite-fiber operator to quotient
    labels q=(n+1)/d in {1,2}.
  dynamics: >-
    Every n has the q=1 successor edge n->n+1, and every odd n=2d-1 has the
    q=2 return edge n->d. On C_k the ordered fiber product in column-source
    convention is B A^(k-1).
  parameters: >-
    Source/roof cutoff k<=4096; all unary maps through four states; all
    two-state Boolean relations; dimensions d=1,...,8 with six exact rational
    matrix fixtures per dimension; memorizer cutoffs 32,64,128,256 and seven
    matched target families; block cutoff 9 and powers through 32; trace
    diagnostics at sigma=0.45,0.49,0.50,0.51,0.60,1.00 through N=4096;
    five matched wrapper supports and acceptance-independent padding ell(n)=n+17.
  parameter_provenance: >-
    Object, word, marking, fiber conventions, roof, marker, cutoffs, matrix
    families, controls, exact predicate boundary, and Route tuple were frozen
    in SOURCE_LOCK.md and PREREGISTRATION.md before execution. Target
    predicates occur only in sdc25_evaluator.py.
  arithmetic_origin: >-
    The ordered word is obtained from the unique quotient witnesses
    q=(n+1)/d along a source-classified canonical cycle. It is structurally
    arithmetic, but a fixed finite fiber sees only an eventually periodic
    unary power and does not select rational-prime lengths.
  clock: >-
    The graph-step marker is z per edge and the endpoint roof is
    tau(n,d)=log(nd). On C_k this gives marker z^k and total roof
    2 log M_k, M_k=(2k-1)!/(k-1)!.
  normalization: >-
    Directed cycles are not reflection-identified. C_k is rooted at its
    unique minimum for bilinear responses. Cyclic trace responses use
    tr(B A^(k-1))=tr(A^(k-1)B). Fixed blocks are independent of cutoff.
  determinant_convention: >-
    For fixed finite A,B, not both zero, D_(A,B)(s,z)=det(I-zL_(s,A,B)) is
    the ordinary Hilbert-space Fredholm determinant on Re(s)>1/2. The local
    primitive block factor is det(I-w_k B A^(k-1)), not
    1-w_k tr(B A^(k-1)); scalar orbit filters are one-dimensional controls.
  orbit_cutoff: >-
    The source and factorial identities are audited for every 2<=k<=4096.
    The exact finite-block graph uses vertices 2,...,9 and power traces
    through period 32.
  cutoff: >-
    4096 source/roof; four finite states; eight matrix dimensions; 256 maximum
    memorizer dimension; block N=9 and r=32; trace prefixes through 4096;
    wrappers through input 4096 for recurrent diagnostics.
  precision: >-
    Exact integers and fractions for words, semigroups, recurrence residuals,
    memorizer identities, block traces, and finite determinants. Decimal
    precision 60 with directed rounding is used only for finite trace-class
    diagnostics; theorem-level thresholds are not inferred from prefixes.
  training_data: none
  allowed_data:
    - successor-divisor edges and exact quotient witnesses
    - unique-minimum marking and ordered quotient words
    - fixed finite semigroup, group, DFA, NFA, and rational matrix fibers
    - exact integer, rational, Boolean-relation, and sparse graph arithmetic
    - post-freeze target predicates used only in matched evaluator controls
    - Paper19 and Paper20 imported integrity certificates for their licensed wrapper architectures
    - deterministic SHA-256 artifact auditing
  forbidden_data:
    - prime or factorization oracle in the candidate constructor
    - Riemann-zero tables, target-root fitting, or von Mangoldt feedback
    - dimension growth presented as one fixed finite fiber
    - scalar trace cancellation presented as deletion of a matrix local factor
    - a universal impossibility claim for all countable symbolic extensions
    - first return presented as the unchanged vertex adjacency
    - replacement of z^k by z or M_k^(-2s) by k^(-s) on the same object
    - Route-B operators, RH claims, or cross-family repairs
  code_commit: 1ba47bd45c65cacc72d02969e8096d1d7a4344d5
