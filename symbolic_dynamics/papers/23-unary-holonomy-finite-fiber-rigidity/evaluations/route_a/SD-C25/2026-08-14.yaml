a0:
  verdict: A0_STRUCTURAL_ARITHMETIC_RELATION
  evidence_status: PROVED
  strongest_evidence: >-
    The unique quotient witnesses on 4095 canonical cycles produce exactly
    W(C_k)=1^(k-1)2 through k=4096. The audit checks 8,390,655 edges with no
    word, edge, marking, holonomy, or primitive mismatch and no target call in
    the candidate constructor.
  strongest_failure: >-
    The word is unary apart from one terminal letter. Source structure alone
    does not distinguish prime k from composite k.
  arithmetic_controls:
