  strongest_evidence: >-
    The scalar Fredholm determinant is analytic in the raw domain; all 512
    endpoint coefficients equal the independent Mobius/Dirichlet inverse,
    giving D_bar(s,1)=1/zeta(s) on Re(s)>1 after endpoint grouping.
  strongest_failure: >-
    The determinant is a universal geometric-series inverse and provides no
    target divisor match, arithmetic selectivity, or continuation beyond the
    ordinary reciprocal-zeta half-plane identity.
  metrics:
    zero_error_train: not_applicable
    zero_error_validation: not_applicable
    zero_error_test: not_applicable
    extra_zero_count: not_applicable
    missing_zero_count: not_applicable
    root_count_discrepancy: not_applicable
    cutoff_drift: exact_zero_for_all_formal_coefficients_through_512
    precision_drift: >-
      not_applicable_for_exact_formal_claims; numerical observations use the
      single frozen 80-digit precision and report residuals without promotion
    control_margin: not_applicable_universal_controls_also_pass_exactly
    sigma_bar: >-
      1.728647238998183618135103010297691464234109849335035732321285908423179
    raw_geometric_identity_max_residual: 1.9126762000924173e-81
    formal_endpoint_rows: 512
    universal_control_rows: 10
  artifacts:
    - results/bar_formal_coefficients.csv
    - results/bar_raw_convergence.csv
