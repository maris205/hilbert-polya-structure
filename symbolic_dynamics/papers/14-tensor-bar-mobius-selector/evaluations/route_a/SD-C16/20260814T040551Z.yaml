artifact_path_base: papers/14-tensor-bar-mobius-selector
freeze_note: >-
  First-stage research artifacts, code, results, and paper source will be
  committed together; source_commit and code_commit will be replaced by that
  commit in a second metadata-only freeze before push.

source_lock:
  object: >-
    One-vertex countable signed edge shift whose edges are nonempty ordered
    reduced words of nonunit finite full shifts in the tensor monoid
    F_m tensor F_n = F_(mn).
  arithmetic_origin: >-
    Tensor atoms, tensor powers, divisibility, topological entropy, the
    incidence Mobius inverse, and Lambda_tensor=mu_tensor*h are intrinsic to
    the same full-shift tensor source; no prime coefficient table is loaded.
  clock: "T(a_1,...,a_k)=sum_j h(F_(a_j))=log(product_j a_j)"
  normalization: >-
    Reduced-bar sign (-1)^(k+1), no fitted scale or offset, and the canonical
    determinant specialization z=1.
  determinant_convention: >-
    D_bar(s,z)=det_C(I-z L_bar,s)=1-z F_bar(s). Raw word summation is used
    only for Re(s)>sigma_bar; endpoint-first incidence grouping is used for
    Re(s)>1. At z=1, D_bar(s,1)=1/zeta(s) in the grouped domain.
  cutoff: >-
    local N={16,32,64,128}; incidence X={64,128,256,512}; formal bar endpoint
    512; raw word length through 64; grouped numeric cutoff through 100000;
    trace-log repetition through 256.
  precision: >-
    Exact integer/Fraction arithmetic for finite certificates and 80-decimal
    mpmath arithmetic for separately labeled numerical observations.
  allowed_data:
    - tensor multiplication of finite full shifts
    - intrinsic topological entropy
    - ordered reduced tensor words and divisor chains
    - exact incidence algebra and formal Dirichlet coefficients
    - scalar Fredholm determinant and generic inventory controls
  forbidden_data:
    - Riemann-zero tables or target spectra
    - target-root fitting or root selection
    - precomputed mu_tensor or Lambda_tensor as transfer weights
    - fitted per-atom phases or signs
    - Paper-13 local operator stitched to the global incidence readout
    - cross-family repairs

a0:
  verdict: A0_ANALYTIC_ARITHMETIC_ORIGIN
  evidence_status: PROVED
  strongest_evidence: >-
    All 960 exact incidence rows satisfy Lambda_tensor(p^r)=log p and vanish
    on mixed-prime endpoints; the identity is also the canonical entropy-roof
    derivative of the same bar determinant.
  strongest_failure: >-
    The reduced-bar parity is a modeling choice and universal reciprocal
    inversion is not itself arithmetically selective.
  arithmetic_controls:
    - composite-only ambient evaluations
    - 16 shuffled-prime seeds
    - 16 random-increasing seeds
    - 8 random entropy relabel seeds
    - random weighted and synthetic signed inventories
  artifacts:
    - SOURCE_LOCK.md
    - PROOF_PACKAGE.md
    - results/global_incidence_ledger.csv
    - results/global_incidence_controls.csv
    - results/entropy_relabel_controls.csv
    - results/global_incidence_summary.json

