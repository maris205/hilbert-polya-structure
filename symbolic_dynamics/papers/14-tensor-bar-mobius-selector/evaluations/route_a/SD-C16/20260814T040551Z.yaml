claim_boundary: >-
  SD-C16 proves a source-locked tensor-Mobius incidence identity and a genuine
  scalar reduced-bar Fredholm determinant on explicitly separated domains.
  It does not prove orbitwise prime correspondence, arithmetic selectivity,
  completed-zeta divisor structure, RH, or a Hilbert-Polya operator. The
  global incidence readout is not the Paper-13 local character operator.
blocking_conditions:
  - primitive bar-code necklaces are not tensor atoms
  - universal inversion proves too much on generic inventories
  - no completion or target divisor theorem beyond Re(s)>1
  - no intrinsic Weil compression
  - no natural operator lift
next_smallest_test: >-
  Within Symbolic Dynamics, test whether a canonical sign-reversing quotient
  before cyclic primitive reduction can retain one atom class and its
  repetitions while cancelling composite factorization histories; otherwise
  prove the universal bar inversion cannot become an orbitwise Euler ledger.
