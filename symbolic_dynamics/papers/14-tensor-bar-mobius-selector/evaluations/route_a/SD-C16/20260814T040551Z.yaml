  strongest_failure: >-
    Primitive necklaces are not tensor atoms or rational primes; the
    prime-power ledger appears only after signed endpoint aggregation.
  metrics:
    primitive_definition: cyclic_necklaces_of_ordered_bar_code_edges
    repetition_formula: "-log D_bar=sum_(r>=1) z^r F_bar^r/r"
    trace_log_rows: 81
    final_trace_log_max_residual: 7.151980202205042e-30
    orbitwise_prime_bijection: false
    monodromy_or_stability: not_applicable
  artifacts:
    - results/bar_trace_log.csv
    - EXPERIMENT_REPORT.md

a2:
