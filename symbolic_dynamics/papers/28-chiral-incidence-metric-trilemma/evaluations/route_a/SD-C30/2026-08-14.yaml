source_lock:
  candidate_definition: >-
    Freeze the Paper27 cover-derived incidence idempotents q_n = Z E_n M in
    weighted source coordinates. Form the holomorphic reflected chiral block
    with T_s in the upper leg and T_(1-s)-sharp in the lower leg. On the
    critical line the reflection is the actual weighted adjoint.
  object: >-
    Finite source-incidence matrices and their eta-greater-than-one weighted
    countable realization; native mixed Gram forms; reflected chiral blocks;
    positive metric completions; and order-three modified Fredholm
    determinants.
  family: symbolic_dynamics
  phase_space: >-
    The same gamma-coded integer return grammar as Paper27, with an auxiliary
    incidence fiber derived from its finite divisibility downsets. Mutated,
    composite-only, and seeded DAG relations are controls only.
  dynamics: >-
    Chiral coupling of source-derived atom transfers with the reflected
    weighted transpose. The common critical-line parameter t enters the atom
    phases and creates mixed Gram frequencies in native coordinates.
  parameters: >-
    eta=2 for exact finite and displayed infinite formulas; standard cutoff
    N=30; mutated cutoff N=12; composite-only labels 1,4,6,9,12,18,36;
    deterministic DAG seed 2801; Schatten orders 1 through 8; determinant
    powers 1 through 8; marker labels 2,3,5 and repetitions 1 through 8.
  parameter_provenance: >-
    Candidate family, weighted sharp, eta, source fixtures, regularization
    order, marker ownership, controls, domains, and route tuple were frozen
    before the canonical double-run. The evaluator is separate from the
    candidate core.
  arithmetic_origin: >-
    The baseline source is the fixed positive-integer divisibility relation
    and its incidence inverse. Covers of one determine the active atoms. No
    prime projector table, target coefficient table, or target-zero data is
    supplied to the candidate.
  clock: >-
    z counts completed chiral returns and u counts gamma-code digit steps. An
    r-fold atom traversal retains u^(r ell(label)).
  normalization: >-
    Incidence primitives have trace one. Weighted coordinates use label^(2
    eta). Closed infinite Gram formulas use C_eta=zeta(2 eta)/zeta(4 eta).
    Common-t samples are display-only and decide no claim.
  determinant_convention: >-
    det3(I-z B_s) is the order-three modified Fredholm determinant, honest
    only where B_s lies in S3. Its logarithm deletes powers one and two. A
    finite Tr(B squared) is a diagnostic and is never called an infinite
    trace-class identity.
  regularization_order: 3
  main_theorem_u: 1
  orbit_cutoff: >-
    Marker repetitions one through eight; determinant powers one through
    eight; three exact unordered baseline atom pairs; all selected atoms in
    each of four source fixtures.
  cutoff: >-
    Standard 30, mutated 12, composite-only 7 labels, seeded DAG 10 labels.
    Infinite formulas and Schatten membership are theorem certificates rather
    than finite extrapolations.
  precision: >-
    Exact integers, rational functions, SymPy matrices, radicals, symbolic
    exponentials, and SHA-256. Twelve numerical t displays are nongating.
  training_data: none
  allowed_data:
    - fixed finite locally finite poset relations
    - relation-derived incidence zeta and Mobius inverse
    - source covers and numeric source labels
    - exact weighted Gram traces and symbolic phase variables
    - standard Schatten and modified Fredholm determinant identities
    - deterministic mutated, composite-only, and seeded-DAG controls
    - deterministic SHA-256 artifact auditing
  forbidden_data:
    - supplied prime or color projector tables
    - primality or factorization oracles in the candidate core
    - target Euler coefficients or target-zero data
    - finite B2 diagnostics presented as an infinite trace
    - damping u below one presented as continuation at u=1
    - a t-dependent family presented as one fixed spectral operator
    - orthogonalized auxiliary z-zeros presented as target zeros
    - cross-family repairs, Route-B operators, or RH claims
