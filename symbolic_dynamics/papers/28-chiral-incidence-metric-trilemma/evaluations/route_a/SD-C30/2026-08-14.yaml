  evidence_status: PROVED_SCOPED
  strongest_evidence: >-
    T_s lies in S_q exactly when q Re(s)>1. The reflected block has a common
    S3 strip 1/3<Re(s)<2/3, so det3 is honest on a domain containing the
    critical line. A unique positive fourth-order frequency survives.
  strongest_failure: >-
    The critical block is not in S2, so B squared is not trace class. det3
    deletes powers one and two, and its surviving motion occurs on all
    adversarial source relations.
