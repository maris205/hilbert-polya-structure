claim_boundary: >-
  SD-C30 proves an honest S3/det3 critical strip, exact native mixed-Gram
  motion, a unique positive fourth-order frequency, and a positive-metric
  completion trilemma. It does not claim an infinite B2 trace, restoration of
  the Paper27 Euler determinant, arithmetic selectivity, a fixed Hilbert-Polya
  operator, target-zero agreement, analytic continuation, or any RH result.

blocking_conditions:
  - critical-line chiral block is not Hilbert-Schmidt
  - det3 deletes the quadratic motion ledger
  - fourth-order native motion survives on nonarithmetic controls
  - all positive active metrics force coordinate decoupling
  - orthogonal completion is phase-free
  - the self-adjoint object is a t-dependent family

next_smallest_test: >-
  Classify source-natural counterterms for the critical finite-cutoff B2 form
  under finite-poset isomorphisms and compatible cutoff embeddings. Determine
  whether any functorial subtraction retains a mixed invariant that vanishes
  on mutated, composite-only, and seeded-DAG controls. Stop if every allowed
  term reduces to atom inventory or generic Gram data.

round2_clues:
  - the off-diagonal eta-greater-than-one Gram tail is already summable
  - functoriality must be frozen before inspecting counterterm outcomes
  - ordinary, modified, and renormalized traces must remain distinct
  - positive metric completions are exhausted and should not be repeated
  - indefinite or unbounded metrics require a source-derived necessity
  - no numerical label may act as a disguised primality oracle

route_b_invocation_allowed: false
