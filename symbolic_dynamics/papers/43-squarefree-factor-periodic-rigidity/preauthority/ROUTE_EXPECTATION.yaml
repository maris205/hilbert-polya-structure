a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: PROVED
  strongest_evidence: >-
    Every lawful factor has zeta_AM_Y(z)=1/(1-z) and inverse determinant
    1-z exactly; the rank-one periodic-core matrix K_per=[1] has the same
    ordinary determinant and traces.
  strongest_failure: >-
    The determinant records only one fixed orbit and has no nontrivial
    arithmetic divisor. K_per packages the ledger after the theorem and is
    not a full-state transfer operator.
  metrics:
    zero_error_train: not_applicable
    zero_error_validation: not_applicable
    zero_error_test: not_applicable
    extra_zero_count: not_applicable
    missing_zero_count: not_applicable
    root_count_discrepancy: not_applicable
    cutoff_drift: not_applicable_exact_theorem
    precision_drift: zero_exact_arithmetic
    control_margin: every_finite_prime_set_has_an_exact_nonzero_periodic_witness
  artifacts:
    - OBJECT_MARKER_OPERATOR_CONTRACT.md
    - DERIVATION_PACKAGE.md
    - PROOF_PACKAGE.md

a3:
  verdict: A3_FAIL
  evidence_status: PROVED
  strongest_evidence: >-
    The inverse determinant 1-z is an exact entire polynomial, and the zeta is
    a rational function with a completely known divisor.
  strongest_failure: >-
    The divisor is trivial: there is no rational-prime Euler support,
    completed functional equation, gamma factor, T log T growth, explicit
    formula, or natural same-ledger Weil compression.
  analytic_structure:
    determinant: one_minus_z
    rational_continuation: true
    completed_factor: false
    rational_prime_support: false
    gamma_factor: false
    divisor_growth: constant
  weil_compression:
    status: not_naturally_available_from_singleton_periodic_ledger
    evidence_status: STOP_SCOPED
  artifacts:
    - DERIVATION_PACKAGE.md
    - PROOF_PACKAGE.md
    - LITERATURE_NOVELTY_AUDIT.md

a4:
