a1:
  verdict: A1_FAIL
  evidence_status: PROVED
  strongest_evidence: >-
    CRT proves source proximality, uniform continuity sends proximality through
    every lawful factor, and finite-orbit separation proves that every factor
    has exactly one primitive fixed orbit.
  strongest_failure: >-
    A singleton primitive ledger cannot be the infinite rational-prime ledger.
    The powers z^r are repetitions of the same fixed orbit, not new primitive
    atoms.
  metrics:
    fixed_points_every_period: 1
    primitive_orbits: one_period_one_factor_orbit
    factor_class: all_continuous_onto_equivariant_compact_metrizable_Z_factors
    finite_to_one_required: false
    target_expansive_required: false
    rational_prime_primitive_support: false
    repetition_failures: 0
  artifacts:
