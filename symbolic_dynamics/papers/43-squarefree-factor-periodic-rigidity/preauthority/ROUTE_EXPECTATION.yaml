    Retain the exact SD-C02 two-sided squarefree admissible shift, unit clock,
    periodic-orbit type, Artin-Mazur marker, and determinant convention; test
    whether any continuous surjective equivariant compact metrizable
    Z-factor can create a nontrivial periodic primitive ledger.
  object: >-
    X_sf is the set of binary two-sided sequences whose support omits at least
    one residue modulo p^2 for every rational prime p.
  family: symbolic_dynamics
  phase_space: X_sf_subset_0_1_power_Z
  dynamics: two_sided_left_shift
  parameters: all_rational_prime_square_exclusions_exact
  parameter_provenance: >-
    Frozen Session-4 C02 grammar. Rational prime squares are explicit inputs;
    no prime or zero data are fitted. Missing residues used in the proof are
    witnesses selected after points and windows, not model parameters.
  arithmetic_origin: direct_rational_prime_square_exclusions
  clock: unit_discrete_time
  normalization: >-
    z marks one application of the frozen factor dynamics. An external
    rational-prime comparison, if shown, uses independent marker u.
  determinant_convention: >-
    zeta_AM_Y(z)=exp(sum_m_ge_1 Fix(S^m) z^m/m) and
    D_AM_Y(z)=zeta_AM_Y(z)^(-1).
  regularization_order: not_applicable_ordinary_artin_mazur_and_rank_one_determinant
  main_theorem_marker: z_counts_one_original_unit_time_step
  function_space: >-
