claim_boundary: >-
  SD-C32 proves that every invariant natural in the frozen decorated
  multiplicative source data—local or nonlocal and of arbitrary finite
  arity—is indistinguishable between integer divisibility and its transported
  formal free-commutative/UFD clone. It does not rule out a new source object
  carrying independently derived addition, congruence, Archimedean order, or
  another nontransportable operation; identify the auxiliary Gram determinant
  with the chiral transfer determinant; numerically prove the infinite theorem;
  compare target zeros; produce a fixed Hilbert-Polya operator; or imply RH.

blocking_conditions:
  - pair-generated intervals can be blind to defects elsewhere in the source
  - free unique factorization makes every distinct atom subset Boolean coherent
  - transported decorations make the integer and formal UFD sources isomorphic
  - auxiliary determinant legitimacy does not supply arithmetic selectivity
  - no fixed self-adjoint carrier, Weil compression, or target-zero ownership exists
  - Route B remains outside the authorized source object and invocation gate

next_smallest_test: >-
  Specify one canonically source-derived nonmultiplicative operation absent
  from the transported free/UFD clone, most plausibly an additive or
  Archimedean-multiplicative coupling. Prove exact clone separation before
  rebuilding summability, holomorphy, marker ownership, and determinant claims.

round2_clues:
  - addition and multiplication interaction is not visible in the frozen divisibility monoid
  - congruence correspondences require a source-derived normalization and control category
  - Archimedean order must not be a disguised printed numeric-prime oracle
  - changing Mobius coefficients, cumulants, arity, or cutoff cannot break an isomorphism
  - every new source enrichment must rerun finite and expanded arithmetic-semigroup controls
  - the auxiliary Gram determinant remains distinct from the inherited chiral det3

