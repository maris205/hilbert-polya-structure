source_lock:
  candidate_definition: >-
    Derive atoms only as bottom covers and filter atom pairs and triples by the
    preregistered conjunction of unique join, Boolean generated interval,
    expected Mobius value, multiplicative roof, and associative tensor/lcm
    coherence. Weight qualified pairs and connected triples with transported
    Gram data, and require exact separation from finite controls and every
    free-commutative/UFD control.
  object: >-
    Decorated pointed divisibility sources with bottom, atoms, defined finite
    joins, incidence intervals and Mobius values, compatible cutoff
    filtration, roof marks, Gram data, digit markers, and the Paper28-29
    inherited chiral determinant ownership firewall.
  family: symbolic_dynamics
  phase_space: >-
    Integer divisibility and finite pointed-poset source compilers, together
    with formal free-commutative exponent-vector and polynomial-UFD controls.
    Mutated-cover, composite-only, seeded generic-DAG, and seeded random-
    inventory objects are finite adversarial controls only.
  dynamics: >-
    Source-global higher-incidence coherence is evaluated on distinct bottom-
    cover atoms. Pair and connected-triple weights use the transported
    analytic Gram kernel; gamma-code digit markers are recorded separately
    from the theorem value u=1.
  parameters: >-
    eta=2; integer active cutoffs 12,18,30; generic DAG seed 29031; random
    inventory seed 29032; subset arities 2 and 3; predicate masks 1 through
    31; free-commutative ranks 2 through 6; exponent caps 1 through 3; theorem
    marker u=1; inherited regularization order 3.
  parameter_provenance: >-
    Candidate predicates, conjunction, weights, cutoffs, seeds, controls,
    masks, analytic ownership, route tuple, and stop rules were frozen in the
    prototype preregistration and authority experiment plan before authority
    canonical outputs. The independent evaluator imports neither candidate
    core nor result generator.
  arithmetic_origin: >-
    Integer divisibility is the baseline source relation and its atoms are
    derived as covers of one. Numeric roof marks are uniformly transported
    decorations and never select atoms. No supplied prime projector table,
    primality/factorization call, target Euler coefficient, or target-zero
    datum is available to the candidate.
  clock: >-
    z is the auxiliary determinant variable and u counts gamma-code digit
    steps. All theorem statements are at u=1. Pair and connected-triple
    exponentials are separately declared new functionals unless they occur as
    coefficients of the auxiliary trace-class Gram determinant.
  normalization: >-
    eta=2; filtered pair entries are native Gram contractions divided by the
    square root of the product roof. Exact rational critical-line weights and
    closed tail bounds replace sampled phases. Boolean selectors have frozen
    zero-one normalization.
  determinant_convention: >-
    The absolutely summable filtered Gram matrix H is trace class, so
    det(I+zH) is an honest auxiliary ordinary Fredholm determinant entire in
    z. It is phase-free and clone-copied. It is not the inherited chiral det3.
    Exponentiating the isolated pair or connected-triple functional does not
    create ordinary, det2, or det3 ownership.
  regularization_order: 3
  main_theorem_u: 1
  orbit_cutoff: >-
    Integer active atom sets at cutoffs 12, 18, and 30; every distinct pair
    and triple; all pair/triple subsets in four finite controls; all 31
    predicate masks; and 45 free/UFD rank-cap-alias inventories.
  cutoff: >-
    Compatible integer cutoffs transport exactly to exponent-vector cutoffs.
    Finite source recompilations are standalone adversarial controls and are
    not identified with ambient integer compressions.
  precision: >-
    Exact integers, fractions.Fraction rationals, exact incidence matrices,
    canonical exponent vectors, JSON/CSV ledgers, and SHA-256. No floating
    statistic or sampled phase decides a gate.
