a2:
  verdict: A2_FAIL
  evidence_status: REFUTED
  strongest_evidence: >-
    The formal pqr residual survives scalar augmentation, and all higher Adams
    powers are excluded from squarefree multidegree. Thus the completed
    equivariant ledger contains information invisible in the scalar shadow.
  strongest_failure: >-
    No one fixed arithmetic operator has both nontrivial character sectors and
    the pure Euler determinant. Distinct weights have no commuting relabeling
    symmetry; equal weights make nontrivial rank-one sectors determinant one;
    the canonical diagonal lift changes b(x)^r to b(x^r) and introduces mixed
    subset factors.
