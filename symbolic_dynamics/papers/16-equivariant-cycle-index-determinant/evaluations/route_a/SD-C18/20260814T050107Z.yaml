claim_boundary: >-
  SD-C18 proves that scalar squarefree cancellation hides nonzero
  representation/Burnside modes and proves that the frozen canonical
  rank-one/diagonal lifts cannot turn those modes into arithmetic
  character-resolved Fredholm fibers while retaining the pure Euler
  determinant. It does not prove a universal no-go for all symbolic group
  extensions, arithmetic selectivity, a target divisor theorem, RH, or a
  Hilbert-Polya operator.
blocking_conditions:
  - distinct arithmetic weights leave only the identity relabeling stabilizer
  - equal weights confine the rank-one image to the trivial representation
  - rank-one ghosts b(x)^r and diagonal ghosts b(x^r) disagree
  - the diagonal analytic lift introduces mixed-subset factors
  - inventory controls reproduce every finite mechanism
  - no completed analytic structure or intrinsic Weil compression exists
  - no natural operator lift exists
next_smallest_test: >-
  Still within Symbolic Dynamics, replace base-label relabeling by a genuine
  finite-group fiber cocycle commuting with a frozen symbolic transfer, and
  publish its full character power traces before any determinant claim.
