source_lock:
  candidate_definition: >-
    For each finite tensor-atom set P, SD-C18 is the one-vertex full edge shift
    on all nonempty subsets S of P, equipped with ordinary scalar edge sign
    (-1)^(|S|+1), multivariable monomial x_S, and its signed primitive-cycle
    Burnside/representation/cycle-index ledger under atom relabeling.
  object: >-
    The projective family of finite signed subset shifts, squarefree primitive
    necklaces modulo cyclic rotation, C2-colored temporal power operations,
    the rank-one scalar shadow A_x, and the canonical comparison diagonal
    subset operator D_x. These ledgers are kept distinct.
  family: symbolic_dynamics
  phase_space: >-
    One vertex with one loop edge for every nonempty subset of a frozen finite
    tensor-atom inventory; temporal words form a finite full edge shift.
  dynamics: >-
    Left shift on subset-edge words. Primitive periodic objects are cyclic
    necklaces, reflection is not quotiented, and temporal repetition uses the
    actual scalar power of every signed word.
  parameters: >-
    Squarefree atom ranks n=2..7; ghost, rank-one, stabilizer, diagonal, and
    projective audits n=2..8; temporal powers r=1..8; analytic cutoffs
    N=10,25,50,100,250; sigma=0.6,1.0,1.2,2.0; q=1,2,3,4; control seeds
    16000..16015.
  parameter_provenance: >-
    The subset alphabet, scalar sign, group actions, canonical lifts, cutoffs,
    and controls were frozen before execution. No target zero or fitted
    parameter is used.
  arithmetic_origin: >-
    Nonunit tensor-indecomposable finite full shifts are F_p and entropy
    h(F_p)=log p supplies the specialization x_p=exp(-s h(F_p)). The formal
    multivariable object and all algebraic identities precede specialization.
  clock: >-
    T(S)=sum_(p in S) h(F_p) on an edge and the additive temporal roof on
    words; no fitted scale or offset.
  normalization: >-
    epsilon(S)=(-1)^(|S|+1); scalar temporal powers use epsilon(S)^r. A
    nontrivial C2 character line, not a negative integer Adams coefficient,
    carries this sign through power operations.
  determinant_convention: >-
    The inherited rank-one shadow has det(I-A_x)=product_p(1-x_p). The
    representation-preserving comparison has
    sdet(I-D_x)=product_(S nonempty)(1-x_S)^epsilon(S). SD-C18 evaluates
    whether a character-resolved determinant can retain the first identity;
    it may not import the scalar shadow's A2 coordinate.
  orbit_cutoff: >-
    Exhaustive squarefree primitive cyclic words through n=7, exact S_n
    conjugacy-class fixed counts, cyclic-subgroup marks, and orbit
    decompositions; power audits through r=8.
  cutoff: >-
    Exact finite algebra through n=8, 4,008 C2 edge/power checks, 56 ghost
    rows, 455 inventory controls, and 160 descriptive Schatten cutoff rows.
  precision: >-
    Integer and Fraction arithmetic for theorem certificates; binary64 only
    for descriptive finite-cutoff Schatten sums, whose class labels come from
    the proved q*Re(s)>1 criterion.
  training_data: none
  allowed_data:
    - tensor multiplication, tensor indecomposability, and entropy of finite full shifts
    - formal subset monomials, scalar signs, cyclic words, and temporal powers
    - finite permutation actions, Burnside marks, characters, and cycle ledgers
    - standard rank-one, diagonal, Schatten, and Fredholm calculations
    - prime, composite, shuffled, random-rational, and formal inventories as controls
  forbidden_data:
    - Riemann-zero tables, target spectra, root fitting, or fitted phases
    - treating semilinear relabeling covariance as fixed-fiber symmetry
    - identifying b(x)^r with b(x^r)
    - replacing scalar sign powers by integer Adams signs
    - calling a completed cycle index an analytic fixed-operator determinant
    - importing the rank-one scalar shadow's A2 result into the resolved tuple
    - cross-family geometric or operator repairs
  code_commit: SOURCE_COMMIT_PLACEHOLDER
  artifact_paths:
