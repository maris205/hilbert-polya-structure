a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    Primitive necklaces, orientation convention, scalar signs, multiplicity,
    finite group actions, and temporal powers are intrinsic and exhaustively
    enumerated through n=7. The pqr residual is nonzero in both Burnside and
    representation rings despite zero scalar dimension.
  strongest_failure: >-
    These primitive objects are cyclic ordered factorizations rather than one
    distinguished orbit per tensor atom, and distinct arithmetic
    specialization destroys the relabeling symmetry needed for character
    fibers. No prime/prime-power orbit correspondence results.
