claim_boundary: >-
  SD-C17 proves an exact scalar squarefree-subset determinant and exact
  primitive/power/equivariant obstructions to promoting its cancellation to
  a natural primitive-cycle pairing. It does not prove arithmetic
  selectivity, an orbitwise prime correspondence, a completed-zeta divisor,
  RH, or a Hilbert-Polya operator.
blocking_conditions:
  - cancellation at p^2q^2 crosses primitive and repetition layers
  - the pqr virtual S3 character is nonzero
  - scalar signs and chain parity disagree at even powers
  - arbitrary rational inventories reproduce the determinant identity
  - no global analytic completion or intrinsic Weil compression exists
  - no natural operator lift exists
