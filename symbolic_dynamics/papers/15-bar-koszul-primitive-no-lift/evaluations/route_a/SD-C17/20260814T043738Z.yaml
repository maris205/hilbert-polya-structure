source_lock:
  candidate_definition: >-
    For each finite set P of tensor-indecomposable full shifts, SD-C17 is the
    one-vertex full edge shift on all nonempty squarefree subsets S of P, with
    ordinary scalar edge weight (-1)^(|S|+1)x_S.
  object: >-
    The directed family of finite squarefree-subset shifts, their primitive
    necklaces modulo cyclic rotation, and the scalar Fredholm determinants
    D_P(x,z)=1-z sum_(S nonempty)(-1)^(|S|+1)x_S.
  family: symbolic_dynamics
  phase_space: >-
    One vertex with one loop edge for every nonempty subset of a frozen finite
    tensor-atom inventory; temporal words form the full edge shift.
  dynamics: >-
    Left shift on subset-edge words. Primitive periodic objects are cyclic
    necklaces, and repetitions use the actual scalar power of the necklace
    weight with trace-log factor 1/r.
  parameters: >-
    Explicit degrees pq, p^2q^2, pqr; cyclic enumeration k=2..7; Stirling
    cutoff k=12; repetition cutoff r=8; rational controls k=2..8 and seeds
    15100..15115.
  parameter_provenance: >-
    The subset alphabet and Koszul scalar sign are fixed by the normalized
    bar/Koszul source before orbit enumeration; every cutoff and seed is
    preregistered and no parameter is selected from target data.
  arithmetic_origin: >-
    Nonunit tensor-indecomposable finite full shifts are the tensor atoms F_p,
    and topological entropy h(F_p)=log p gives the additive specialization
    x_p=exp(-s h(F_p)). The formal-variable determinant precedes and controls
    this specialization.
  clock: >-
    T(S)=sum_(p in S)h(F_p) on an edge and additive temporal roof on words;
    no fitted scale or offset.
  normalization: >-
    epsilon(S)=(-1)^(|S|+1), z is the temporal counting parameter, z=1 is the
    canonical Koszul specialization, and scalar signs power as epsilon^r.
  determinant_convention: >-
    D_P(x,z)=det_C(I-z L_P)=1-z F_P(x), where L_P is scalar multiplication by
    F_P. At z=1, D_P(x,1)=product_(p in P)(1-x_p). The evaluated object is the
    determinant, not its inverse or a fitted logarithmic branch.
  orbit_cutoff: >-
    Exact pq and p^2q^2 necklace census, exact pqr S3 action, cyclic partitions
    through k=7, and scalar/supertrace repetitions through r=8.
  cutoff: >-
    Formal Stirling certificate through k=12 and 112 exact rational controls
    from seven atom cutoffs and sixteen seeds.
  precision: exact_integer_and_Fraction_arithmetic
  training_data: none
  allowed_data:
    - tensor multiplication and tensor indecomposability of finite full shifts
    - topological entropy as the symbolic roof
    - formal subset monomials and scalar Koszul signs
    - cyclic words, least periods, finite permutation actions, and characters
    - exact rational generic-inventory controls
  forbidden_data:
    - Riemann-zero tables or target spectra
    - target-root searches, fitting, or best-cutoff selection
    - inserted Mobius or von-Mangoldt transfer weights
    - post-hoc lexicographic pairing presented as natural
    - replacing ordinary scalar signs by chain parity
    - discarding repetitions or changing their scalar powers
    - cross-family geometric or operator repairs
  code_commit: 668d425a864d06ac819896c7c3871fca18bbf397
