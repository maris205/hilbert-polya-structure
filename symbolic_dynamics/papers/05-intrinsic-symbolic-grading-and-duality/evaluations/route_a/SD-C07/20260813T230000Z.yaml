  family: "symbolic dynamics"
  phase_space: "Base phase space Y_tensor={a_0 a_1 ... : a_(j+1)=a_j and a_j is a tensor atom of the finite-full-shift skeleton}; auxiliary graded spaces are the reduced tensor-divisor chain modules, the exterior module Lambda(V), the honest resolution A tensor Lambda(V), the stable/unstable copies, and the tensor group completion, each kept as a separately named construction."
  dynamics: "Left shift on Y_tensor with identity adjacency and entropy suspension; diagonal atom transfer L_s e_p=p^(-s)e_p. Chain differentials, reversal, and group inversion are the source-locked auxiliary maps stated in SOURCE_LOCK.md and PROOF_PACKAGE.md."
