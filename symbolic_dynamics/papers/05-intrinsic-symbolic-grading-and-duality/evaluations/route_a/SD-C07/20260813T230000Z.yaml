  evidence_status: PROVED
  strongest_evidence: "The Euler-half-plane determinant identities and intrinsic Mobius grading are exact. Moreover, three source-locked obstruction theorems isolate why they do not become a functional equation: symbolic reversal preserves s, tensor-group inversion sends s to -s and is parity-even, and the ordinary s/1-s sectors have no common trace-class domain."
  strongest_failure: "No intrinsic half-density supplies the center 1/2, no Gamma or trivial-zero sector appears, and no same-object Weil/Lefschetz compression is derived. Even after adversarially granting an external s/1-s pairing, the first common Schatten regularization is det_3 on 1/3<Re(s)<2/3; it is zero-free there and deletes the r=1 and r=2 prime traces."
  analytic_structure:
    euler_half_plane_identity: "proved for Re(s)>1"
    conjugation_symmetry_in_domain: true
    intrinsic_grading: "canonical after choosing the Koszul functor; atom generators are degree one"
    stable_unstable_reversal: "natural two-sided symbolic reversal gives L_s direct-sum L_s, not L_s direct-sum L_(1-s)"
    tensor_group_inversion: "q maps to q^(-1), hence s maps to -s; every monoidal Z/2 parity is inversion-even"
    centered_half_density: "absent from the frozen symbolic source"
    ordinary_dual_trace_class_overlap: false
    adversarial_det3_domain: "1/3<Re(s)<2/3 after externally granting an s/1-s pairing"
    adversarial_det3_divisor: "zero-free in its defining strip"
    adversarial_det3_trace_loss: "log determinant starts at repetition r=3 and omits the prime and prime-square traces r=1,2"
    gamma_factor: false
    trivial_zero_mechanism: false
    functional_equation_from_dynamics: false
    controlled_completed_continuation: false
  weil_compression:
    status: "No finite Hermitian or Lefschetz compression is derived from the same SD-C07 graded transfer object."
    evidence_status: OPEN
