  arithmetic_origin: "In the symmetric monoidal skeleton of finite full shifts, [F_m] tensor [F_n]=[F_mn]; its nonunit tensor atoms are exactly [F_p], and tensor powers represent p^r."
  clock: "tau([F_n])=h_top(F_n)=log n, with no rescaling, offset, centered twist, or hand-assigned log-prime roof."
  normalization: "Euler parameter s and the ordinary full-shift entropy norm. A half-density shift by 1/2 is not part of the frozen object."
  determinant_convention: "On the atom transfer module V, L_s e_p=p^(-s)e_p. det(I-L_s)=1/zeta(s), while V in canonical Koszul degree one is purely odd and Ber(I-L_s)=zeta(s), initially only for Re(s)>1. Exterior-Fock supertrace and full-Koszul superdeterminant are recorded separately."
  cutoff: "Exact tensor-divisor complexes for every 2<=n<=512; atom and dual-ratio diagnostics at the frozen finite cutoffs stated in EXPERIMENT_REPORT.md; analytic propositions are infinite-cutoff statements."
  precision: "Exact integer/GF(2) chain and coefficient ledgers; binary64 only for finite dual-ratio and Schatten partial-norm diagnostics."
