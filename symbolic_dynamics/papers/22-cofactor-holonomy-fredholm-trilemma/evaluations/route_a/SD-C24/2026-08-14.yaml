a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: PROVED
  strongest_evidence: >-
    L_(s,u) is trace class exactly when Re(s)>1/2 and Re(s+u)>1/2.
    Scalar unitary characters therefore have honest Fredholm determinants on
    Re(s)>1/2, and exact finite determinants agree with Newton trace
    coefficients in all four audit cases.
  strongest_failure: >-
    At s=0 the pure cofactor operator is never trace class and is noncompact
    whenever bounded. Endpoint regularization causes factorial damping, while
    unitary phases cannot delete any member of the Q=2 spine. The neutral
    group-trace determinant is exactly one.
