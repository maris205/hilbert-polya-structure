a1:
  verdict: A1_WEAK
  evidence_status: PROVED_OBSTRUCTION
  strongest_evidence: >-
    The exact ledger separates rooted rotations, primitive temporal roots,
    repetitions, and multiplicative holonomy. It proves Q=2 iff C_k and, for
    each post-freeze atom p, Q=p iff C_(k,p); prime holonomy cannot be a
    repetition.
  strongest_failure: >-
    Every atom p has infinitely many primitive representatives C_(k,p), and
    Q=2 contains all lengths k>=2. Thus the ledger fails the required
    one-prime/one-primitive-orbit selectivity.
