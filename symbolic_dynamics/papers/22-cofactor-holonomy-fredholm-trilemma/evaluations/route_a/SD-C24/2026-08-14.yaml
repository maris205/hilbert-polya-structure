claim_boundary: >-
  SD-C24 proves positive integer cycle holonomy, exact Q=2 and prime-holonomy
  classifications, the sharp two-parameter trace-class region, scalar
  character Fredholm determinants, and a neutral semifinite determinant one.
  It also proves the cofactor/Fredholm trilemma: pure cofactor weights are not
  trace class, endpoint damping destroys the desired scale, and scalar
  unitary phases have no selection power. It does not match the prime Euler
  ledger, construct a completed zeta function, compare target zeros, prove RH,
  or construct a Hilbert-Polya operator.
blocking_conditions:
  - Q=2 contains one primitive canonical cycle at every length k>=2
  - every atom p has infinitely many primitive representatives C_(k,p)
  - scalar characters are constant on each product-holonomy class
  - the pure cofactor operator is never trace class and is conditionally noncompact whenever bounded
  - endpoint regularization gives factorial rather than prime Euler scaling
  - the neutral regular group-trace determinant is identically one
  - arbitrary positive inventories preserve the complete support flood
  - no target completion or self-adjoint spectral carrier is constructed
next_smallest_test: >-
  Still within Symbolic Dynamics, test the minimal finite-memory or
  noncommutative ordered-cofactor extension that can distinguish two cycles
  with the same product holonomy, while retaining an honest Fredholm domain
  and forbidding any prime-length mask.
round2_clues:
