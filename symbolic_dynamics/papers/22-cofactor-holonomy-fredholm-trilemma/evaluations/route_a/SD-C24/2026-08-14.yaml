source_lock:
  candidate_definition: >-
    On the finite-full-shift semiring skeleton, create n->d exactly when d>=2
    divides n+1 and expose the cofactor q=(n+1)/d. Attach the multiplicative
    cocycle q to the successor-divisor edge without an atom selector, prime
    table, accepted-support mask, or target-zero feedback.
  object: >-
    The one-sided countable Markov shift on V={2,3,...}, its two-parameter
    column-source transfer operator L_(s,u)e_n=sum_(d|n+1,d>=2)
    (nd)^(-s)q(n,d)^(-u)e_d, scalar unitary character fibers, and the regular
    group lift over the group completion of the positive integer monoid.
  family: symbolic_dynamics
  phase_space: >-
    X_G^+, the one-sided countable Markov edge shift of the frozen
    successor-divisor graph.
  dynamics: >-
    Every n has successor edge n->n+1 with q=1; every divisor d>=2 of n+1
    supplies n->d with exact quotient q=(n+1)/d.
  parameters: >-
    Source audit through 4096; simple-cycle audits at N=12,20,30; rooted closed
    cycles through r=8 at theorem-certified cutoff 2r-1; exact group traces
    through r=10 for s=1,2; post-freeze test atoms 2,3,5,7; seven diagnostic
    cutoffs through 2048; eight two-parameter S1 points; six positive
    inventories; four finite determinant checks.
  parameter_provenance: >-
    The graph, cocycle, endpoint roof, Hilbert space, operator orientation,
    determinant convention, cutoffs, test atoms, controls, and Route tuple
    were frozen before artifact generation. Test atoms occur only in
    post-freeze evaluation and never affect adjacency or weights.
  arithmetic_origin: >-
    Alphabet successor, tensor multiplication, equality, entropy, and the
    exposed cofactor identity n+1=dq come from finite full shifts. The cocycle
    is source-intrinsic but resolves all positive integer holonomies rather
    than selecting rational-prime cycles.
  clock: >-
    Endpoint roof tau(n,d)=log n+log d and cofactor roof log q produce weight
    (nd)^(-s)q^(-u). On a closed word gamma, product q=product(1+1/n) is an
    integer Q(gamma)>1 while the endpoint mass is product n.
  normalization: >-
    L_(s,u) uses the column-source convention. Primitive cycles are directed
    rotation classes, reflections are not identified, rooted rotations and
    temporal repetitions are recorded separately, and z counts graph edges.
  determinant_convention: >-
    Scalar character fibers have ordinary Hilbert-space Fredholm determinants
    exactly on Re(s)>1/2. The regular group lift uses the canonical semifinite
    group trace on the same base half-plane; its neutral local determinant is
    identically one. Neither determinant is identified with the Riemann Euler
    determinant.
  orbit_cutoff: >-
    Closed words of period r are confined to vertices at most 2r-1. The exact
    rooted ledger uses this cutoff through r=8; simple cycles are independently
    enumerated by sparse DFS at N=12,20,30.
  cutoff: >-
    30 for simple-cycle classification, 8 rooted powers, 10 group-trace
    powers, 4096 source vertices, 2048 for S1 diagnostic prefixes, and 32 or
    64 for induced-return, phase, inventory, and factorial-damping controls.
  precision: >-
    Exact integers and Fractions for graph, holonomy, trace, gauge, and finite
    determinant ledgers; deterministic double precision only for unitary
    phase, Fourier inversion, and asymptotic diagnostic prefixes; analytic
    proofs, not finite trends, establish infinite-dimensional claims.
  training_data: none
  allowed_data:
    - finite-full-shift successor, tensor multiplication, equality, and entropy
    - exact divisibility and exposed integer quotient certificates
    - sparse DFS and sparse group-algebra dynamic programming
    - directed rotations, temporal primitive roots, and exact rational weights
    - post-freeze atom fixtures 2,3,5,7 used only to audit theorem consequences
    - positive inventory and transported-presentation controls
    - deterministic SHA-256 source/result auditing
  forbidden_data:
    - prime tables, primality tests, atom selectors, or accepted-support masks in the graph constructor
    - Riemann zeros, target-root scoring, target-derived parameters, or von Mangoldt feedback
    - reflection quotienting or deletion of unwanted primitive cycles
    - treating finite S1 prefixes as proofs of infinite convergence
    - claiming nonunitary infinite-dimensional gauge similarity without bounded inverses
    - identifying the neutral determinant one with an arithmetic Euler determinant
    - Gamma factors, completed zeta functions, RH claims, or Route-B operators
    - cross-family geometric, Hamiltonian, quantum, or scattering repairs
  code_commit: d3296aca44061d79168b435a4aa7b97135d7d675
