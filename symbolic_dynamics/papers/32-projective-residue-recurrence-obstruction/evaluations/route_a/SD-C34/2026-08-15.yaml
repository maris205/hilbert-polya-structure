source_lock:
  candidate_definition: >-
    Reconstruct every residue ring from finite-full-shift alphabet sum,
    product, successor, and congruence; form its projective line; retain both
    projective S and R transitions at every state; and connect canonical cusps
    bidirectionally between n and 2n or 3n without a terminal predicate.
  object: >-
    The primary object is the fixed uninduced graph-step operator on the
    direct sum of all projective residue lines, including both within-modulus
    permutations and all bidirectional rank-one cusp edges. Static selectors,
    downward reductions, and block projectors are comparison objects only.
  family: symbolic_dynamics
  phase_space: >-
    The countable disjoint union of P1(Z/nZ), n at least two, coupled at the
    source-natural cusp [1:0]. Matched finite-semiring presentations, generic
    C2*C3 actions, and the inherited bare polynomial-UFD presentation are
    mandatory controls.
  dynamics: >-
    Every projective state has S[a:b]=[-b:a] and R[a:b]=[-b:a+b]. Canonical
    cusps have edges in both directions between n and 2n or 3n. No edge,
    component, or recurrent support consults a field flag or accept/reject
    Boolean.
  parameters: >-
    cutoff=192; trace_orders=1..8; random_trials=48; random_seed=320000+trial;
    matched_seed=1000003+n; multipliers=2,3; diagnostic_sigmas=3,4;
    diagnostic_cutoffs=16,32,64,128,192; free_marker=z.
  parameter_provenance: >-
    Source operations, projective states, matrices, cusps, roofs, marker,
    cutoffs, seeds, controls, information boundary, route tuple, and stop
    rules were frozen before authority outputs. Arithmetic classification is
    performed only by a physically separate evaluator.
  arithmetic_origin: >-
    Alphabet sum and product reconstruct the nonnegative integers; source
    congruence reconstructs Z/nZ, units, unimodular pairs, projective classes,
    the fixed matrices, and cusps. Candidate code contains no primality,
    factorization, accepted-support, or target-zero oracle.
  clock: >-
    One free z and one frozen roof belong to each edge of the original graph.
    No induction or first return changes the marker or transfers ownership.
  normalization: >-
    Within-modulus edges have roof log n. Either direction between n and kn,
    k in {2,3}, has roof log(kn). These choices are frozen before labels and
    are identical under matched transports.
  determinant_convention: >-
    Ordinary Fredholm determinant det(I-zB_s) of the primary uninduced
    operator on Re(s)>2. The trace-class estimate includes both finite
    projective blocks and all bidirectional cusp edges. No formal orbit
    product, modified determinant, or comparison object substitutes for it.
  regularization_order: "not_applicable; ordinary_trace_class_fredholm_determinant"
  main_theorem_marker: "free z counts one original uninduced graph edge"
  orbit_cutoff: >-
    All n from 2 through 192, traces through order eight, all 191 matched
    finite-semiring transports, 48 seeded generic relation actions, all 31
    cutoff-visible cusp diamonds, and all 191 selector-firewall rows.
  cutoff: >-
    Finite rows certify implementation and adversarial controls only.
    Projective counts, universal relations, the infinite diamond family,
    selector equivalence, and trace-class holomorphy have direct proofs.
  precision: >-
    Exact integer projective arithmetic, deterministic SHA-256 table and graph
    certificates, fractions.Fraction analytic witnesses, UTF-8 JSON/CSV, and
    SHA-256 artifact ledgers. No sampled root or floating gate is used.
  training_data: none
  allowed_data:
    - finite-full-shift alphabet sum product successor and congruence
    - exact residue-ring units unimodular pairs and projective classes
    - fixed S and R matrices constants two and three and cusp [1:0]
    - frozen roofs free marker deterministic cutoffs and seeds
    - source-separated post-census arithmetic classification
    - complete matched operation-table and projective-graph reconstruction
    - generic C2*C3 actions cusp diamonds and exact rational majorants
  forbidden_data:
