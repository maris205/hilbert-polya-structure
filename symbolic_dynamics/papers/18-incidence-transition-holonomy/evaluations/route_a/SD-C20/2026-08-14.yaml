a0:
  verdict: A0_ANALYTIC_ARITHMETIC_ORIGIN
  evidence_status: PROVED
  strongest_evidence: >-
    Tensor indecomposability and entropy provide the atom set and log-prime
    clock before the cocycle; the trivial character block exactly retains
    product_p(1-x_p) for every transition rule.
  strongest_failure: >-
    The incidence cocycle is inventory-blind. Composite, shuffled, random,
    rational, and formal controls reproduce every positive and negative
    certificate with identity pass-rate margin zero.
  arithmetic_controls:
    - free-commutative formal variables
    - composite-only squarefree atoms
    - shuffled prime atoms
    - matched random integers
    - strictly increasing random rationals
    - identity, counting, and gauge-generated cocycle controls
  artifacts:
    - results/inventory_controls.csv
    - results/inventory_comparison_table.csv
    - results/analysis_summary.json
    - EXPERIMENT_REPORT.md

a1:
  verdict: A1_WEAK
  evidence_status: PROVED
  strongest_evidence: >-
    Primitive symbolic cycles, orientation, scalar sign, multidegree, ordered
    S3 holonomy, character, and repetition convention are intrinsic. The
    four-edge word is primitive and has nonidentity commutator holonomy.
  strongest_failure: >-
    Mixed subset cycles are genuine primitives, and no prime-to-primitive
    orbit or prime-power-to-repetition bijection is obtained. Incidence alone
    cannot exclude the same cycles for arbitrary atom inventories.
  metrics:
    primitive_definition: cyclic_rotation_classes_of_closed_subset_words
    reflection_quotiented: false
    frozen_witness_rows: 3
    four_cycle_length: 4
    four_cycle_unique_connected_traversals: 1
    four_cycle_character_gap: 3
    completeness_scope: exact_for_frozen_witnesses_and_exhaustive_two_atom_tables
  artifacts:
    - results/primitive_holonomy_ledger.csv
    - results/s3_exact_certificate.json
    - results/transition_controls.csv

