source_lock:
  candidate_definition: >-
    For every finite tensor-atom inventory P, take the full shift on nonempty
    subsets, recoded by its complete directed edge presentation. Use G=S3 and
    alpha(S,T)=r=(12) on strict refinement, t=(23) on strict coarsening, and
    the identity otherwise.
  object: >-
    The projective family of signed tensor-subset full shifts and their
    genuine finite-group skew extensions, with twisted arrival matrices
    B_rho(S,T)=epsilon(T)x_T rho(alpha(S,T)).
  family: symbolic_dynamics
  phase_space: >-
    X_P times S3, where X_P is the two-sided full shift on the nonempty
    subsets of P. Left deck translations commute with the right-cocycle skew
    shift and preserve scalar weights and roofs.
  dynamics: >-
    The same full shift is used in its two-block presentation; every ordered
    pair of subset symbols is allowed. The fiber updates by right
    multiplication with the one-step incidence cocycle.
  parameters: >-
    Incidence orbit classifier n=1..4; exhaustive two-atom tables S3^5,
    D4^5, and Q8^5; screening primes 1000003, 1000033, 1000037; total
    trace-log degree six; inventory-control seeds 18001..18005.
  parameter_provenance: >-
    The cocycle, determinant convention, group representations, degree
    bounds, modular primes, controls, and seeds were frozen before execution.
    No parameter was fitted and no target-zero datum was used.
  arithmetic_origin: >-
    Tensor indecomposability identifies F_p and entropy h(F_p)=log p supplies
    x_p=exp(-s h(F_p)) before the finite-group decoration. The transition
    rule itself sees only abstract subset incidence.
  clock: >-
    T(S)=sum_(p in S) log p, extended additively along symbolic words, with no
    fitted scale, offset, or prime-indexed phase.
  normalization: >-
    epsilon(S)=(-1)^(|S|+1); arrival weighting; right-cocycle skew convention;
    primitive words quotiented by rotation only; reflection is not an orbit
    equivalence.
  determinant_convention: >-
    D_rho=det(I-B_rho). Irreducible D_rho are isotypic Artin factors, while
    the regular determinant is the whole skew-extension determinant and uses
    multiplicity d_rho. Artin L notation would invert these determinants.
  orbit_cutoff: >-
    Exact two- and four-cycle frozen witness ledger; determinant-log and
    direct trace-power ledgers through total atom degree six.
  cutoff: >-
    45 incidence-type rows, 7776 S3 tables, 32768 D4 tables, 32768 Q8 tables,
    three primitive witnesses, four transition controls, 30 inventory rows,
    and two trace-class threshold rows.
  precision: >-
    Integer group tables, exact rational sparse polynomials, exact SymPy
    determinants, and finite-field rectangular grids with a three-prime CRT
    modulus exceeding the frozen integer coefficient bound. No floating
    equality or zero root calculation is used.
  training_data: none
  allowed_data:
    - tensor multiplication, tensor indecomposability, and entropy of finite full shifts
    - formal subset monomials and ordinary scalar arrival signs
    - finite groups, exact representations, character blocks, and regular decomposition
    - primitive symbolic cycles, repetitions, edge holonomy, and symbolic gauge equivalence
    - prime, shuffled, composite, random-integer, rational, and formal inventories as controls
  forbidden_data:
    - Riemann-zero tables, target spectra, zero fitting, or target-derived phases
    - prime-indexed group labels, adjacency rules, or cocycle tables
    - treating one-dimensional characters as a complete nonabelian audit
    - identifying an isolated edge-marker coefficient with an aggregated atom monomial
    - universalizing finite S3, D4, or Q8 evidence into a cohomology theorem
    - continuation, Gamma factors, functional equations, Weil forms, or Route-B operators
    - cross-family geometric, quantum, Hamiltonian, or scattering repairs
  code_commit: c4afa82a56285e1a673bcea7456299534f438fb3
