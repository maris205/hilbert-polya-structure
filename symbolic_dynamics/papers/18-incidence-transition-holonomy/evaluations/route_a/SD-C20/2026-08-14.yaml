claim_boundary: >-
  SD-C20 proves that transition incidence can produce genuine noncommutative
  same-object Artin blocks, exact faithful-character leakage, and an honest
  Re(s)>2 Fredholm domain. It does not prove that character determinants
  classify cocycles, that the finite rigidity counts generalize, that the
  mechanism distinguishes primes, that a completed target divisor exists,
  RH, or a Hilbert-Polya realization.
blocking_conditions:
  - the explicit faithful S3 block has exact mixed trace-log leakage
  - one-dimensional characters miss hundreds of nonabelian false survivors
  - arbitrary atom inventories reproduce the mechanism with zero pass-rate margin
  - the full-subset language has no intrinsic prime-specific transition restriction
  - the nontrivial trace-class theorem stops at Re(s)>2
  - no global analytic completion or natural Weil compression exists
  - no natural operator lift exists
next_smallest_test: >-
