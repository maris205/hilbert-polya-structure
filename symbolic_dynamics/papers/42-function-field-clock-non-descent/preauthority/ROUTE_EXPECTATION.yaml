source_lock:
  candidate_definition: >-
    Retain the exact SD-C01 full-q-shift object, function-field primitive
    ledger, degree clock, source-symbol marker, weighted adjacency, and
    determinant; test whether every source primitive factor can descend to a
    rational-prime Euler factor with exact clock, marker, repetition,
    multiplicity, and ownership.
  object: >-
    The two-sided full q-shift for q in {2,3,5}, represented by the one-vertex
    q-loop graph; primitive objects are oriented aperiodic cyclic necklaces.
  family: symbolic_dynamics
  phase_space: F_q^Z
  dynamics: left_shift
  parameters: q_in_2_3_5_exact_no_numeric_fit
  parameter_provenance: >-
    Historical Session-4 field sizes and exact source convention. The
    selector is retrospective over known cards and witnesses; no target data,
    tuning, P39 ranking, P40 authorization, or P41 authorization is used.
  arithmetic_origin: >-
    Primitive necklaces have the exact degree counts of monic irreducible
    polynomials over F_q and norm q^n; this is function-field arithmetic, not
    an endogenous rational-prime source.
  clock: T_q(gamma)=length(gamma)*log(q)
  normalization: >-
    Free source-symbol marker z and complex clock variable s are independent;
    one source step has monomial z*q^(-s).
  determinant_convention: >-
    D_q(s,z)=det(I-L_q,s,z)=1-z*q^(1-s). The rational-prime comparison is the
    separately owned D_P(s,z)=product_p(1-z*p^(-s)) on Re(s)>1.
  regularization_order: not_applicable_ordinary_determinants_only
  main_theorem_marker: z_counts_one_original_full_shift_symbol
  orbit_cutoff: not_applicable_exact_length_one_and_two_witnesses
  cutoff: not_applicable_exact_theorem
  precision: exact_integer_combinatorics_and_symbolic_algebra
  training_data: none
  allowed_data:
    - frozen Session-4 cards and SD-C01 source/proof files
    - exact words rotations powers and Mobius inversion
    - exact finite-field norms and rational-prime definitions
    - formal z coefficients and absolutely convergent Dirichlet series
    - primary literature and sealed predecessor audits
  forbidden_data:
    - Riemann-zero tables fitting or validation ordinates
    - prime tables in candidate definition
    - arbitrary prime relabeling credited as exact clock descent
    - marker specialization or first-return retyping credited as same marker
    - rational-prime diagonal operator credited as source-owned
    - P40 or P41 objects corrections or novelty transferred to SD-C44
    - prospective outcome-independent novelty or priority claims for selector
  code_commit: PENDING_FIRST_ARTIFACT_COMMIT
  artifact_paths:
    - SOURCE_LOCK.md
    - OBJECT_MARKER_OPERATOR_CONTRACT.md
    - DERIVATION_PACKAGE.md
    - PROOF_PACKAGE.md
    - THEOREM_FALSIFIERS.md
