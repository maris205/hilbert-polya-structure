source_lock:
  candidate_definition: Retain the exact SD-C01 full-q-shift object, function-field primitive ledger, degree clock, source-symbol marker, weighted adjacency, and determinant; test whether every source primitive factor can descend to a rational-prime Euler factor with exact clock, marker, repetition, multiplicity, and ownership.
  object: The two-sided full q-shift for q in {2,3,5}, represented by the one-vertex q-loop graph; primitive objects are oriented aperiodic cyclic necklaces.
  family: symbolic_dynamics
  phase_space: F_q^Z
  dynamics: left_shift
  parameters: q_in_2_3_5_exact_no_numeric_fit
  parameter_provenance: Historical Session-4 field sizes and exact source convention. The selector is retrospective over known cards and witnesses; no target data, tuning, P39 ranking, P40 authorization, or P41 authorization is used.
  arithmetic_origin: Primitive necklaces have the exact degree counts of monic irreducible polynomials over F_q and norm q^n; this is function-field arithmetic, not an endogenous rational-prime source.
  clock: T_q(gamma)=length(gamma)*log(q)
  normalization: Free source-symbol marker z and complex clock variable s are independent; one source step has monomial z*q^(-s).
  determinant_convention: D_q(s,z)=det(I-L_q,s,z)=1-z*q^(1-s). The rational-prime comparison is the separately owned D_P(s,z)=product_p(1-z*p^(-s)) on Re(s)>1.
