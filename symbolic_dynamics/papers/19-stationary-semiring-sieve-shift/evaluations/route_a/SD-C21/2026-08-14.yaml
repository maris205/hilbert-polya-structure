    cutoff_drift: zero_on_exact_support_trace_and_determinant_certificates
    precision_drift: zero_exact_integer_and_rational_arithmetic
    control_margin: not_applicable_compiler_reproduces_arbitrary_supports
    target_zero_data_used: false
    honest_domain: Re(s)>1
    dense_determinant_cutoff: 8
    finite_determinant_exact: true
    power_trace_exact: true
