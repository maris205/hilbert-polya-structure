source_lock:
  candidate_definition: >-
    Use the positive-integer semiring skeleton of finite full shifts:
    F_m boxtimes F_n=F_mn and alphabet-sum F_m boxplus F_n=F_m+n. For every
    n>=2, a deterministic countable graph advances a divisor d by successor,
    expands cofactor search through Q_(n,d,q), accepts when d^2>n, and sends a
    found equality dq=n to a one-way cemetery ray. Only reached accept states
    have self-loops.
  object: >-
    The one-sided countable Markov edge shift of the fully expanded semiring
    verifier and its arrival-weighted adjacency L_s on ell^2 of graph
    vertices. Input, divisor, quotient, accept, and cemetery states all belong
    to this single symbolic object.
  family: symbolic_dynamics
  phase_space: >-
    X_G^+, the one-sided edge shift on the union of the forward computation
    orbits seeded by I_n for n>=2, including accept loops and infinite
    one-way reject rays. A reject absorbing loop is forbidden.
  dynamics: >-
    I_n moves to divisor state d=2. If d^2>n, the graph enters A_n. Otherwise
    it enters Q_(n,d,2); Q advances q while dq<n, rejects when dq=n, and
    advances d after dq>n. Accept states loop and reject indices increase
    forever.
  parameters: >-
    Support cutoffs 32,64,128,256,512; SCC/trace cutoff 24; no-oracle Q-state
    cutoff 64; dense determinant cutoff 8; repetition orders 1..12; integer
    exponent s=2 for rational matrix certificates; trace-entry real parts
    1.1,1.25,1.5,2.0; seeds 19021,19022,19100..19131.
  parameter_provenance: >-
    State rules, edge roofs, cutoffs, controls, seeds, determinant convention,
    and Route tuple were frozen before the final exact suite. No parameter was
    fitted and no target-zero datum was available or used.
  arithmetic_origin: >-
    Alphabet successor, tensor multiplication, additive order, and entropy
    h(F_n)=log n are intrinsic to the finite-full-shift semiring skeleton.
    Quotient search is materialized locally rather than supplied by a prime or
    factor table. The construction is nevertheless a completed verifier
    compiler, not emergent recurrent arithmetic.
  clock: >-
    Accept loop A_n has roof log n. The input edge uses log(2n), T-to-accept
    uses log(nd), T-to-Q_(n,d,2) uses log(2nd), later quotient edges use
    log(ndq), and cemetery edge k uses log(n(k+1)). The
    transient roofs are source-defined summability modeling choices and earn
    no arithmetic credit because they occur on no closed walk.
  normalization: >-
    Arrival weighting e^(-s tau(e)); z counts graph steps in det(I-zL_s);
    primitive cycles are directed rotation classes; temporal repetition uses
    actual scalar powers. No reflection quotient, sign, phase, fitted scale,
    or offset is used.
  determinant_convention: >-
    D_SV(s,z)=det_ell2(V)(I-zL_s). For Re(s)>1, D_SV(s,z) equals
    product_p(1-z p^(-s)); the frozen arithmetic specialization is z=1.
    Known continuation of 1/zeta is not promoted to a continuation theorem
    for L_s.
  orbit_cutoff: >-
    Exact recurrent SCC census through n=24, source/Q-state audit through
    n=64, and all power traces r=1..12. The theorem supplies the untruncated
    ledger on Re(s)>1.
  cutoff: >-
    Five support prefixes, one n=24 expanded graph, one n=8 independent dense
    determinant, twenty trace-entry sums, five bounded-depth controls,
    thirty-two random supports, one polynomial-UFD control, and four total
    decider controls.
  precision: >-
    Integer transitions and SCCs, exact Fraction power traces and Bareiss
    determinants, deterministic seeded controls, and explicit analytic
    Dirichlet-series majorants. Float entry sums are regression displays only;
    no floating equality or zero computation supports a theorem.
  training_data: none
  allowed_data:
    - tensor multiplication, alphabet-sum successor, additive order, and entropy of finite full shifts
    - explicit Q-state quotient search using only multiplication, successor, and comparison
    - exact finite graph SCCs, power traces, Bareiss determinants, and SHA-256 checks
    - independent prime sieve in sealed validation only, never in graph construction
    - transported, entropy-shuffled, additive-only, bounded, shifted, random, polynomial-UFD, and total-decider controls
  forbidden_data:
    - prime tables, factor-existence helpers, target Riemann zeros, zero fitting, or target-derived parameters
    - a reject self-loop or any hidden recurrent control sector
    - treating transient summability roofs as arithmetic evidence
    - treating known meromorphic continuation of zeta as a Fredholm continuation theorem
    - Gamma factors, functional equations, Weil forms, critical-line claims, or Route-B operators
    - cross-family geometric, quantum, Hamiltonian, or scattering repairs
