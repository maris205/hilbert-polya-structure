a0:
  verdict: A0_STRUCTURAL_ARITHMETIC_RELATION
  evidence_status: PROVED
  strongest_evidence: >-
    A relabeling-invariant expanded program using only alphabet successor,
    tensor product, additive order, and entropy accepts exactly the rational
    primes at every theorem level. AST and graph certificates show that
    quotient states are real and no factor-existence helper is called.
  strongest_failure: >-
    The program finishes the arithmetic decision before recurrence. A generic
    total-decider wrapper compiles arbitrary decidable supports, and the
    factorial-monoid specialization compiles other Euler products.
  arithmetic_controls:
    - transported presentation of both semiring operations
    - entropy/object-label shuffle
    - additive-only parent grammar
    - bounded divisor depth
    - shifted target predicate
    - matched random accepted supports
    - polynomial UFD irreducibles
    - square, power-of-two, Fibonacci, and hash total deciders
  artifacts:
    - results/source_oracle_certificate.json
    - results/support_certificates.csv
    - results/control_comparison_table.csv
    - results/universal_decider_controls.csv

a1:
  verdict: A1_PASS_ANALYTIC
  evidence_status: PROVED
  strongest_evidence: >-
    The only primitive periodic classes are the accept self-loops gamma_p.
    Their r-fold temporal traversals have weight p^(-rs), multiplicity one,
    and exact rational power traces for every r in the analytic theorem.
  strongest_failure: >-
    The primitive ledger is exact only because all verifier computation is
    transient. Pruning leaves disjoint prime loops, so the orbit mechanism is
    selector-tautological rather than a recurrent generation theorem.
  metrics:
    primitive_definition: directed_rotation_classes_of_closed_graph_words
    reflection_quotiented: false
    support_cutoff_max: 512
    support_false_positives: 0
    support_false_negatives: 0
    finite_scc_cutoff: 24
    quotient_audit_cutoff: 64
    quotient_state_count_at_64: 1651
    recurrent_core_exact: true
    repetition_orders_checked: 12
    power_trace_mismatches: 0
    completeness_scope: analytic_theorem_on_Re_s_gt_1_plus_exact_finite_regressions
  artifacts:
    - results/run_summary.json
    - results/source_oracle_certificate.json
    - results/power_trace_ledger.csv

a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: PROVED
  strongest_evidence: >-
    The whole expanded weighted adjacency is an S1-valued holomorphic family
    on Re(s)>1. Its power traces are sum_p p^(-rs), and its Fredholm
    determinant is exactly product_p(1-zp^(-s)); at z=1 this is 1/zeta(s).
  strongest_failure: >-
    The determinant equals that of the diagonal recurrent block because every
    computation edge is off-diagonal and acyclic. The result supplies no
    continuation or divisor information beyond the Euler half-plane.
  metrics:
    zero_error_train: "not_applicable; no_target_zero_evaluation"
    zero_error_validation: "not_applicable; no_target_zero_evaluation"
    zero_error_test: "not_applicable; no_target_zero_evaluation"
