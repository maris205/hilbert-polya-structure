claim_boundary: >-
  SD-C31 proves exact finite-part nonuniqueness and a no-go for the frozen
  quadratic, additive, pair-local class linear in native Gram contractions.
  It does not prove a universal no-go for arbitrary nonlinear or nonlocal
  natural tower invariants, construct a zeta/Wodzicki/Dixmier/relative trace,
  supply an ordinary B2 trace or det2, produce a fixed Hilbert-Polya operator,
  compare target zeros, or imply RH.

blocking_conditions:
  - the diagonal divergent germ admits infinitely many summable natural finite shifts
  - every diagonal subtraction preserves generic mixed Gram motion
  - the shared local pair type forces the beta zero versus beta one contradiction
  - det3 deletes B2 and B4 remains generic on controls
  - D_ren has scheme-dependent zero-free entire normalization
  - Paper28 fixed-operator and positive-metric obstructions remain

next_smallest_test: >-
  Construct one globally source-derived higher incidence cumulant or
  cohomological invariant, prove a uniqueness theorem, and show exact vanishing
  on mutated-cover, composite-only, generic-DAG, and random-inventory controls
  while retaining a nonzero divisibility signal. Otherwise close the chiral-
  incidence counterterm branch.

round2_clues:
  - a global invariant needs explicit additivity continuity and source-derivation axioms
  - Ihara-Hashimoto-Bass nonbacktracking cancellation is the closest structural clue
  - sharp Mertens and Abel prime-zeta finite parts differ by a finite scheme constant
  - zeta heat Wodzicki Dixmier and relative traces need extra calculi not yet present
  - no numerical mark may act as a disguised primality oracle
  - indefinite or unbounded metrics require an independent source necessity

