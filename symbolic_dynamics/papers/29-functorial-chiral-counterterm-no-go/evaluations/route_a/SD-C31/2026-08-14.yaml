a0:
  verdict: A0_STRUCTURAL_ARITHMETIC_RELATION
  evidence_status: PROVED_SCOPED
  strongest_evidence: >-
    Exact incidence compilers derive baseline atoms from covers of one and
    transport under relabeling. The ambient divisibility Gram and diagonal
    harmonic germ are source-derived without a prime projector table.
  strongest_failure: >-
    The same compiler and pair-local Gram mechanism is valid on mutated,
    composite-only, generic-DAG, and random-inventory sources. A0 supplies
    structural origin but not arithmetic selectivity.
  arithmetic_controls:
    - integer divisibility baseline at three active cutoffs
    - isomorphic relabel copies
    - six-promoting cover mutation
    - composite-only divisibility inventory
    - deterministic generic DAG
    - deterministic random inventory with shared upper nodes
  artifacts:
    - results/incidence_checks.json
    - results/source_oracle_certificate.json
    - results/control_pair_ledger.csv

a1:
  verdict: A1_FAIL
  evidence_status: STOP_SCOPED
  strongest_evidence: >-
    The finite critical B2 ledger, its exact diagonal/mixed split, and every
    pair frequency are source-computable. Both minimal diagonal subtractions
    have exhaustion-independent finite limits.
  strongest_failure: >-
    Diagonal subtraction preserves every mixed frequency on every source, and
    a pair-local coefficient cannot preserve the baseline while cancelling a
    same-type control. The residual is not the pure monochromatic Euler orbit
    ledger.
  metrics:
    baseline_pair_rows: 76
    baseline_nonzero_mixed_rows: 76
    control_pair_rows: 47
    control_nonzero_mixed_rows: 18
    coefficient_rows: 49
    selective_solutions: 0
  artifacts:
