a2:
  verdict: A2_ANALYTIC_DETERMINANT
  evidence_status: INHERITED_PROVED_SCOPED
  strongest_evidence: >-
    The Paper28 S3 object supplies an honest det3 strip containing the critical
    line. The absolutely summable mixed quadratic series is holomorphic on
    that strip, and declared real finite-part schemes preserve reflection.
  strongest_failure: >-
    The critical object is not Hilbert-Schmidt, so ordinary determinant and
    det2 remain unavailable. det3 deletes the complete B2 ledger. Restoring a
    finite part defines a scheme-dependent new functional whose change is a
    nontrivial zero-free entire scalar.
  metrics:
    zero_error_train: "not_applicable; no_target_zero_evaluation"
