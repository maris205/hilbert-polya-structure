source_lock:
  candidate_definition: >-
    Freeze the Paper28 reflected chiral incidence object and classify
    source-natural counterterms for its finite active-cutoff quadratic ledger.
    Counterterms are quadratic, additive, local on at most two source atoms,
    and linear in native Gram contractions. Compare leading-harmonic and full-
    diagonal subtraction before testing arithmetic selectivity on controls.
  object: >-
    Finite pointed-poset incidence compilers, the ambient weighted
    divisibility Gram kernel, critical finite B2 ledgers, source-natural
    diagonal and pair counterterms, the inherited S3 modified determinant,
    and a separately declared scheme-dependent restored-quadratic functional.
  family: symbolic_dynamics
  phase_space: >-
    The same gamma-coded integer return grammar and source-incidence fiber as
    Papers27-28. Source covers select active atoms. Mutated-cover,
    composite-only, seeded generic-DAG, and seeded random-inventory sources are
    controls only.
  dynamics: >-
    Critical reflected chiral coupling with finite active atom sets. The
    quadratic ledger splits exactly into a diagonal prime-harmonic term and an
    absolutely summable mixed Gram Fourier ledger.
  parameters: >-
    eta=2; baseline cutoffs 12,18,30; generic DAG seed 29031; random inventory
    seed 29032; relabel seeds 29112,29118,29130,29331; coefficient grid
    -2,-1,-1/2,0,1/2,1,2; scheme shifts S0,S1,S2; regularization order 3;
    theorem marker u=1.
  parameter_provenance: >-
    Category, object, active-cutoff convention, counterterm class, schemes,
    controls, coefficient grid, determinant ownership, route tuple, and stop
    rules were frozen before authority canonical outputs. The independent
    evaluator imports neither candidate core nor generator.
  arithmetic_origin: >-
    Integer divisibility and its incidence inverse are fixed source relations.
    Covers of the bottom derive active atoms. Positive numeric marks weight all
    objects as transported data but never select atoms. No prime mask,
    factorization oracle, target coefficient table, or target-zero datum is
    supplied to the candidate.
  clock: >-
    z counts completed chiral returns and u counts gamma-code digit steps. The
    main theorem is at u=1. A restored quadratic exponential is a declared new
    functional and does not alter the auxiliary-z divisor of det3.
  normalization: >-
    eta=2 and C_eta=sum mu(k)^2/k^4=zeta(4)/zeta(8). Exact baseline ledgers
    factor out C_eta; B4 ledgers factor out C_eta squared. Formal radicals and
    rational frequency ratios replace floating phase samples.
  determinant_convention: >-
    det3(I-z B_s) remains the inherited honest order-three modified Fredholm
    determinant on 1/3<Re(s)<2/3 and deletes the entire power-two term. The
    finite-part functional det3 times exp(-z^2 FPTr(B^2)/2) is not an ordinary
    Fredholm determinant, not det2, and not a new det3 ownership claim.
  regularization_order: 3
  main_theorem_u: 1
  orbit_cutoff: >-
    Baseline active atom sets induced by integer cutoffs 12,18,30; every
    unordered pair at each cutoff; every pair in four finite source controls;
    all 49 frozen local-coefficient combinations.
  cutoff: >-
    Ambient compilation followed by finite active-atom cutoff for the infinite
    divisibility theorem. Finite source recompilations are separate standalone
    compiler and control checks; their Grams are not identified with ambient
    compressions.
  precision: >-
    Exact integers, fractions.Fraction rationals, formal squarefree radicals,
    exact incidence matrices, JSON/CSV ledgers, and SHA-256. No sampled phase
    or floating statistic decides a claim.
  training_data: none
  allowed_data:
    - fixed finite pointed-poset relations and lower-order-ideal embeddings
    - relation-derived zeta and Mobius incidence matrices
    - source covers and uniformly transported numeric marks
    - exact weighted Gram contractions and analytic divisibility formulas
    - frozen rational local-counterterm coefficients and summability bounds
    - mutated-cover, composite-only, seeded-DAG, and random-inventory controls
    - standard Schatten and modified Fredholm determinant identities
    - deterministic SHA-256 artifact auditing
  forbidden_data:
    - supplied prime or color projector tables
    - primality, factorization, or numeric-label selection in the candidate
    - target Euler coefficients or target-zero data
    - tuning a counterterm after viewing baseline outcomes
    - arbitrary monotone-map functoriality or a universal nonlocal no-go
    - a finite B2 ledger presented as an infinite ordinary trace
    - D_ren presented as an ordinary determinant or det2
    - damping u below one presented as continuation at u=1
    - cross-family repairs, Route-B operators, or RH claims
  code_commit: e16302ac48af1ddac5b519d4785fb74db10b3f96
