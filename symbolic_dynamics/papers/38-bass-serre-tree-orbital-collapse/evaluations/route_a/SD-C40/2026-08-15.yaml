source_lock:
  candidate_definition: >-
    On the full oriented-edge geodesic shift of the presentation-canonical
    Bass-Serre tree for the original ascending HNN splitting of BS(1,r), test
    whether the canonical signed height/modular cocycle yields a nonempty
    source-selective primitive ledger and an ordinary Fredholm determinant.
    This is a new object with no inherited same-object or same-marker credit.
  object: >-
    The unquotiented Bass-Serre tree of the presentation
    <u,v | vuv^-1=u^r>, its full nonbacktracking oriented-edge shift, and
    only the canonical HNN height/modular cocycle. Quotient graphs,
    fundamental domains, arbitrary representations, radial damping, and
    alternative splittings are separately typed and excluded.
  family: symbolic_dynamics
  phase_space: >-
    All oriented edges of the original Bass-Serre tree, with a transition to
    each continuing oriented edge except the immediate reverse. No quotient,
    first return, end space, group-conjugacy ledger, or support projection is
    identified with this phase space.
  dynamics: >-
    One geodesic step advances one Bass-Serre tree edge. A tree has no
    positive-length reduced closed path, so the literal full-tree primitive
    ledger is empty. The separately declared positive-height conjugacy
    calculation is an orbital boundary control rather than this dynamics.
  parameters: >-
    Balanced r=1; prime r=2,3,5,7; composite baseline r=4 and controls
    r=6,8,9,10,12; 18 deliberate BS(p,q) presentations; 64 deterministic
    random cyclically reduced two-generator one-relator controls at seed
    380038; exact counts through height twelve; explicit residue orbits for
    r<=5 and k<=6; fresh A/B and isolated cold C.
  parameter_provenance: >-
    SOURCE_LOCK.md, root PREREGISTRATION.md, experiments/PREREGISTRATION.md,
    and experiments/EXPERIMENT_PLAN.md froze the new object, controls,
    source/evaluator firewall, decision rule, marker boundary, and Route tuple
    before canonical result generation. docs/RESEARCH_LOCK.json locks exactly
    the five stable research files and the two corrected experiment plans;
    docs/CORRECTED_PROTOTYPE_LOCK.json versions the audit-driven r=1 boundary
    correction without overwriting the legacy seed.
  arithmetic_origin: >-
    The integer r is the HNN index in the source presentation and the
    canonical modulus is r to signed height. No prime table, factor oracle,
    accepted-support table, target coefficient, target zero, fitted
    representation, or network data enters either process.
  clock: >-
    The free variable counts one Bass-Serre tree-edge transition. This is a
    new marker and receives no credit from the old Cayley generator-step
    clock; elliptic base words and many-to-one marker witnesses are retained.
  normalization: >-
    The only allowed weighting is a power of the canonical modular cocycle as
    a function of signed height. No basepoint, summable radial damping,
    quotient normalization, reciprocal-infinite-stabilizer zero convention,
    or arbitrary local system is permitted.
  determinant_convention: >-
    Route ownership requires the ordinary Fredholm determinant of the same
    full-tree Hashimoto operator. A formal trace series, quotient determinant,
    tree-lattice orbital determinant, von Neumann determinant, or positive-
    height group-conjugacy Euler product is not that determinant.
  regularization_order: "not_applicable; full_tree_operator_noncompact_non_trace_class"
  main_theorem_marker: "one new Bass-Serre tree-edge step; no inherited Cayley marker credit"
  orbit_cutoff: >-
    Necklace and primitive counts through height twelve, direct residue
    orbits through r<=5 and k<=6, three finite rooted-tree checks, six
    orthogonal-column truncations for each of five r rows, 18 GBS controls,
    64 random controls, and five marker rows.
  cutoff: >-
    Finite rows certify implementation, formulas, controls, separation, and
    reproducibility only. Tree no-cycle, noncompactness, action nonproperness,
    determinant inapplicability, and marker ownership have independent
    proofs. At r=1 the automorphism-group image is discrete but
    the action has infinite kernel; for r>=2 the faithful image is
    nondiscrete, and the action is nonproper for every r.
  precision: >-
    Exact integers and fractions.Fraction, canonical UTF-8 JSON/CSV/YAML,
    byte comparison, and SHA-256; no floating tolerance, sampling estimate,
    external data, or network call.
  training_data: none
  allowed_data:
    - original ascending HNN presentation and canonical Bass-Serre splitting
    - tree adjacency and formal inverse-edge nonbacktracking transition
    - canonical signed HNN height and modular cocycle
    - independently parsed deliberate GBS and seeded random relators
    - exact Burnside Mobius residue-orbit and formal-series arithmetic
  forbidden_data:
    - prime or factor tables accepted support target coefficients or target zeros
    - arbitrary finite-dimensional representation local system or character
    - quotient fundamental domain end-space or group-conjugacy substitution
    - basepoint radial damping altered clock or reciprocal infinite size as zero
