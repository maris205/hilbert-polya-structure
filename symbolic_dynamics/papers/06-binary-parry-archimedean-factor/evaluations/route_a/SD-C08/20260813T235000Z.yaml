source_lock:
  candidate_definition: "SD-C08 is the SD-C07 identity-adjacency tensor-atom suspension, extended functorially by the unique least-entropy tensor atom F_2, its canonical maximal-entropy Parry kernel K_2=J_2/2, the Hellinger half-density pairing, and the sign-additive tilted transfer. The executable uses the cyclic representative H_cyc(u)=K_2 diag(exp(-iu),exp(iu)); the manuscript uses H_sym(z)=exp(zQ/2)K_2 exp(zQ/2). With z=iu up to the frozen sign convention, these are cyclic/similar representatives with identical power traces and characteristic determinants, not distinct objects. The stationary and sign sectors are the two multiplicity-one S_2 sectors of the same binary symbolic fiber."
  object: "The tensor-prime atom-loop shift with entropy roof, carrying at every atom the stationary rank-one K_2 block and carrying in the internally distinguished F_2 fiber the canonical sign observable, its tilted cyclic transfer, its Birkhoff fluctuation law, and the block-preserving Hellinger chiral pairing."
  family: "symbolic dynamics"
  phase_space: "Base phase space Y_tensor consists of constant one-sided sequences in the tensor-atom alphabet with identity adjacency. The auxiliary finite phase space is the two-symbol full shift F_2 with its Parry measure; the atom Hilbert module is l2(At) tensor C^2, and the binary Birkhoff process lives on F_2 with no cross-atom transition added."
  dynamics: "Left shift on the identity-adjacency tensor-atom base with entropy suspension, the Bernoulli left shift on the canonical F_2 Parry fiber, matrix-weighted atom transfer A_s=direct_sum_p p^(-s)K_2, the tilted transfer represented cyclically by H_cyc(u)=K_2 diag(exp(-iu),exp(iu)) or symmetrically by H_sym(z)=exp(zQ/2)K_2 exp(zQ/2), and the block-preserving Hellinger chiral double."
  parameters: "No fitted model parameters. The binary alphabet size 2 is selected as the unique least nonunit tensor atom; K_2 is its maximal-entropy Parry kernel; the sign line is its unique centered irreducible sector; the self-dual factor 2*pi is fixed before computation."
  parameter_provenance: "Cartesian tensor product and topological entropy select F_2; maximal entropy selects K_2; the S_2 isotypic decomposition selects the trivial and sign lines; centered Gaussian variance and the self-dual Fourier convention select sqrt(2*pi*N)."
  arithmetic_origin: "In the symmetric monoidal skeleton of finite full shifts, F_m tensor F_n is F_mn, nonunit tensor atoms are F_p, the atom-loop primitive orbit has entropy length log p, and its r-fold repetition has length log(p^r). F_2 is the unique least-entropy atom in this internally recovered inventory."
  clock: "The arithmetic orbit clock is topological entropy tau(F_p)=log p with no rescaling or offset. The independent fluctuation index is the intrinsic discrete F_2 iteration count N, normalized by the proved square-root fluctuation scale."
  normalization: "Y_N=S_N/sqrt(2*pi*N) for odd N and H(u)=K_2 diag(exp(-iu),exp(iu)). The factor pi is the self-dual Fourier normalization, the exponent 1/2 is the fluctuation exponent, and no critical-line zero data select either."
  determinant_convention: "A_s=direct_sum_p p^(-s)K_2 and D_E(s)=det(I-A_s)=product_p(1-p^(-s))=1/zeta(s) for Re(s)>1; equivalently the odd one-particle Berezinian is zeta(s). The Archimedean output is the separate Mellin limit M(s)=pi^(-s/2) Gamma(s/2) for Re(s)>0. Their product is called a same-source Mellin-Fredholm factorization, not a single determinant."
  cutoff: "Recovered tensor atoms through 4096 for inventory diagnostics and through 512 for all 97 K_2/chiral block certificates; odd binary cutoffs N=31,127,511,2047,8191,32767; radial K_3 cutoffs 31,127,511 and K_4 cutoffs 31,63,127; complete 24-point complex Mellin grid."
  precision: "Direct finite matrix algebra and normalized log-binomial/log-multinomial probabilities; IEEE-754 binary64 for complex grids and residuals; mpmath only for the auxiliary prime-pressure root. Slow and ill-conditioned grid corners are retained."
  orbit_cutoff: "The base primitive/repetition ledger is an infinite theorem. Finite verification uses all recovered atoms p<=512 and trace powers r=1,...,12; no periodic orbit is selected or discarded by a numerical score."
  training_data: "none; there is no fitting, validation split, target spectrum, or Riemann-zero data"
  allowed_data: "Finite full-shift tensor table, topological entropy, maximal-entropy Parry kernels, S_q representation data, exact binomial and multinomial counts, preregistered finite cutoffs, and deterministic random-control seeds."
  forbidden_data: "Prime or Riemann-zero tables in the candidate definition, fitted roofs or signs, copied Gamma factors or functional equations, post-hoc cutoff selection, treating the Mellin-Fredholm product as one determinant, unproved analytic continuation, hidden regularization counterterms, cross-candidate coordinate splicing, cross-family development, and Route B."
