a0:
  verdict: A0_STRUCTURAL_ARITHMETIC_RELATION
  evidence_status: PROVED
  strongest_evidence: >-
    The source is the affine arithmetic semigroup with its intrinsic
    multiplication law and multiplicative energy; all n>=2 belong to the full
    comparison source, so no prime table or accepted-support predicate is
    embedded. The source/evaluator firewall and frozen source manifest pass.
  strongest_failure: >-
    Structural arithmetic origin is not prime selectivity. The same reduced
    affine relation polygon survives for composite r=4, controls r=2,3,5,
    mutated one-relator monoids, and generic dilation commutators.
  arithmetic_controls:
    - composite baseline r=4 and controls r=2,3,5
    - mutated relations V U^2=U^5 V, V U^3=U^7 V, and V U^2=U^8 V
    - generic dilation commutation pairs including composite labels
    - evaluator-only prime-Fock basis explicitly marked as preloaded
    - full all-n>=2 affine generator rule with no prime oracle
  artifacts:
    - results/source_evaluator_firewall.json
    - results/source_manifest.json
    - results/control_evaluation.json
    - results/prototype_bridge.json

