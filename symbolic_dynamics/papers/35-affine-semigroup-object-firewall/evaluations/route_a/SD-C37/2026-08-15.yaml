source_lock:
  candidate_definition: >-
    The composite-baseline affine monoid P_4=<u,v | vu=u^4v>^+ is evaluated
    through its positive right Cayley graph, formal symmetrization, and
    Hashimoto edge graph. P_r for r=2,3,5, the full N_0 semidirect N^times
    graph, finite quotients, and Bost-Connes diagonal/Fock operators are
    explicitly separated controls or comparison objects.
  object: >-
    The primary positive object has vertices (b,k) in N_0^2 and original
    generator edges U(b,k)=(b+r^k,k), V(b,k)=(b,k+1). Symmetrization and the
    Hashimoto edge graph are changed objects. No terminal projector, prime
    basis, finite quotient, boundary representation, or diagonal Gibbs
    operator inherits primary determinant ownership.
  family: symbolic_dynamics
  phase_space: >-
    Positive right-Cayley paths on P_r, formal inverse-edge paths, and oriented
    nonbacktracking edge paths, each kept on its own natural uninduced state
    space. The full affine graph has countably infinite outdegree and is
    theorem-only for the unweighted adjacency boundary.
  dynamics: >-
    One U or V generator edge is one original dynamical step. Positive edges
    strictly increase h_r(b,k)=b+r^k. Formal inverse edges create two-step
    backtracks; Hashimoto semantics remove immediate reversals but retain the
    affine relation V U V^{-1} U^{-r} and generic commutation relations.
  parameters: >-
    baseline r=4; controls r=2,3,5; origins 0<=b<=12 and 0<=k<=4; two word
    bases; exhaustive words through length 8; twelve operator witnesses;
    q=1,...,12; diagonal beta=2,3 and cutoff 12; evaluator-only prime cutoff
    19 and particle degree 6; exact unweighted U/V edges.
  parameter_provenance: >-
    SOURCE_LOCK.md, root PREREGISTRATION.md,
    experiments/PREREGISTRATION.md, and experiments/EXPERIMENT_PLAN.md freeze
    object ownership, height, marker, unweighted operator, controls, finite
    ranges, Route tuple, and stop rules before final authority regeneration.
  arithmetic_origin: >-
    Affine multiplication on N_0 semidirect N^times supplies a direct
    arithmetic semigroup relation and multiplicative energy without a prime
    oracle. This earns only structural A0: the reduced relation ledger is
    generic in composite and mutated presentations and does not select rational
    primes.
  clock: >-
    The free marker z counts one original U/V generator edge. Hashimoto edge
    states retain the explicit edge-length map. Quotient translation clocks,
    bosonic occupation fugacity, boundary/KMS energy, and z=1 specialization
    are changed markers and cannot be substituted silently.
  normalization: >-
    The primary two-generator operator is unweighted A_+=S+T. Multiplicative
    energy log(a) belongs to the separate full affine/BC comparison. Exact
    fractions are used for all diagonal, determinant, signed, and Fock
    controls; no fitted scale or offset exists.
  determinant_convention: >-
    The requested primary convention would be the ordinary primitive
    trace-log/Fredholm determinant for the same whole graph-step operator. The
    natural finite-degree operators are noncompact, so no such Fredholm
    determinant is claimed. The genuine diagonal det(I-zD_beta) and bosonic
    prime-Fock product are comparison determinants on different spaces and
    markers.
  regularization_order: "not_applicable; no_owned_primary_Fredholm_determinant_or_regularization"
  main_theorem_marker: "one free z for each original U/V generator edge"
  orbit_cutoff: >-
    Complete word census only through length eight at the two frozen bases;
    quotient census only for q=1 through 12. Explicit relation witnesses are
    theorem regressions, not a claim that finite census proves the infinite
    operator statements.
  cutoff: >-
    Height origins 0<=b<=12 and 0<=k<=4, word length at most eight, twelve
    witness rows, quotient moduli at most twelve, diagonal cutoff twelve, and
    Fock particle degree six. Infinite DAG, noncompactness, and infinite
    outdegree conclusions are proof-owned.
  precision: >-
    Exact integers, fractions, symbolic polynomial coefficients, deterministic
    CSV/JSON/YAML, UTF-8/LF canonical text, byte comparison, and SHA-256. No
    floating tolerance or stochastic estimator decides a gate.
  training_data: none
  allowed_data:
    - neutral affine multiplication and U/V generator words
    - exact finite quotient maps and labelled relation words
    - exact rational diagonal and polynomial coefficients
    - evaluator-only generic monoid and prime-Fock control labels after source freeze
    - signed and matrix boundary fixtures kept outside positive ordinary semantics
  forbidden_data:
    - prime or factorization predicates in candidate-source generation
    - accepted-support tables terminal projectors or boundary reductions presented as source recurrence
    - target zeros Riemann-zero fitting fitted scales or best-seed selection
    - quotient or bosonic fugacity presented as the original generator-step marker
