source_lock:
  candidate_definition: >-
    Retain the Paper 19 finite-full-shift semiring skeleton and its explicit
    I/T/Q quotient-search verifier. Contract the terminal acceptance boundary
    so T_(n,d) returns to I_n when d^2>n; equality dq=n enters a one-way
    cemetery. Accepted inputs therefore carry vertex-disjoint recurrent
    cycles, without an accepted-support lookup or prime/factor table.
  object: >-
    The one-sided edge shift of the closed expanded verifier and its
    arrival-weighted adjacency L_s on ell^2 of graph vertices. Accepted cycles,
    rejected computations, and cemetery rays belong to one symbolic object.
  family: symbolic_dynamics
  phase_space: >-
    X_G^+, the one-sided countable Markov edge shift on the union of forward
    paths seeded by I_n for n>=2, with accepted paths closed at the contracted
    terminal boundary and rejected paths continued as one-way rays.
  dynamics: >-
    I_n enters trial d=2. If d^2>n, the terminal trial state returns directly
    to I_n. Otherwise Q_(n,d,q) advances q while dq<n, rejects when dq=n, and
    advances d after dq>n. Reject indices increase forever.
  parameters: >-
    Inputs through 4096; endpoint convention T_(p,floor(sqrt(p))+1)->I_p;
    witness cutoffs 31,127,509,2039,4093; small exact determinant prefix 31;
    s=2; z=1 and 1/3; first four nonzero powers per small prime; sigma=1,2;
    total-decider cutoff 4096 and padded runtime n^2+2.
  parameter_provenance: >-
    Graph rule, endpoint contraction, total roof, cutoffs, markers, controls,
    and Route tuple were frozen before the authority rerun. No parameter was
    fitted and no target-zero datum was available or used.
  arithmetic_origin: >-
    Alphabet successor, tensor multiplication, additive order, and entropy
    h(F_n)=log n come from the finite-full-shift semiring skeleton. Quotient
    states materialize cofactor search using multiplication, successor, and
    comparison. The accept-return closure remains a modeling choice and is
    reproduced by universal total-decider controls.
  clock: >-
    The primary obstruction class consists of all nonnegative edge roofs on
    Gamma_p with exact total log p. Uniform allocation log(p)/ell(p) is only
    the minimax representative. A separate source-roof control retains Paper
    19 edge roofs after redirecting the terminal edge and intentionally has
    total roof much larger than log p.
  normalization: >-
    Arrival weighting e^(-s tau(e)); z counts raw graph edges; primitive
    cycles are directed rotation classes. First-return z counts induced
    returns and is never silently identified with the graph-step marker.
  determinant_convention: >-
    The frozen question is the ordinary Hilbert-space Fredholm determinant
    det_ell2(V)(I-zL_s), admitted only for trace-class L_s. The exact-clock
    whole adjacency is noncompact for Re(s)>0, so that determinant is
    unavailable. The separate combinatorial product
    product_p(1-z^ell(p) p^(-s)) converges on Re(s)>1 for |z|<=1.
  orbit_cutoff: >-
    Formula and explicit path traversal for all 564 primes through 4096;
    exact rational block products and four nonzero repetitions for primes
    through 31. The infinite obstruction is theorem-level, not inferred from
    cutoff fitting.
  cutoff: >-
    Five tail witnesses, two exact marker values, four universal-decider
    controls, one source/Q audit through 64, and 564 prime-cycle rows.
  precision: >-
    Integer transitions and cycle lengths, exact Fraction determinants and
    traces, deterministic float displays for asymptotic witnesses, and
    analytic essential-norm/Schatten proofs. No floating equality or zero
    computation supports a theorem.
  training_data: none
  allowed_data:
    - finite-full-shift alphabet sum, tensor multiplication, additive order, and entropy
    - explicit Q-state successor/multiplication/comparison transitions
    - exact finite path counts, rational products, power traces, and SHA-256 checks
    - independent prime sieve in sealed validation only
    - square, power-of-two, Fibonacci, and seeded-hash total-decider controls
  forbidden_data:
    - prime tables, factor-existence helpers, accepted-support lookups, or hidden divisibility macros
    - target Riemann zeros, zero fitting, or target-derived parameters
    - a recurrent reject loop
    - relabeling the combinatorial orbit product as a nonexistent whole-operator Fredholm determinant
    - silently identifying raw graph-step z with first-return z
    - Gamma factors, functional equations, Weil forms, critical-line claims, or Route-B operators
    - cross-family geometric, quantum, Hamiltonian, or scattering repairs
  code_commit: 17a0424293abf5bba275a52366682d66f810e755
  artifact_paths:
