claim_boundary: >-
  SD-C22 proves the exact cycle census and repetition ledger for a recurrent
  expanded semiring verifier, and proves a distribution-free compactness,
  Schatten, and essential-spectrum obstruction for every nonnegative exact
  Euler-clock allocation on the natural vertex space. The z=1 orbit product
  remains a combinatorial Euler product; first return contracts it to the
  Paper 04 diagonal operator. It does not produce a whole-operator Fredholm
  determinant, continuation, completed divisor, RH result, or Hilbert-Polya
  realization, and it does not exclude overlapping/cancellation grammars or
  nonordinary determinant conventions.
blocking_conditions:
  - exact total roof log p is diluted over ell(p) asymptotic to one-half p log p graph steps
  - the whole adjacency has essential norm one and no finite Schatten class
  - the unit circle lies in the essential approximate spectrum
  - first return changes the graph-step marker and contracts to the Paper 04 diagonal core
  - padded unrelated total deciders reproduce the obstruction
  - no completed analytic structure or natural operator lift is derived
next_smallest_test: >-
  Still within Symbolic Dynamics, freeze an overlapping genuinely recurrent
  semiring-local grammar on all nonunit full-shift objects and first prove or
  refute primitive-cycle separation from all-length, composite,
  multiplication-shuffled, and random-divisibility controls. Do this before
  choosing a roof, character, determinant, or zero comparison.
round2_clues:
