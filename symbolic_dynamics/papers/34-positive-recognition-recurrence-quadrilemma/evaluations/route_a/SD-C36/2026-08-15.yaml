claim_boundary: >-
  SD-C36 gives a complete exact census only for loop-allowed positive directed
  graph masks on at most four vertices and deterministic finite controls on
  five through eight vertices. It preserves the 18272 counterexamples to the
  preregistered strict connector witness and validates the repaired finite
  property on 844544 pairs. The arbitrary countable-graph recurrence and
  Kraft-clock conclusions belong to the proof, not the census. Signed,
  matrix-valued, nonlocal, infinite-alphabet, anisotropic, nonstationary, and
  genuinely different symbolic systems remain outside the conclusion.

blocking_conditions:
  - shared positive recurrent states close under concatenation into mixed primitive roots
  - distinct cycles in one SCC admit arbitrary mutual paths and hence a mixed closed word
  - acyclic terminal recognition is pruned from closed-orbit traces
  - recurrent support pruning changes the operator and determinant ownership
  - finite-alphabet orbit separation with total roof log n forces the Kraft-clock noncompactness mechanism
  - first-return induction changes the free marker from graph length to return count
  - no analytic or natural-liftability bridge survives A1 and A2

next_smallest_test: >-
  Do not replace the terminal decider or reopen the residue/Manin family. If a
  later project is separately source-locked, use an ax+b or
  Bost-Connes-type symbolic model only as a benchmark for whether recognition
  is intrinsic before recurrence and whether the original marker and natural
  operator are preserved.

round2_clues:
  - source-locked recognition-before-recurrence is the reusable ownership test
  - transient-pruning and terminal orbitification must be separated
  - positive concatenation closure needs positivity cyclic distinctness and mutual recurrence
  - the repaired SCC proof uses arbitrary paths and does not require shortest external interiors
  - first-return inducing is legitimate only as a changed-marker construction
  - signed and matrix cancellations are sharp boundaries rather than positive-scalar counterexamples

route_b_invocation_allowed: false
