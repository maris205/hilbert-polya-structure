source_lock:
  candidate_definition: >-
    A stationary countable positive-scalar directed graph is asked to realize
    a literal arithmetic orbit ledger: exactly one primitive orbit for each
    multiplicatively free atom and no other primitive orbit, with total roof
    log n after arithmetic specialization. Recognition must occur before
    recurrence and ownership is judged with one free marker z per original
    graph edge.
  object: >-
    The primary object is the natural vertex adjacency of the frozen positive
    recognizer graph. Terminal accept or reject labels, label-dependent
    pruning, first-return induction, signed weights, and matrix weights are
    controls or changed objects and cannot inherit its determinant ownership.
  family: symbolic_dynamics
  phase_space: >-
    One-sided paths on a stationary directed graph with positive scalar edge
    weights; finite loop-allowed graph masks are exact theorem-regression
    instances, not a replacement for the countable-graph proof.
  dynamics: >-
    One original directed edge is one dynamical step. Recurrent SCCs generate
    closed words and primitive roots; acyclic recognition states cannot enter
    closed walks.
  parameters: >-
    exhaustive loop-allowed graph masks on n=1,2,3,4 vertices; 64
    SHA-deterministic strongly connected controls on n=5,6,7,8; q=2,3,4;
    cutoffs=31,127,511,2047; 17 marker factors; 8 frozen post-source
    inventories; exact rational weight exponent 2.
  parameter_provenance: >-
    SOURCE_LOCK.md, PREREGISTRATION.md, and experiments/EXPERIMENT_PLAN.md
    freeze the object, algorithmic separation, finite classes, counterexample
    policy, controls, and stop rule before authority results were generated.
  arithmetic_origin: >-
    The multiplicatively free source atoms and their specialization to prime
    generators provide the structural arithmetic relation. No prime-support
    predicate, accepted inventory, factor table, or target-zero table enters
    the candidate-source graph generator.
  clock: >-
    The free marker z counts original graph edges. A raw cycle of graph length
    ell contributes z^ell; first-return induction contributes z and is
    therefore a changed-clock comparison object.
  normalization: >-
    The total roof assigned to the orbit encoding n is log n. Finite code rows
    retain exact integer length inequalities and exact rational roof shares;
    the infinite noncompactness conclusion belongs to the analytic proof.
  determinant_convention: >-
    det(I-zA) for the natural vertex adjacency, computed exactly by Newton
    identities and independently reconstructed as the product over recurrent
    SCCs. Label-dependent recurrent pruning defines a different operator.
  regularization_order: "not_applicable; finite determinants are polynomial and the countable trace-class claim is obstruction-only"
  main_theorem_marker: "one free z for each original graph edge"
  orbit_cutoff: >-
    Complete finite masks for n at most 4; 64 deterministic finite controls for
    n=5 through 8; no finite cutoff is promoted to proof of the countable
    theorem.
  cutoff: >-
    Complete enumeration and finite controls are reported separately. The
    arbitrary-SCC-path theorem and Kraft-clock noncompactness statement are
    analytic arguments independent of these finite counts.
  precision: >-
    Exact integers, fractions, symbolic polynomial coefficients, deterministic
    SHA-derived controls, UTF-8/LF text, byte comparison, and SHA-256. No
    floating-point tolerance or stochastic estimator is used.
  training_data: none
  allowed_data:
    - directed graph masks and edge incidence
    - positive rational weights and exact polynomial coefficients
    - q-ary prefix words lengths and rational roof shares
    - independent post-source inventory labels used only by the evaluator
    - deterministic hash-derived finite controls fixed before evaluation
  forbidden_data:
    - prime or accepted-support predicates in candidate-source generation
    - factor tables primality libraries target zeros or Riemann-zero fitting
    - terminal accept loops presented as dynamically emergent recurrence
    - label-dependent pruning presented as the unclassified source operator
    - first-return z presented as the original graph-step marker
    - signed or matrix cancellation presented as a positive-scalar result
