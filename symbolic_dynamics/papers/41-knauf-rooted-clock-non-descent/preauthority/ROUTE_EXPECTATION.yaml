source_lock:
  candidate_definition: >-
    Test whether the exact rooted Knauf h label, its trailing-zero direct
    limit, ordinary cyclic quotient and word powers, and the literal
    Liouville observable descend to a canonical scalar primitive/repetition
    ledger; separately type the diagonal state-inventory trace and its owned
    marked determinant.
  object: >-
    Knauf rooted binary words with M_0=L, M_1=R and
    h(w)=one^T M_w e_1, plus the direct limit under w->w0.
  family: symbolic_dynamics
  phase_space: >-
    Finite rooted layers {0,1}^k and their trailing-zero colimit; binary
    necklaces and trace-word models are explicitly changed comparison types.
  dynamics: >-
    Source binary refinement only. The canonical right append-one operation
    does not descend to the trailing-zero colimit; no substitute autonomous
    map is assumed.
  parameters: exact_words_of_length_at_most_3_no_numeric_cutoff
  parameter_provenance: >-
    Retrospective closure of the immutable SD-C06 historical
    next_smallest_test after the six cards, original results, and exact
    witnesses were known. No prospective selection, target data, tuning, or
    Paper-40 authorization/correction is used.
  arithmetic_origin: >-
    Full stable h-multiplicity is Euler phi and the source-proved unsigned
    partition limit is zeta(s-1)/zeta(s) on Re(s)>2.
  clock: log(h(w)) on rooted words
  normalization: none
  determinant_convention: >-
    Source partition trace is not promoted to a primitive determinant. The
    comparison determinant det(I-uQ_s) belongs to the diagonal state
    inventory with a distinct free marker u.
  function_space: >-
    C^({0,1}^k) at finite depth; ell^2 of stable states only for the diagonal
    inventory comparison; no limiting dynamical transfer space asserted.
  roof_function: log(h(w)) on rooted words only
  potential_function: unsigned_unit_weight
  cocycle: >-
    No endogenous scalar cocycle. lambda(h(w)) is an external arithmetic
    observable and fails cyclic and temporal-power descent.
  cutoff: not_applicable_exact_finite_witness_theorems
  precision: exact_integer_matrix_arithmetic
  orbit_cutoff: not_applicable_no_intrinsic_periodic_orbit_ledger
  training_data: none
  allowed_data:
    - frozen Session-4 cards and source files
    - exact L/R matrix products
    - algorithmic Liouville values at generated integers
    - primary literature and sealed Route records
  forbidden_data:
    - Riemann zero tables or fitting
    - external prime-indexed components
    - changed trace or Gauss/Mayer model credited to SD-C06
    - Paper-40 corrections used as novelty or authorization
    - prospective or outcome-independent selection claims
  code_commit: PENDING_FIRST_ARTIFACT_COMMIT
  artifact_paths:
