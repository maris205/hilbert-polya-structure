    w->w0.
  family: symbolic_dynamics
  phase_space: Finite rooted layers and their trailing-zero colimit; necklaces and trace-word models are
    changed comparison types.
  dynamics: Source binary refinement only; right append-one does not descend to the stable-state quotient.
  parameters: exact words of length at most three plus an exact finite diagonal consistency control
  parameter_provenance: Retrospective closure after all six cards, results, and witnesses were known;
    no prospective or outcome-independent claim.
  arithmetic_origin: Source-proved stable multiplicities phi(n) give zeta(s-1)/zeta(s) on Re(s)>2 without
    a prime table.
  clock: log(h(w)) on rooted words only
  normalization: none
  determinant_convention: det(I-uQ_s) belongs to diagonal state inventory and is not promoted to a primitive-return
    determinant.
  roof_function: log(h(w)) on rooted words only
  potential_function: unsigned_unit_weight
  cocycle: No endogenous scalar cocycle; lambda(h(w)) is external and fails cyclic and power descent.
