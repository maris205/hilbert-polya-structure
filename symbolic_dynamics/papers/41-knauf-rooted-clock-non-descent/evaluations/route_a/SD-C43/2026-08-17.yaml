source_lock:
  candidate_definition: Test whether the exact rooted Knauf h label, trailing-zero direct limit, ordinary
    cyclic quotient and word powers, and literal Liouville observable descend to a canonical scalar primitive/repetition
    ledger; separately type the diagonal inventory.
