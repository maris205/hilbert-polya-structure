    count prefixes of the multiplicative SFT A[x_n,x_qn]=1, subtract its
    leading entropy, identify the exact real q-adic boundary image, and test
    the golden control for strong separation and dense radial singularities.
  object: multiplicative_shift_of_finite_type_X_A_q
  family: symbolic_dynamics
  phase_space: finite_alphabet_power_N_with_multiplicative_constraints
  dynamics: one_sided_multiplicative_integer_constraint
  parameters: explicit_integer_q_and_primitive_zero_one_A
  parameter_provenance: >-
    q and A are direct source inputs. No target zero, prime list, fitted
    coefficient, cutoff-dependent parameter, or empirical dimension is used.
  arithmetic_origin: explicit_q_adic_chain_grammar
  clock: finite_prefix_cutoff_N
  normalization: log_Z_N_minus_h_times_N
  determinant_convention: not_applicable_G_is_an_ordinary_cutoff_generating_function
  regularization_order: not_applicable
  main_theorem_marker: z_marks_prefix_size_N_only_in_secondary_G
  function_space: >-
    E_A_q is a continuous real-valued function on the compact inverse limit
    Z_q; G is analytic only on the open unit disk before continuation tests.
  roof_function: not_applicable
  potential_function: zero_for_prefix_count
  cocycle: valuation_increment_sequence_c_nu_q_N
  orbit_cutoff: not_applicable_no_periodic_orbit_census
  cutoff: integer_prefix_1_through_N
  precision: exact_integer_formal_log_algebraic_and_certified_interval
  training_data: none
  allowed_data:
