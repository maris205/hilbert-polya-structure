    - accepted Papers 1 through 43 for collision and chronology only
    - exact finite prefix enumeration and exact matrix powers
    - Perron-Frobenius theory and inverse-limit topology
    - exact rational Q_sqrt5 and cyclotomic arithmetic
    - primary literature and certified interval checks
  forbidden_data:
    - target zero fitting or parameter optimization
    - finite cutoff substituted for an all-level theorem
    - leading entropy or dimension claimed as new
    - ordinary Minkowski content inferred from integer cutoffs
    - G retyped as Artin-Mazur zeta Fredholm determinant or transfer trace
    - dense radial singularities called isolated meromorphic poles
    - nonprimitive A retained under the primitive theorem label
